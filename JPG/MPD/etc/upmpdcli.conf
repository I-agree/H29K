# H29K 覆写：upmpdcli 配置
# 说明：命令行参数优先于本文件；未列出的项均使用上游编译默认值。

# 标准 UPnP/AV MediaRenderer 显示名。
# 上游默认会在 friendlyname 后自动拼接 "-UPnP/AV" 后缀，这里直接指定裸名。
avfriendlyname = H29K 投音

# 不开 OpenHome Source 服务，避免网络列表里出现第二条同名设备。
openhome = 0

# MPD 命令超时（毫秒，上游默认 2000，范围 0~30000）。
# 在线 FLAC 流 seek 要先断开旧 HTTP 连接、带 Range 头重连，再让 FLAC 库
# 重新做帧同步定位；这套动作在公网 CDN 上常超过 2s。默认 2s 超时会让
# libmpdclient 先断开，upmpdcli 报 seek_pos Timeout / code -911，MPD 侧
# seeking 状态没正常收尾，表现为进度条和播放时间卡住不动。放宽到 10s
# 给重连和定位留足时间。
mpdtimeoutms = 10000
