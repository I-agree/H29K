# MPD 配置 —— H29K 双渲染器方案
#
# 分工：gmediarender 负责视频投屏（HDMI / kmssink），MPD + upmpdcli 只负责
# 蓝牙耳机/音箱听歌。手机端会看到两个渲染器，按名字选择。
#
# 输出只有蓝牙一条；不要在这里加 plughw:0,0，避免和 gmediarender 抢声卡。

music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
log_file            "syslog"
bind_to_address     "127.0.0.1"
port                "6600"

# 记住软件音量。文件随固件预置一个保守初始音量（见 /etc/mpd.state），
# 之后手机端调的音量会回写这个文件，重启不再回到默认 100%。
state_file          "/etc/mpd.state"
state_file_interval "10"

audio_output {
        type            "alsa"
        name            "Bluetooth"
        device          "bluealsa"

        # 始终持有 ALSA 输出：停止播放时只挂起不关闭 PCM，
        # BlueZ 不会释放 A2DP transport。
        always_on       "yes"

        # 暂停/切曲时也不要关闭 PCM。close_on_pause 默认 yes，每次暂停都会
        # snd_pcm_close，bluealsa 随之挂起 A2DP transport，耳机就在换曲间隙
        # 响一声提示音。
        close_on_pause  "no"

        # 锁死固定输出格式。混播不同采样率/位深时，若不固定，源格式一变，
        # 输出线程就会关闭重开 PCM（又是一次 transport 上下线，换曲间隙响
        # 提示音）。固定成下面这一组，PCM 一次打开不再重开。
        # 本机在线 FLAC 实测为 44.1k（44100:16:2 / 44100:24:2），耳机也支持
        # 44.1k 协商；锁 44.1k 后 44.1k 源不再被上采样到 48k，省掉一道 soxr
        # 重采样。24bit 源由 MPD 转 16bit（位深转换，开销远低于重采样）；
        # 若偶发 48k 曲目，才由 soxr 降到 44.1k。
        # 若刷机后耳机打不开声音，先用 `bluealsactl info <pcm>` 看耳机实际
        # 协商的采样率，再调整下面这一行。
        format          "44100:16:2"

        auto_resample   "yes"
        auto_format     "yes"

        # 软件音量：手机端调音量才真正作用到输出，
        # 不依赖耳机侧 AVRCP（那一路在这台耳机上是固定满档的）
        mixer_type      "software"
}

# curl 输入插件诊断开关。verbose=yes 会把每次 HTTP 连接、Range 请求、
# 响应状态码写进 syslog（logread），用来定位拖进度条时 seek 卡在哪一步。
# 定位完成后把 yes 改成 no 即可减少日志量。
input {
        plugin          "curl"
        verbose         "yes"
}
