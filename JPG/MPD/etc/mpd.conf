# MPD 配置 —— H29K 双渲染器方案
#
# 分工：gmediarender 负责视频投屏（HDMI / kmssink），MPD + upmpdcli 只负责
# 蓝牙耳机/音箱听歌。手机端会看到两个渲染器，按名字选择。
#
# 这里是整套方案的关键：always_on "yes" 让 MPD 始终保持 ALSA 输出打开。
# 只要 bluealsa 的 PCM 一直被持有，BlueZ 就不会释放 A2DP transport，
# 换曲时耳机侧收不到一次新的 A2DP Start，也就不会有那声"叮"。
# 把 always_on 改成 no，本机就退回和 gmediarender 一样的毛病。
#
# 输出只有蓝牙一条；不要在这里加 plughw:0,0，避免和 gmediarender 抢声卡。

music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
log_file            "syslog"
bind_to_address     "127.0.0.1"
port                "6600"

audio_output {
        type            "alsa"
        name            "Bluetooth"
        device          "bluealsa"
        always_on       "yes"
        # bluealsa 的 PCM 只吃 A2DP 协商出来的那一组参数（通常是 44.1k/48k S16 stereo），
        # 源格式对不上就让 MPD 自己转（mpd-full 带 libsoxr，能重采样）
        auto_resample   "yes"
        auto_format     "yes"
        # 软件音量：手机端调音量才真正作用到输出，
        # 不依赖耳机侧 AVRCP（那一路在这台耳机上是固定满档的）
        mixer_type      "software"
}
