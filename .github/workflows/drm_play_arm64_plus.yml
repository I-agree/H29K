          }

          static int json_get_field(const char *json, const char *key,
                                    char *out, size_t out_size) {
              char pattern[128];
              snprintf(pattern, sizeof(pattern), "\"%s\"", key);
              const char *p = strstr(json, pattern);
              if (!p) return -1;
              p = strchr(p + strlen(pattern), ':');
              if (!p) return -1;
              p++;
              while (*p == ' ' || *p == '\t' || *p == '\n' || *p == '\r') p++;
              size_t i = 0;
              if (*p == '"') {
                  p++;
                  while (*p && *p != '"' && i < out_size - 1) {
                      if (*p == '\\' && *(p+1)) {
                          p++;
                          switch (*p) {
                              case 'n': out[i++] = '\n'; break;
                              case 't': out[i++] = '\t'; break;
                              case '"': out[i++] = '"'; break;
                              case '\\': out[i++] = '\\'; break;
                              default: out[i++] = *p; break;
                          }
                      } else out[i++] = *p;
                      p++;
                  }
              } else {
                  while (*p && *p != ',' && *p != '}' && *p != ']' &&
                         *p != '\n' && i < out_size - 1) out[i++] = *p++;
                  while (i > 0 && (out[i-1]==' '||out[i-1]=='\t'||out[i-1]=='\r')) i--;
              }
              out[i] = '\0';
              return (i > 0) ? 0 : -1;
          }

          static char *popen_read(const char *cmd) {
              FILE *fp = popen(cmd, "r");
              if (!fp) return NULL;
              size_t cap = 8192, len = 0;
              char *buf = malloc(cap);
              if (!buf) { pclose(fp); return NULL; }
              size_t n;
              while ((n = fread(buf + len, 1, cap - len - 1, fp)) > 0) {
                  len += n;
                  if (len >= cap - 1) {
                      cap *= 2;
                      char *t = realloc(buf, cap);
                      if (!t) { free(buf); pclose(fp); return NULL; }
                      buf = t;
                  }
              }
              pclose(fp);
              buf[len] = '\0';
              return buf;
          }

