name: （开机动画）+ 四页触摸信息屏

on:
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xxd

      - name: Download MP4
        run: |
          curl -L -o apple.mp4 "https://raw.githubusercontent.com/I-agree/H29K/main/JPG/apple.mp4"

      - name: Convert MP4 to RAW (XRGB8888, 172x172)
        run: |
          ffmpeg -i apple.mp4 -f rawvideo -pix_fmt bgr0 apple.raw
          ls -lh apple.raw

      - name: Embed RAW into C header
        run: |
          xxd -i apple.raw > apple_raw.h
          head -2 apple_raw.h

      - name: Download stb libraries
        run: |
          curl -L -o stb_image.h "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h"
          curl -L -o stb_truetype.h "https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h"
          curl -L -o stb_image_resize2.h "https://raw.githubusercontent.com/nothings/stb_image_resize/main/stb_image_resize2.h"
          ls -lh stb_*.h

      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Setup ARM64 libdrm (Sysroot Method)
        run: |
          sudo dpkg --add-architecture arm64
          UBUNTU_CODENAME=$(lsb_release -cs)
          echo "deb [arch=arm64 trusted=yes] http://ports.ubuntu.com/ubuntu-ports $UBUNTU_CODENAME main" | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list
          sudo apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/ubuntu-ports-arm64.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"

          mkdir -p /tmp/arm64-sysroot
          cd /tmp/arm64-sysroot
          apt-get download libdrm-dev:arm64 libdrm2:arm64 libdrm-common
          for deb in *.deb; do
            dpkg -x "$deb" .
          done

      - name: Create UI logic header (drm_ui_logic.h)
        run: |
          cat << 'ENDOFLOGIC' > drm_ui_logic.h
          /* drm_ui_logic.h — 纯逻辑（无 I/O、无 DRM、无 stb 依赖），可在宿主机单元测试
           *
           * 亮度曲线：DTS brightness-levels 为 0..255 恒等线性（已实测 duty = level/255*25000ns），
           * 但人眼感知非线性，故 UI 百分比 -> level 采用 gamma 2.2 校正，
           * 并把可用区间压到 [bl_min, bl_max]，避免用户把屏幕调到全黑后误以为死机。
           */
          #ifndef DRM_UI_LOGIC_H
          #define DRM_UI_LOGIC_H

          #include <math.h>

          #define UIL_GAMMA 2.2
          /* 低亮度端掺入的线性分量：纯 gamma 在 0~6% 行程会塌缩到同一个 level（死区），
           * 掺 10% 线性后全程单调可分辨，同时保留 gamma 的感知特性。 */
          #define UIL_LIN_MIX 0.10

          static inline int uil_clampi(int v, int lo, int hi)
          {
              if (hi < lo) { int t = lo; lo = hi; hi = t; }
              if (v < lo) return lo;
              if (v > hi) return hi;
              return v;
          }

          /* UI 百分比(0..100) -> 背光 level(bl_min..bl_max)，gamma 2.2 + 10% 线性混合 */
          static inline int uil_ui_to_level(int percent, int bl_min, int bl_max)
          {
              double p, t;
              int lv;
              if (bl_max <= bl_min) return bl_max;
              percent = uil_clampi(percent, 0, 100);
              p = (double)percent / 100.0;
              t = UIL_LIN_MIX * p + (1.0 - UIL_LIN_MIX) * pow(p, UIL_GAMMA);
              lv = (int)((double)bl_min + (double)(bl_max - bl_min) * t + 0.5);
              return uil_clampi(lv, bl_min, bl_max);
          }

          /* 背光 level -> UI 百分比(0..100)。
           * 混合曲线没有解析逆函数，用二分查找（uil_ui_to_level 单调不减）取最接近的百分比。 */
          static inline int uil_level_to_ui(int level, int bl_min, int bl_max)
          {
              int lo = 0, hi = 100, best = 0, best_err = 0x7fffffff;
              if (bl_max <= bl_min) return 100;
              level = uil_clampi(level, bl_min, bl_max);
              while (lo <= hi) {
                  int mid = (lo + hi) / 2;
                  int lv = uil_ui_to_level(mid, bl_min, bl_max);
                  int err = lv - level;
                  if (err < 0) err = -err;
                  if (err < best_err) { best_err = err; best = mid; }
                  if (lv < level)      lo = mid + 1;
                  else if (lv > level) hi = mid - 1;
                  else                 break;   /* 命中，直接返回最小等价百分比 */
              }
              return uil_clampi(best, 0, 100);
          }

          /* 循环翻页：越界环绕，count<=1 时恒返回 0 */
          static inline int uil_page_step(int cur, int delta, int count)
          {
              if (count <= 1) return 0;
              return ((cur + delta) % count + count) % count;
          }

          /* 手势判定：仅垂直滑动翻页。
           * 返回 +1 = 下一页（下滑），-1 = 上一页（上滑），0 = 不构成翻页。
           * 水平滑动一律返回 0（亮度页改为拖动滑块，不再用左右滑微调）。 */
          static inline int uil_swipe_pages(int dx, int dy, int thresh)
          {
              int adx = dx < 0 ? -dx : dx;
              int ady = dy < 0 ? -dy : dy;
              if (thresh < 1) thresh = 1;
              if (ady < thresh) return 0;
              if (adx >= ady) return 0;
              return (dy < 0) ? 1 : -1;
          }

          /* 拖动位置 -> 百分比(0..100) */
          static inline int uil_slider_percent(int x, int x0, int x1)
          {
              int span = x1 - x0;
              if (span <= 0) return 0;
              return uil_clampi((x - x0) * 100 / span, 0, 100);
          }

          /* 拖动位置 -> 千分比(0..1000)，用于重启滑条 */
          static inline int uil_drag_permille(int x, int x0, int travel)
          {
              if (travel <= 0) return 0;
              return uil_clampi((x - x0) * 1000 / travel, 0, 1000);
          }

          /* 重启是否已到位 */
          static inline int uil_reboot_armed(int permille, int trigger_permille)
          {
              return permille >= trigger_permille ? 1 : 0;
          }

          #endif /* DRM_UI_LOGIC_H */
          ENDOFLOGIC

      - name: Create logic unit test (test_logic.c)
        run: |
          cat << 'ENDOFTEST' > test_logic.c
          /* 纯逻辑单元测试：亮度曲线 / 循环翻页 / 手势判定 / 重启拖动 */
          #include <stdio.h>
          #include <math.h>
          #include "drm_ui_logic.h"

          static int g_fail = 0;
          static int g_pass = 0;

          #define EQ(expr, want) do {                                             \
                  int _got = (expr);                                              \
                  if (_got != (want)) {                                           \
                      printf("FAIL %s:%d  %s => %d, 期望 %d\n",                   \
                             __FILE__, __LINE__, #expr, _got, (want));            \
                      g_fail++;                                                   \
                  } else { g_pass++; }                                            \
              } while (0)

          #define NEAR(expr, want, tol) do {                                      \
                  int _got = (expr);                                              \
                  if (fabs((double)_got - (double)(want)) > (double)(tol)) {      \
                      printf("FAIL %s:%d  %s => %d, 期望 %d±%d\n",                \
                             __FILE__, __LINE__, #expr, _got, (want), (tol));     \
                      g_fail++;                                                   \
                  } else { g_pass++; }                                            \
              } while (0)

          #define BL_MIN 16
          #define BL_MAX 255

          static void test_clamp(void)
          {
              printf("-- clamp --\n");
              EQ(uil_clampi(5, 0, 10), 5);
              EQ(uil_clampi(-5, 0, 10), 0);
              EQ(uil_clampi(50, 0, 10), 10);
              EQ(uil_clampi(0, 0, 10), 0);
              EQ(uil_clampi(10, 0, 10), 10);
          }

          static void test_ui_to_level_endpoints(void)
          {
              printf("-- ui_to_level 端点 --\n");
              EQ(uil_ui_to_level(0, BL_MIN, BL_MAX), BL_MIN);
              EQ(uil_ui_to_level(100, BL_MIN, BL_MAX), BL_MAX);
              /* 越界入参必须被夹住，不能产生越界 level */
              EQ(uil_ui_to_level(-30, BL_MIN, BL_MAX), BL_MIN);
              EQ(uil_ui_to_level(999, BL_MIN, BL_MAX), BL_MAX);
          }

          static void test_ui_to_level_gamma(void)
          {
              printf("-- ui_to_level 感知曲线 --\n");
              /* 线性映射下 50% 会是 level 135；感知校正必须显著低于它 */
              EQ(uil_ui_to_level(50, BL_MIN, BL_MAX) < 100, 1);
              /* 25% 处必须远低于线性值 76，说明分辨率被压到了低亮度区 */
              EQ(uil_ui_to_level(25, BL_MIN, BL_MAX) < 50, 1);
              /* 曲线整体形状：四分位点严格递增且都落在合理区间 */
              EQ(uil_ui_to_level(25, BL_MIN, BL_MAX) > BL_MIN, 1);
              EQ(uil_ui_to_level(75, BL_MIN, BL_MAX) > uil_ui_to_level(50, BL_MIN, BL_MAX), 1);
              EQ(uil_ui_to_level(75, BL_MIN, BL_MAX) < BL_MAX, 1);
          }

          static void test_level_to_ui_endpoints(void)
          {
              printf("-- level_to_ui 端点 --\n");
              EQ(uil_level_to_ui(BL_MIN, BL_MIN, BL_MAX), 0);
              EQ(uil_level_to_ui(BL_MAX, BL_MIN, BL_MAX), 100);
              EQ(uil_level_to_ui(0, BL_MIN, BL_MAX), 0);        /* 低于下限时归 0，不能出负数 */
              EQ(uil_level_to_ui(9999, BL_MIN, BL_MAX), 100);
              /* 用户实测偏好 level 150：应落在滑块的 60%~85% 区间（既不是顶端也不是底端） */
              EQ(uil_level_to_ui(150, BL_MIN, BL_MAX) >= 60, 1);
              EQ(uil_level_to_ui(150, BL_MIN, BL_MAX) <= 85, 1);
              /* 默认亮度 200 应在滑块上半区 */
              EQ(uil_level_to_ui(200, BL_MIN, BL_MAX) > uil_level_to_ui(150, BL_MIN, BL_MAX), 1);
          }

          static void test_no_dead_zone(void)
          {
              printf("-- 滑块全程无死区（每 5%% 行程都必须改变亮度）--\n");
              int p, ok = 1;
              for (p = 0; p <= 95; p += 5) {
                  int a = uil_ui_to_level(p, BL_MIN, BL_MAX);
                  int b = uil_ui_to_level(p + 5, BL_MIN, BL_MAX);
                  if (b <= a) {
                      printf("  死区: %d%%(level %d) -> %d%%(level %d)\n", p, a, p + 5, b);
                      ok = 0;
                  }
              }
              EQ(ok, 1);
          }

          static void test_curve_monotonic(void)
          {
              printf("-- 曲线单调性 --\n");
              int prev = -1, i;
              int mono = 1;
              for (i = 0; i <= 100; i++) {
                  int lv = uil_ui_to_level(i, BL_MIN, BL_MAX);
                  if (lv < prev) mono = 0;
                  if (lv < BL_MIN || lv > BL_MAX) mono = 0;
                  prev = lv;
              }
              EQ(mono, 1);

              prev = -1; mono = 1;
              for (i = BL_MIN; i <= BL_MAX; i++) {
                  int p = uil_level_to_ui(i, BL_MIN, BL_MAX);
                  if (p < prev) mono = 0;
                  if (p < 0 || p > 100) mono = 0;
                  prev = p;
              }
              EQ(mono, 1);
          }

          static void test_curve_roundtrip(void)
          {
              printf("-- 往返一致性（UI -> level -> UI）--\n");
              int i, ok = 1;
              for (i = 0; i <= 100; i++) {
                  int lv = uil_ui_to_level(i, BL_MIN, BL_MAX);
                  int back = uil_level_to_ui(lv, BL_MIN, BL_MAX);
                  /* 底部 10% 行程内 1 个 level 约等于 4% 位移，量化天然偏粗，放宽到 5；
                   * 中上部必须精细，容差 2。 */
                  int tol = (i < 10) ? 5 : 2;
                  if (fabs((double)back - (double)i) > (double)tol) {
                      printf("  roundtrip 偏差过大: %d%% -> level %d -> %d%% (容差 %d)\n",
                             i, lv, back, tol);
                      ok = 0;
                  }
              }
              EQ(ok, 1);
          }

          static void test_degenerate_range(void)
          {
              printf("-- 退化区间 bl_max <= bl_min --\n");
              EQ(uil_ui_to_level(50, 255, 255), 255);
              EQ(uil_level_to_ui(255, 255, 255), 100);
              EQ(uil_ui_to_level(50, 100, 10), 10);
          }

          static void test_page_step_cyclic(void)
          {
              printf("-- 循环翻页 --\n");
              EQ(uil_page_step(0, 1, 4), 1);
              EQ(uil_page_step(2, 1, 4), 3);
              EQ(uil_page_step(3, 1, 4), 0);   /* 末页 -> 首页 */
              EQ(uil_page_step(0, -1, 4), 3);  /* 首页 -> 末页 */
              EQ(uil_page_step(1, -1, 4), 0);
              EQ(uil_page_step(0, 0, 4), 0);
              EQ(uil_page_step(0, 5, 4), 1);   /* 多步 */
              EQ(uil_page_step(0, -5, 4), 3);
              EQ(uil_page_step(0, 1, 1), 0);   /* 单页不死循环 */
          }

          static void test_swipe_vertical_only(void)
          {
              printf("-- 手势：仅垂直翻页 --\n");
              EQ(uil_swipe_pages(0, -40, 24), 1);    /* 上滑 = 下一页 */
              EQ(uil_swipe_pages(0, 40, 24), -1);    /* 下滑 = 上一页 */
              EQ(uil_swipe_pages(-100, 5, 24), 0);   /* 纯水平 = 忽略 */
              EQ(uil_swipe_pages(120, -10, 24), 0);  /* 纯水平 = 忽略 */
              EQ(uil_swipe_pages(10, 10, 24), 0);    /* 位移不足 = 忽略 */
              EQ(uil_swipe_pages(-30, -30, 24), 0);  /* 45° 对角，垂直未占优 = 忽略 */
              EQ(uil_swipe_pages(-20, -60, 24), 1);  /* 斜上滑但垂直占优 = 下一页 */
              EQ(uil_swipe_pages(0, 0, 24), 0);
              EQ(uil_swipe_pages(0, -24, 24), 1);    /* 恰好等于阈值 */
              EQ(uil_swipe_pages(0, -23, 24), 0);    /* 差 1px 不触发 */
          }

          static void test_slider_percent(void)
          {
              printf("-- 滑块 x -> 百分比 --\n");
              EQ(uil_slider_percent(24, 24, 296), 0);
              EQ(uil_slider_percent(296, 24, 296), 100);
              EQ(uil_slider_percent(160, 24, 296), 50);
              EQ(uil_slider_percent(-50, 24, 296), 0);    /* 拖出屏幕左侧 */
              EQ(uil_slider_percent(9999, 24, 296), 100); /* 拖出屏幕右侧 */
              EQ(uil_slider_percent(100, 100, 100), 0);   /* 退化区间不崩 */
          }

          static void test_reboot_drag(void)
          {
              printf("-- 重启拖动进度 --\n");
              EQ(uil_drag_permille(0, 0, 200), 0);
              EQ(uil_drag_permille(200, 0, 200), 1000);
              EQ(uil_drag_permille(100, 0, 200), 500);
              EQ(uil_drag_permille(-50, 0, 200), 0);      /* 往左拖出界不回绕 */
              EQ(uil_drag_permille(9999, 0, 200), 1000);
              EQ(uil_drag_permille(50, 50, 0), 0);        /* travel=0 不除零 */

              EQ(uil_reboot_armed(0, 900), 0);
              EQ(uil_reboot_armed(899, 900), 0);   /* 差一点不触发 */
              EQ(uil_reboot_armed(900, 900), 1);   /* 到位触发 */
              EQ(uil_reboot_armed(1000, 900), 1);
          }

          int main(void)
          {
              test_clamp();
              test_ui_to_level_endpoints();
              test_ui_to_level_gamma();
              test_level_to_ui_endpoints();
              test_curve_monotonic();
              test_curve_roundtrip();
              test_no_dead_zone();
              test_degenerate_range();
              test_page_step_cyclic();
              test_swipe_vertical_only();
              test_slider_percent();
              test_reboot_drag();

              printf("\n==== 通过 %d, 失败 %d ====\n", g_pass, g_fail);
              return g_fail ? 1 : 0;
          }
          ENDOFTEST

      - name: Run unit tests on host (build gate)
        run: |
          # 构建前置门禁：亮度曲线 / 循环翻页 / 手势判定 / 拖动换算
          # 任一断言失败即中断构建，不会产出坏固件
          gcc -O2 -std=gnu11 -Wall -Wextra -o test_logic test_logic.c -lm
          ./test_logic

      - name: Create DRM Player C Source
        run: |
          cat << 'ENDOFSOURCE' > drm_play.c
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/ioctl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <sys/time.h>
          #include <sys/reboot.h>
          #include <poll.h>
          #include <dirent.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdarg.h>
          #include <string.h>
          #include <time.h>
          #include <errno.h>
          #include <signal.h>
          #include <math.h>
          #include <limits.h>
          #include <xf86drm.h>
          #include <xf86drmMode.h>
          #include <drm_fourcc.h>

          #define STB_IMAGE_IMPLEMENTATION
          #define STBI_ONLY_JPEG
          #define STBI_ONLY_PNG
          #include "stb_image.h"

          #define STB_TRUETYPE_IMPLEMENTATION
          #include "stb_truetype.h"

          #define STB_IMAGE_RESIZE_IMPLEMENTATION
          #include "stb_image_resize2.h"

          #include "apple_raw.h"
          #include "drm_ui_logic.h"

          #define VIDEO_W       172
          #define VIDEO_H       172
          #define BPP           32
          #define FPS           25
          #define DURATION      36
          #define SCREEN_W      320
          #define SCREEN_H      172
          #define FONT_PATH     "/usr/share/fonts/MiSans-Regular.ttf"
          #define FONT_SIZE     28.0f
          #define REFRESH_SEC   (15 * 60)   /* 第 1 页 15 分钟 */
          #define INFO_REFRESH_SEC  60      /* 第 2 页 60 秒 */
          #define HTTP_TIMEOUT  8
          #define MAX_CHARS_PER_LINE  15
          /* ★ 第 1 页文字颜色 (R, G, B) ★ */
          #define TEXT_R   0
          #define TEXT_G   255
          #define TEXT_B   255
          /* ★ 第 2 页字体大小 ★ */
          #define INFO_TITLE_SIZE  22.0f
          #define INFO_FONT_SIZE   19.0f
          #define HITOKOTO_URL  "https://v1.hitokoto.cn/?c=f&max_length=60"
          #define PICSUM_URL    "https://picsum.photos/320/172"
          #define HITOKOTO_CACHE "/tmp/.drm_hitokoto"
          #define BG_CACHE       "/tmp/.drm_bg_img"
          #define QMODEM_RUNDIR  "/var/run/qmodem"
          #define QMODEM_DBG     "/tmp/.qmodem_dbg_all"
          #define DRM_PLAY_LOG   "/tmp/drm_play.log"
          /* ★ 息屏相关 ★ */
          #define CLIENT_CHECK_SEC  20       /* 每 20 秒统计一次客户端 */
          #define SCREEN_OFF_DELAY  60      /* 无设备持续 60 秒 → 息屏 */

          /* ================================================================
           * ★ 新增：页面 / 背光 / 交互 参数
           * ================================================================ */
          #define PAGE_COUNT        4
          #define PAGE_HITOKOTO     0        /* 一言 + 背景 */
          #define PAGE_MODEM        1        /* 上网模块信息 */
          #define PAGE_BRIGHTNESS   2        /* 亮度调节 */
          #define PAGE_DEVICE       3        /* 设备 / 重启 */

          #define BL_SYSFS_DIR      "/sys/class/backlight"
          #define BL_MIN_LEVEL      16       /* 滑块下限：低于此值屏幕几乎不可读，且用户会误判死机 */
          #define BL_DEFAULT_LEVEL  150      /* 无配置文件时的默认亮度（实测 200 偏亮） */
          #define BL_OFF_LEVEL      0        /* 息屏亮度：DTS 极性反转，duty=0 即背光电流为 0 */

          #define CONF_PATH         "/etc/config/drm_play_arm64"
          #define CONF_TMP          "/etc/config/drm_play_arm64.tmp"

          #define HOME_TIMEOUT_MS   (120 * 1000L)   /* 非首页静止 2 分钟 → 回首页 */
          #define SWIPE_THRESH_PX   24              /* 翻页手势最小位移（屏幕像素） */
          #define DRAG_REDRAW_MS    90              /* 拖动时重绘节流，约 11fps */
          #define INPUT_POLL_MS     25
          #define REBOOT_TRIGGER    900             /* 重启滑条需拖到 90% */

          /* 实测方向若相反，把对应值改成 1，或编译时加 -DSWIPE_V_INVERT=1 / -DSLIDER_X_INVERT=1。
           * 内核已按 DTS 的 touchscreen-swapped-x-y / inverted-x / inverted-y 变换过坐标，
           * 正常情况下两个开关都应为 一个1一个0。 */
          #ifndef SWIPE_V_INVERT
          #define SWIPE_V_INVERT    1
          #endif
          #ifndef SLIDER_X_INVERT
          #define SLIDER_X_INVERT   0
          #endif

          /* 触摸释放兜底：驱动正常上报 release 时不会触发。
           * 若发现"手指按住不动滑块就自己松开了"，把这个值调大。 */
          #define TOUCH_IDLE_MS     500

          /* 亮度页滑块几何 */
          #define SL_X0        24
