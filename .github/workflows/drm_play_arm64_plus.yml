          static void render_black_rgba(uint8_t *rgba) {
              memset(rgba, 0, (size_t)(SCREEN_W * SCREEN_H * 4));
              for (int i = 0; i < SCREEN_W * SCREEN_H; i++)
                  rgba[i * 4 + 3] = 255;
          }

          static void rgba_to_fb(void *fb, uint32_t pitch,
                                 const uint8_t *rgba, int img_w, int img_h) {
              memset(fb, 0, (size_t)pitch * screen_h);
              int x_off = ((int)screen_w - img_w) / 2;
              int y_off = ((int)screen_h - img_h) / 2;
              if (x_off < 0) x_off = 0;
              if (y_off < 0) y_off = 0;
              int cw = (img_w > (int)screen_w) ? (int)screen_w : img_w;
              int ch = (img_h > (int)screen_h) ? (int)screen_h : img_h;
              for (int y = 0; y < ch; y++) {
                  uint8_t *dst_row = (uint8_t *)fb + (y + y_off) * pitch + x_off * 4;
                  const uint8_t *src_row = rgba + y * img_w * 4;
                  for (int x = 0; x < cw; x++) {
                      dst_row[x*4 + 0] = src_row[x*4 + 2];
                      dst_row[x*4 + 1] = src_row[x*4 + 1];
                      dst_row[x*4 + 2] = src_row[x*4 + 0];
                      dst_row[x*4 + 3] = 0xFF;
                  }
              }
          }

          static uint8_t *canvas_get(int idx) {
              if (idx < 0 || idx >= PAGE_COUNT) return NULL;
              if (!g_canvas[idx])
                  g_canvas[idx] = malloc((size_t)(SCREEN_W * SCREEN_H) * 4);
              return g_canvas[idx];
          }

          static uint8_t *scratch_get(void) {
              if (!g_scratch)
                  g_scratch = malloc((size_t)(SCREEN_W * SCREEN_H) * 4);
              return g_scratch;
          }

          static void fb_present(disp_t *d, const uint8_t *canvas) {
              rgba_to_fb(d->map, d->pitch, canvas, SCREEN_W, SCREEN_H);
              drmModeSetCrtc(d->fd, d->crtc_id, d->fb_id, 0, 0,
                             &d->conn_id, 1, d->mode);
          }

          /* page < 0 表示全黑（息屏画面） */
          static void draw_page(disp_t *d, int page) {
              uint8_t *c;
              if (page < 0) {
                  c = scratch_get();
                  if (!c) return;
                  render_black_rgba(c);
                  fb_present(d, c);
                  return;
              }
              if (page >= PAGE_COUNT) page = PAGE_COUNT - 1;
              c = canvas_get(page);
              if (!c) return;
              switch (page) {
              case PAGE_HITOKOTO:
                  render_page0_rgba(c);
                  break;
              case PAGE_MODEM:
                  collect_modem_info();
                  render_info_page_rgba(c, SCREEN_W, SCREEN_H);
                  break;
              case PAGE_BRIGHTNESS:
                  render_brightness_page(c, SCREEN_W, SCREEN_H,
                                         g_disp_percent, g_drag_mode == 1);
                  break;
              case PAGE_DEVICE:
                  render_device_page(c, SCREEN_W, SCREEN_H,
                                     g_rb_permille, g_drag_mode == 2);
                  break;
              }
              fb_present(d, c);
              g_canvas_ms[page] = now_ms();
          }

          static void blit_cached(disp_t *d, int page) {
              if (page < 0 || page >= PAGE_COUNT || !g_canvas[page]) return;
              fb_present(d, g_canvas[page]);
          }

          /* 页面切换：第 1/2 页有缓存则先秒显，内容过期再重绘；
           * 第 3/4 页状态敏感（拖动进度、亮度值），一律重绘。 */
          static void page_show(disp_t *d, int page) {
              long age;
              if (page != PAGE_HITOKOTO && page != PAGE_MODEM) { draw_page(d, page); return; }
              if (!g_canvas[page]) { draw_page(d, page); return; }
              blit_cached(d, page);
              age = now_ms() - g_canvas_ms[page];
              if (page == PAGE_HITOKOTO) {
                  if (age >= (long)REFRESH_SEC * 1000L) {
                      fetcher_start();
                  }
              } else if (age >= (long)INFO_REFRESH_SEC * 1000L) {
                  draw_page(d, page);
              }
          }

          /* ================================================================
           * ★ 输入层（事件级，支持拖动）
           *
           * 原 wait_touch() 把整段触摸压缩成 ±1，无法支撑滑块拖动，
           * 这里改为 DOWN/MOVE/UP/TAP 事件队列。
           * 原始 ABS 值按 EVIOCGABS 的 min/max 归一化到屏幕像素坐标，
           * 不假设触摸屏分辨率与屏幕一致。
           * ================================================================ */

          typedef enum { IE_NONE = 0, IE_DOWN, IE_MOVE, IE_UP, IE_TAP } ie_type_t;

          typedef struct {
              ie_type_t type;
              int x, y;             /* 屏幕坐标 */
              int start_x, start_y; /* 本次手势起点 */
              int dx, dy;           /* 相对起点的位移 */
          } input_ev_t;

          #define EVQ_SIZE 32
          static input_ev_t g_evq[EVQ_SIZE];
          static int g_evq_n = 0;
          static int g_touch_release_from_timer = 0;
          static int g_ev_dropped = 0;

          typedef struct {
              int in_contact;
              int have_coord;
              int raw_x, raw_y;
              int start_sx, start_sy;
              int moved;
              long last_coord_ms;
          } touch_state_t;
          static touch_state_t g_ts;

          static int g_ax_min, g_ax_max, g_ay_min, g_ay_max;

          static int to_sx(int raw) {
              if (g_ax_max <= g_ax_min) return 0;
              return uil_clampi((raw - g_ax_min) * (SCREEN_W - 1) / (g_ax_max - g_ax_min),
                                0, SCREEN_W - 1);
          }
          static int to_sy(int raw) {
              if (g_ay_max <= g_ay_min) return 0;
              return uil_clampi((raw - g_ay_min) * (SCREEN_H - 1) / (g_ay_max - g_ay_min),
                                0, SCREEN_H - 1);
          }

          /* 入队。队列满时丢弃【最旧】的一条，绝不丢最新的——
           * 否则拖动过程中积压的 MOVE 会把 IE_UP 挤掉，滑块会永久卡在拖动态。 */
          static void evq_push(ie_type_t t, int x, int y, int sx, int sy) {
              input_ev_t e;
              if (g_evq_n >= EVQ_SIZE) {
                  memmove(&g_evq[0], &g_evq[1], sizeof(input_ev_t) * (size_t)(EVQ_SIZE - 1));
                  g_evq_n = EVQ_SIZE - 1;
                  g_ev_dropped++;
              }
              e.type = t; e.x = x; e.y = y; e.start_x = sx; e.start_y = sy;
              e.dx = x - sx; e.dy = y - sy;
              g_evq[g_evq_n++] = e;
          }

          static void touch_end(int from_timer) {
              touch_state_t *s = &g_ts;
              int x = s->have_coord ? to_sx(s->raw_x) : s->start_sx;
              int y = s->have_coord ? to_sy(s->raw_y) : s->start_sy;
              if (from_timer) g_touch_release_from_timer++;
              evq_push(s->moved ? IE_UP : IE_TAP, x, y, s->start_sx, s->start_sy);
              s->in_contact = 0;
              s->have_coord = 0;
              s->moved = 0;
          }

          static void drain_touch(int fd) {
              touch_state_t *s = &g_ts;
              struct my_input_event ev;
              ssize_t r;
              int fx = 0, fy = 0, fxv = 0, fyv = 0;
              int ftid = 0, ftidv = 0, ft = 0, ftv = 0;
              int last_mx = -1, last_my = -1;

              while ((r = read(fd, &ev, sizeof(ev))) == (ssize_t)sizeof(ev)) {
                  if (ev.type == MY_EV_ABS) {
                      if (ev.code == MY_ABS_X || ev.code == MY_ABS_MT_POSITION_X) { fx = 1; fxv = ev.value; }
                      else if (ev.code == MY_ABS_Y || ev.code == MY_ABS_MT_POSITION_Y) { fy = 1; fyv = ev.value; }
                      else if (ev.code == MY_ABS_MT_TRACKING_ID) { ftid = 1; ftidv = ev.value; }
                  } else if (ev.type == MY_EV_KEY && ev.code == MY_BTN_TOUCH) {
                      ft = 1; ftv = ev.value ? 1 : 0;
                  } else if (ev.type == MY_EV_SYN && ev.code == MY_SYN_REPORT) {
                      int raw_down, raw_up;
                      if (fx || fy) {
                          if (fx) s->raw_x = fxv;
                          if (fy) s->raw_y = fyv;
                          s->have_coord = 1;
                          s->last_coord_ms = now_ms();
                      }
                      raw_down = (ftid && ftidv >= 0) || (ft && ftv);
                      raw_up   = (ftid && ftidv <  0) || (ft && !ftv);

                      if (raw_down && !s->in_contact) {
                          s->in_contact = 1;
                          s->moved = 0;
                          if (s->have_coord) {
                              s->start_sx = to_sx(s->raw_x);
                              s->start_sy = to_sy(s->raw_y);
                          }
                          evq_push(IE_DOWN, s->start_sx, s->start_sy,
                                   s->start_sx, s->start_sy);
                      } else if (raw_up && s->in_contact) {
                          touch_end(0);
                      } else if (s->in_contact && s->have_coord) {
                          int sx = to_sx(s->raw_x), sy = to_sy(s->raw_y);
                          if (abs(sx - s->start_sx) > 2 || abs(sy - s->start_sy) > 2)
                              s->moved = 1;
                          /* 同一次 drain 内合并重复坐标：触摸屏上报率(~100Hz)远高于
                           * 重绘率(~11fps)，不合并会把队列灌满。 */
                          if (sx != last_mx || sy != last_my) {
                              last_mx = sx; last_my = sy;
                              evq_push(IE_MOVE, sx, sy, s->start_sx, s->start_sy);
                          }
                      }
                      fx = fy = ftid = ft = 0;
                  }
              }
          }

          static int poll_input(int fd, int timeout_ms, input_ev_t *out) {
              if (g_evq_n == 0) {
                  touch_state_t *s = &g_ts;
                  if (fd < 0) {
                      sleep_ms(timeout_ms);
                      return 0;
                  }
                  if (s->in_contact && s->last_coord_ms &&
                      (now_ms() - s->last_coord_ms) > TOUCH_IDLE_MS) {
                      touch_end(1);
                  } else {
                      struct pollfd pfd;
                      int pr;
                      pfd.fd = fd; pfd.events = POLLIN; pfd.revents = 0;
                      pr = poll(&pfd, 1, timeout_ms);
                      if (pr > 0) drain_touch(fd);
                  }
              }
              if (g_evq_n == 0) return 0;
              *out = g_evq[0];
              if (g_evq_n > 1) memmove(&g_evq[0], &g_evq[1], sizeof(input_ev_t) * (size_t)(g_evq_n - 1));
              g_evq_n--;
              return 1;
          }

          static int open_touch(void) {
              char path[32];
              for (int i = 0; i < 16; i++) {
                  struct my_absinfo ai;
                  int fd;
                  uint8_t ev_bits[(MY_EV_MAX/8)+1]  = {0};
                  uint8_t abs_bits[(MY_ABS_MAX/8)+1] = {0};
                  uint8_t key_bits[(MY_KEY_MAX/8)+1] = {0};
                  int has_x, is_touch = 0;

                  snprintf(path, sizeof(path), "/dev/input/event%d", i);
                  fd = open(path, O_RDONLY | O_NONBLOCK | O_CLOEXEC);
                  if (fd < 0) continue;
                  if (ioctl(fd, MY_EVIOCGBIT(0, sizeof(ev_bits)), ev_bits) < 0) { close(fd); continue; }
                  if (!TEST_BIT(MY_EV_ABS, ev_bits)) { close(fd); continue; }
                  if (ioctl(fd, MY_EVIOCGBIT(MY_EV_ABS, sizeof(abs_bits)), abs_bits) < 0) { close(fd); continue; }
                  has_x = TEST_BIT(MY_ABS_X, abs_bits) || TEST_BIT(MY_ABS_MT_POSITION_X, abs_bits);
                  if (!has_x) { close(fd); continue; }
                  if (TEST_BIT(MY_ABS_MT_TRACKING_ID, abs_bits)) is_touch = 1;
                  if (!is_touch &&
                      ioctl(fd, MY_EVIOCGBIT(MY_EV_KEY, sizeof(key_bits)), key_bits) >= 0 &&
                      TEST_BIT(MY_BTN_TOUCH, key_bits)) is_touch = 1;
                  if (!is_touch) {
                      char name[128] = {0};
                      if (ioctl(fd, MY_EVIOCGNAME(sizeof(name)), name) > 0) {
                          for (char *p = name; *p; p++) if (*p >= 'A' && *p <= 'Z') *p += 32;
                          if (strstr(name, "touch") || strstr(name, "goodix") ||
                              strstr(name, "ft5x")  || strstr(name, "gt9")   ||
                              strstr(name, "gsl")   || strstr(name, "tsc")   ||
                              strstr(name, "axs")) is_touch = 1;
                          logmsg("touch: 候选 %s name='%s'", path, name);
                      }
                  }
                  if (!is_touch) { close(fd); continue; }

                  /* 读取 ABS 量程，用于把原始坐标归一化到屏幕像素 */
                  g_ax_min = 0; g_ax_max = SCREEN_W - 1;
                  g_ay_min = 0; g_ay_max = SCREEN_H - 1;
                  if (ioctl(fd, MY_EVIOCGABS(MY_ABS_X), &ai) == 0 && ai.maximum > ai.minimum) {
                      g_ax_min = ai.minimum; g_ax_max = ai.maximum;
                  } else if (ioctl(fd, MY_EVIOCGABS(MY_ABS_MT_POSITION_X), &ai) == 0 &&
                             ai.maximum > ai.minimum) {
                      g_ax_min = ai.minimum; g_ax_max = ai.maximum;
                  }
                  if (ioctl(fd, MY_EVIOCGABS(MY_ABS_Y), &ai) == 0 && ai.maximum > ai.minimum) {
                      g_ay_min = ai.minimum; g_ay_max = ai.maximum;
                  } else if (ioctl(fd, MY_EVIOCGABS(MY_ABS_MT_POSITION_Y), &ai) == 0 &&
                             ai.maximum > ai.minimum) {
                      g_ay_min = ai.minimum; g_ay_max = ai.maximum;
                  }
                  logmsg("touch: 使用 %s  X[%d..%d]->0..%d  Y[%d..%d]->0..%d",
                         path, g_ax_min, g_ax_max, SCREEN_W - 1,
                         g_ay_min, g_ay_max, SCREEN_H - 1);
                  return fd;
              }
              logmsg("touch: 未找到可用触摸设备，交互不可用");
              return -1;
          }

          /* ================================================================
           * 命中测试 / 拖动换算
           * ================================================================ */

          static int hit_slider(int x, int y) {
              return (y >= SL_CY - SL_HIT_PAD_Y && y <= SL_CY + SL_HIT_PAD_Y &&
                      x >= SL_X0 - SL_HIT_PAD_X && x <= SL_X1 + SL_HIT_PAD_X);
          }

          static int hit_reboot(int x, int y) {
              return (y >= RB_Y0 - RB_HIT_PAD_Y && y <= RB_Y0 + RB_H + RB_HIT_PAD_Y &&
                      x >= RB_X0 - RB_HIT_PAD_X && x <= RB_X1 + RB_HIT_PAD_X);
          }

          static int reboot_travel(void) {
              return (RB_X1 - RB_X0) - 2 * RB_PAD - RB_HANDLE_W;
          }

          /* 手指 x -> 重启滑条千分比（以手柄中心为基准） */
          static int reboot_permille_from_x(int x) {
              return uil_drag_permille(x, RB_X0 + RB_PAD + RB_HANDLE_W / 2, reboot_travel());
          }

          /* 手指 x -> UI 百分比（含方向开关），供显示与调光共用 */
          static int slider_percent_at(int x) {
              int p = uil_slider_percent(x, SL_X0, SL_X1);
          #if SLIDER_X_INVERT
              p = 100 - p;
          #endif
              return p;
          }

          /* 手指 x -> 亮度（立即写 sysfs） */
          static void brightness_from_x(int x) {
              int p = slider_percent_at(x);
              int lv = uil_ui_to_level(p, BL_MIN_LEVEL, g_bl_max);
              g_disp_percent = p;
              if (lv != g_bl_level) {
                  g_bl_level = lv;
                  bl_write_raw(lv);
                  g_bl_dirty = 1;
              }
          }

          /* ================================================================
           * 重启动作
           * ================================================================ */

          static void do_reboot(disp_t *d) {
              uint8_t *c = scratch_get();
              logmsg("reboot: 用户拖动重启滑条到位，执行重启");
              if (g_bl_dirty) conf_save(g_bl_level);
              if (c) {
                  render_reboot_screen(c, SCREEN_W, SCREEN_H);
                  fb_present(d, c);
              }
              bl_write_raw(g_bl_avail ? uil_clampi(g_bl_level, BL_MIN_LEVEL, g_bl_max) : 200);
              sync();
              {
                  pid_t p = fork();
                  if (p == 0) {
                      setsid();
                      execl("/sbin/reboot", "reboot", (char *)NULL);
                      execl("/bin/busybox", "reboot", (char *)NULL);
                      _exit(1);
                  }
              }
              /* 等 procd 完成关机流程；超时则内核兜底 */
              for (int i = 0; i < 40; i++) {
                  sleep_ms(250);
                  if (!g_running) break;
              }
              sync();
              reboot(RB_AUTOBOOT);
              _exit(0);
          }

          /* 唤醒：内容先推、背光后开，全程无白闪。
           * 若静止已超过回首页时限，直接落到首页，避免半夜摸屏停在重启页。 */
          static int wake_screen(disp_t *d, int cur_page, long idle_ms, time_t *last_refresh) {
              if (idle_ms >= HOME_TIMEOUT_MS) cur_page = PAGE_HITOKOTO;
              g_drag_mode = 0;
              g_rb_permille = 0;
              g_disp_percent = uil_level_to_ui(g_bl_level, BL_MIN_LEVEL, g_bl_max);
              /* 背光此时仍为 0，推送过程不可见，无需先刷黑帧，省一次 ~80ms SPI 传输 */
              draw_page(d, cur_page);
              bl_screen_on();
              g_evq_n = 0;                      /* 清空积压事件，唤醒这一下不触发任何操作 */
              *last_refresh = time(NULL);
              return cur_page;
          }

          /* ================================================================
           * main
           * ================================================================ */

          static void daemonize(void) {
              int devnull = open("/dev/null", O_RDWR);
              if (devnull >= 0) {
                  dup2(devnull, STDIN_FILENO);
                  dup2(devnull, STDOUT_FILENO);
                  dup2(devnull, STDERR_FILENO);
                  if (devnull > 2) close(devnull);
              }
          }

          int main(int argc, char *argv[]) {
              const char *drm_device = (argc > 1) ? argv[1] : "/dev/dri/card1";
              drmModeRes *res;
              drmModeConnector *conn;
              uint32_t crtc_id;
              struct drm_mode_create_dumb dumb[2];
              void *map[2];
              uint32_t fb_id[2];
              int fd, i;
              size_t frame_size;
              long total_frames, total_duration_frames, frame_count;
              time_t start_time;
              int cur;
              int touch_fd, cur_page;
              disp_t d;
              time_t last_refresh;
              int screen_off_state = 0;
              time_t no_client_since = 0, last_client_check = 0;
              long last_activity_ms, last_drag_draw_ms = 0;

              signal(SIGPIPE, SIG_IGN);
              signal(SIGTERM, sig_handler);
              signal(SIGINT, sig_handler);

              memset(dumb, 0, sizeof(dumb));
              memset(map, 0, sizeof(map));
              memset(fb_id, 0, sizeof(fb_id));
              memset(g_canvas_ms, 0, sizeof(g_canvas_ms));

              font_init();

              /* ★ 背光必须在第一次 SetCrtc 之前设定，否则开机动画会用 DTS 默认亮度 200 播放 */
              bl_init_startup();

              fd = drm_init(drm_device, &res, &conn, &crtc_id);
              if (fd < 0) { logmsg("drm: 打不开 %s", drm_device); return 1; }
              g_saved_crtc = drmModeGetCrtc(fd, crtc_id);

              for (i = 0; i < 2; i++) {
                  if (drm_create_fb(fd, &dumb[i], &fb_id[i], &map[i]) < 0) {
                      logmsg("drm: 创建 framebuffer %d 失败", i);
                      drm_cleanup(fd, crtc_id, res, conn, dumb, map, fb_id, 2);
                      return 1;
                  }
              }

              d.fd = fd; d.crtc_id = crtc_id;
              d.conn_id = conn->connector_id; d.mode = &conn->modes[0];
              d.map = map[0]; d.pitch = dumb[0].pitch; d.fb_id = fb_id[0];

              logmsg("start: dev=%s %ux%u crtc=%u 背光level=%d",
                     drm_device, screen_w, screen_h, crtc_id, g_bl_level);

              /* ---------- 开机动画 ---------- */
              frame_size = VIDEO_W * VIDEO_H * (BPP / 8);
              total_frames = (long)(apple_raw_len / frame_size);
              total_duration_frames = FPS * DURATION;
              if (total_frames <= 0) total_frames = 1;

              copy_centered(map[0], dumb[0].pitch, apple_raw, VIDEO_W, VIDEO_H);
              drmModeSetCrtc(fd, crtc_id, fb_id[0], 0, 0,
                             &conn->connector_id, 1, &conn->modes[0]);

              cur = 1;
              frame_count = 1;
              start_time = time(NULL);
              while (frame_count < total_duration_frames && g_running) {
                  long fi;
                  if (difftime(time(NULL), start_time) >= DURATION) break;
                  fi = frame_count % total_frames;
                  copy_centered(map[cur], dumb[cur].pitch,
                                apple_raw + fi * frame_size, VIDEO_W, VIDEO_H);
                  drmModeSetCrtc(fd, crtc_id, fb_id[cur], 0, 0,
                                 &conn->connector_id, 1, &conn->modes[0]);
                  cur = 1 - cur;
                  frame_count++;
                  sleep_ms(1000 / FPS);
              }

              daemonize();

              /* ---------- 信息屏主循环 ---------- */
              touch_fd = open_touch();
              cur_page = PAGE_HITOKOTO;
              g_disp_percent = uil_level_to_ui(g_bl_level, BL_MIN_LEVEL, g_bl_max);

              fetcher_start();
              draw_page(&d, cur_page);
              last_refresh = time(NULL);
              last_activity_ms = now_ms();

              while (g_running) {
                  input_ev_t ev;
                  long now;
                  int has;

                  has = poll_input(touch_fd, INPUT_POLL_MS, &ev);
                  now = now_ms();

                  /* ---- 输入处理 ---- */
                  if (has) {
                      long idle = now - last_activity_ms;
                      last_activity_ms = now;

                      if (screen_off_state) {
                          /* 唤醒：静止超过 2 分钟则直接回首页，避免半夜摸屏落在重启页。
                           * 唤醒用的这次触摸本身丢弃，防止误翻页/误触发。 */
                          cur_page = wake_screen(&d, cur_page, idle, &last_refresh);
                          screen_off_state = 0;
                          no_client_since = 0;
                          logmsg("wake: 触摸唤醒，回到第 %d 页（静止 %ld 秒）",
                                 cur_page + 1, idle / 1000);
                          continue;
                      }

                      switch (ev.type) {
                      case IE_DOWN:
                          if (cur_page == PAGE_BRIGHTNESS && g_bl_avail && hit_slider(ev.x, ev.y)) {
                              g_drag_mode = 1;
                              g_disp_percent = slider_percent_at(ev.x);
                              brightness_from_x(ev.x);
                              last_drag_draw_ms = 0;
                              draw_page(&d, cur_page);
                          } else if (cur_page == PAGE_DEVICE && hit_reboot(ev.x, ev.y)) {
                              g_drag_mode = 2;
                              g_rb_permille = reboot_permille_from_x(ev.x);
                              last_drag_draw_ms = 0;
                              draw_page(&d, cur_page);
                          } else {
                              g_drag_mode = 0;
                          }
                          break;

                      case IE_MOVE:
                          if (g_drag_mode == 1) {
                              g_disp_percent = slider_percent_at(ev.x);
                              brightness_from_x(ev.x);        /* 亮度即时生效 */
                              if (now - last_drag_draw_ms >= DRAG_REDRAW_MS) {
                                  last_drag_draw_ms = now;
                                  draw_page(&d, cur_page);    /* 图形按 ~11fps 节流 */
                              }
                          } else if (g_drag_mode == 2) {
                              g_rb_permille = reboot_permille_from_x(ev.x);
                              if (now - last_drag_draw_ms >= DRAG_REDRAW_MS) {
                                  last_drag_draw_ms = now;
                                  draw_page(&d, cur_page);
                              }
                          }
                          break;

                      case IE_UP:
                          if (g_drag_mode == 1) {
                              g_drag_mode = 0;
                              g_disp_percent = uil_level_to_ui(g_bl_level, BL_MIN_LEVEL, g_bl_max);
                              if (g_bl_dirty) {
                                  conf_save(g_bl_level);
                                  logmsg("brightness: 保存 level=%d (%d%%)",
                                         g_bl_level, g_disp_percent);
                              }
                              draw_page(&d, cur_page);
                          } else if (g_drag_mode == 2) {
                              int armed = uil_reboot_armed(g_rb_permille, REBOOT_TRIGGER);
                              g_drag_mode = 0;
                              if (armed) {
                                  do_reboot(&d);              /* 不返回 */
                              } else {
                                  g_rb_permille = 0;
                                  draw_page(&d, cur_page);
                              }
                          } else {
                              /* 非拖动：垂直滑动循环翻页，水平滑动一律忽略 */
                              int step = uil_swipe_pages(ev.dx, ev.dy, SWIPE_THRESH_PX);
          #if SWIPE_V_INVERT
                              step = -step;
          #endif
                              if (step != 0) {
                                  cur_page = uil_page_step(cur_page, step, PAGE_COUNT);
                                  if (cur_page == PAGE_BRIGHTNESS)
                                      g_disp_percent =
                                          uil_level_to_ui(g_bl_level, BL_MIN_LEVEL, g_bl_max);
                                  if (cur_page == PAGE_DEVICE) g_rb_permille = 0;
                                  page_show(&d, cur_page);
                                  last_refresh = time(NULL);
                              }
                          }
                          break;

                      case IE_TAP:
                          /* 仅刷新活动时间，不做动作 */
                          break;

                      case IE_NONE:
                      default:
                          break;
                      }
                  }

                  now = now_ms();

                  /* ---- 第 1 页网络抓取完成 → 重绘 ---- */
                  if (fetcher_poll() && cur_page == PAGE_HITOKOTO && !screen_off_state) {
                      draw_page(&d, PAGE_HITOKOTO);
                      last_refresh = time(NULL);
                  }

                  {
                      time_t tnow = time(NULL);

                      /* ---- 客户端检测 / 息屏 ---- */
                      if (tnow - last_client_check >= CLIENT_CHECK_SEC) {
                          int clients;
                          last_client_check = tnow;
                          clients = count_clients();
                          if (clients > 0) {
                              no_client_since = 0;
                              if (screen_off_state) {
                                  /* 客户端回归同样唤醒（沿用原有行为） */
                                  cur_page = wake_screen(&d, cur_page,
                                                         now_ms() - last_activity_ms,
                                                         &last_refresh);
                                  screen_off_state = 0;
                                  logmsg("wake: 检测到 %d 个客户端，唤醒到第 %d 页",
                                         clients, cur_page + 1);
                              }
                          } else if (!screen_off_state) {
                              if (no_client_since == 0) no_client_since = tnow;
                              if (tnow - no_client_since >= SCREEN_OFF_DELAY) {
                                  /* 先关背光（瞬间变暗，用户看不到中间态），
                                   * 再把全黑帧刷进 GRAM：面板供电常开、GRAM 会保留内容，
                                   * 万一背光被意外点亮也只会看到纯黑。 */
                                  bl_screen_off();
                                  draw_page(&d, -1);
                                  screen_off_state = 1;
                                  g_drag_mode = 0;
                                  g_rb_permille = 0;
                                  logmsg("sleep: 无客户端 %d 秒，息屏（背光 level 0，用户值 %d 保留）",
                                         SCREEN_OFF_DELAY, g_bl_level);
                              }
                          }
                      }

                      /* ---- 背景图缺失时重试抓取 ---- */
                      if (cur_page == PAGE_HITOKOTO && g_fetch_pid == 0 &&
                          !screen_off_state && access(BG_CACHE, R_OK) != 0 &&
                          tnow - g_last_fetch_try >= 30) {
                          g_last_fetch_try = tnow;
                          fetcher_start();
                      }

                      /* ---- 定时刷新 ---- */
                      if (!screen_off_state && (time_t)(tnow - last_refresh) >=
                          ((cur_page == PAGE_HITOKOTO) ? (time_t)REFRESH_SEC : (time_t)INFO_REFRESH_SEC)) {
                          if (cur_page == PAGE_HITOKOTO) {
                              fetcher_start();
                          } else if (cur_page == PAGE_MODEM) {
                              draw_page(&d, PAGE_MODEM);
                          }
                          last_refresh = tnow;
                      }
                  }

                  /* ---- 非首页静止 2 分钟 → 回首页 ---- */
                  if (!screen_off_state && cur_page != PAGE_HITOKOTO &&
                      (now - last_activity_ms) >= HOME_TIMEOUT_MS) {
                      g_drag_mode = 0;
                      g_rb_permille = 0;
                      cur_page = PAGE_HITOKOTO;
                      page_show(&d, cur_page);
                      last_refresh = time(NULL);
                      last_activity_ms = now_ms();
                      logmsg("idle: 非首页静止 %d 秒，自动返回首页", HOME_TIMEOUT_MS / 1000);
                  }
              }

              if (g_bl_dirty) conf_save(g_bl_level);
              if (g_touch_release_from_timer || g_ev_dropped)
                  logmsg("touch: 抬手兜底 %d 次 / 队列溢出丢弃 %d 次 (静默阈值 %dms)",
                         g_touch_release_from_timer, g_ev_dropped, TOUCH_IDLE_MS);
              if (touch_fd >= 0) close(touch_fd);
              for (i = 0; i < PAGE_COUNT; i++) {
                  if (g_canvas[i]) { free(g_canvas[i]); g_canvas[i] = NULL; }
              }
              if (g_scratch) { free(g_scratch); g_scratch = NULL; }
              if (g_font_data) { free(g_font_data); g_font_data = NULL; }
              drm_cleanup(fd, crtc_id, res, conn, dumb, map, fb_id, 2);
              return 0;
          }
          ENDOFSOURCE

      - name: Cross Compile for ARM64 (RK3528)
        run: |
          aarch64-linux-gnu-gcc -O2 -static -o drm_play_arm64 drm_play.c \
            -I. \
            -I/tmp/arm64-sysroot/usr/include \
            -I/tmp/arm64-sysroot/usr/include/libdrm \
            -I/tmp/arm64-sysroot/usr/include/drm \
            -I/tmp/arm64-sysroot/usr/include/aarch64-linux-gnu \
            -L/tmp/arm64-sysroot/usr/lib/aarch64-linux-gnu \
            -ldrm -lm

          chmod +x drm_play_arm64
          file drm_play_arm64
          ls -lh drm_play_arm64

      - name: Create init.d boot script
        run: |
          cat << 'EOF' > 99-bootanim
          #!/bin/sh /etc/rc.common

          START=11
          STOP=10

          DRM_DRIVER="panel-mipi-dbi-spi"

          # 按驱动名动态定位 DRM 节点；unbind/bind 之后 minor 编号可能变化，
          # 全部失败时才退回硬编码的 /dev/dri/card1。
          find_drm_dev() {
              for c in /sys/class/drm/card[0-9]*; do
                  [ -d "$c" ] || continue
                  case "$c" in *card*-*) continue;; esac
                  d=$(readlink -f "$c/device/driver" 2>/dev/null)
                  [ "${d##*/}" = "$DRM_DRIVER" ] || continue
                  n=$(basename "$c")
                  if [ -e "/dev/dri/$n" ]; then
                      echo "/dev/dri/$n"
                      return 0
                  fi
              done
              if [ -e /dev/dri/card1 ]; then
                  echo /dev/dri/card1
                  return 0
              fi
              return 1
          }

          start() {
              PLAYER="/usr/sbin/drm_play_arm64"
              DRM_DEV=""

              [ ! -f "$PLAYER" ] && return 1

              i=0
              while [ $i -lt 10 ]; do
                  DRM_DEV=$(find_drm_dev) && [ -n "$DRM_DEV" ] && break
                  sleep 1
                  i=$((i+1))
              done
              [ -z "$DRM_DEV" ] && return 1

              killall drm_play_arm64 2>/dev/null
              sleep 1

              SPI_DEV=""
              for dev in /sys/bus/spi/devices/*; do
                  if [ -f "$dev/modalias" ]; then
                      ALIAS=$(cat "$dev/modalias" 2>/dev/null)
                      case "$ALIAS" in
                          *gc9307*|*panel-mipi-dbi*)
                              SPI_DEV=$(basename "$dev")
                              break
                              ;;
                      esac
                  fi
              done

              if [ -n "$SPI_DEV" ] && [ -d "/sys/bus/spi/drivers/$DRM_DRIVER" ]; then
                  echo "$SPI_DEV" > "/sys/bus/spi/drivers/$DRM_DRIVER/unbind" 2>/dev/null
                  sleep 1
                  echo "$SPI_DEV" > "/sys/bus/spi/drivers/$DRM_DRIVER/bind" 2>/dev/null
                  i=0
                  DRM_DEV=""
                  while [ $i -lt 5 ]; do
                      DRM_DEV=$(find_drm_dev) && [ -n "$DRM_DEV" ] && break
                      sleep 1
                      i=$((i+1))
                  done
              fi

              [ -z "$DRM_DEV" ] && DRM_DEV=$(find_drm_dev)
              [ -z "$DRM_DEV" ] && DRM_DEV=/dev/dri/card1

              logger -t bootanim "drm_play_arm64 on $DRM_DEV"
              "$PLAYER" "$DRM_DEV" &
          }

          stop() {
              killall drm_play_arm64 2>/dev/null
          }
          EOF
          chmod +x 99-bootanim

      - name: Create install instructions
        run: |
          cat << 'EOF' > INSTALL.txt
          ============================================
            开机动画 + 四页信息屏（全合一）
            HINLINK H29K / RK3528 / GC9307 320x172
          ============================================

          文件:
            drm_play_arm64    - 开机动画 + 四页信息屏（ARM64 静态编译）
            99-bootanim       - OpenWrt init.d 开机脚本
            drm_ui_logic.h    - 纯逻辑头文件（亮度曲线/翻页/手势），仅供编译与单元测试
            INSTALL.txt       - 本文件

          --------------------------------------------
          页面（共 4 页，上下滑动循环翻页）
          --------------------------------------------
            第 1 页  一言 + 随机背景图      每 15 分钟刷新
            第 2 页  上网模块信息（黑底白字）每 60 秒刷新
            第 3 页  亮度调节               拖动滑块，实时生效，松手自动保存
            第 4 页  设备                   按住滑块拖到最右 → 重启设备

            翻页手势：上滑 = 上一页，下滑 = 下一页，末页与首页相连循环
            左右滑动：一律无效（亮度改为拖动滑块精调，避免误触）
            自动回首页：停留在非首页且完全静止 2 分钟 → 自动跳回第 1 页

          --------------------------------------------
          亮度控制（硬件调光，真省电）
          --------------------------------------------
            设备    /sys/class/backlight/pinctrl:backlight   (pwm-backlight, pwm6, 40kHz)
            量程    0 .. 255，DTS brightness-levels 为恒等线性
            曲线    UI 百分比 -> level 采用 gamma 2.2 + 10% 线性混合
                    0%->16  25%->32  50%->75  75%->148  100%->255
                    level 150 = UI 75%，level 200 = UI 88%
            下限    level 16（BL_MIN_LEVEL）。滑块拉到底也不会全黑，
                    避免用户误以为死机；level 0 只保留给息屏逻辑。
            默认    level 150（实测 DTS 默认的 200 偏亮）
            配置    /etc/config/drm_play_arm64   UCI 格式（兼容 key=value）
                    仅在拖动松手时写入一次，tmp+rename 原子替换，不磨损 flash

            ★ 只写 brightness，不碰 bl_power ★
            DTS 中面板节点带 backlight = <&backlight>，bl_power 由内核面板驱动
            独占（进程退出关 CRTC 时驱动会自动写 bl_power=4）。用户态若同时写
            bl_power 会与驱动互相覆盖，故本程序全程只操作 brightness。

          --------------------------------------------
          省电息屏（真断电，非假黑屏）
          --------------------------------------------
            触发    无有线/无线客户端持续 60 秒
            动作    ① 背光 level 写 0（DTS 极性反转 → PWM duty 0 → LED 电流为 0）
                    ② 再把全黑帧刷进 GRAM（面板供电常开，GRAM 保留内容，
                       万一背光被意外点亮也只会看到纯黑）
            唤醒    触摸或客户端回归
                    ① 背光保持 0（推送过程不可见）
                    ② 重绘目标页面并推送
                    ③ 最后恢复用户亮度 → 全程绝无白闪
            顺序    唤醒时若距最后一次触摸已超过 2 分钟，直接回第 1 页，
                    不会回到息屏前的页面（避免半夜摸屏落在重启页）

            客户端检测（每 20 秒）
              有线 5 重兜底: eth0/carrier → operstate → speed → br-lan/brif → ethtool
              无线: ubus → hostapd_cli / iw / iwinfo

          --------------------------------------------
          第 4 页重启（防误触）
          --------------------------------------------
            必须按住滑块横向拖动到 90% 以上再松手才会重启。
            拖动中滑条变红并显示已拖动百分比，未到位松手则弹回取消。
            触发后显示"正在重启设备"，sync() 后 execl /sbin/reboot，
            10 秒未成功则用 reboot(RB_AUTOBOOT) 内核兜底。

          --------------------------------------------
          安装
          --------------------------------------------
            scp drm_play_arm64 root@192.168.1.1:/usr/sbin/
            scp 99-bootanim    root@192.168.1.1:/etc/init.d/
            scp MiSans-Regular.ttf root@192.168.1.1:/usr/share/fonts/
            ssh root@192.168.1.1
            chmod +x /usr/sbin/drm_play_arm64 /etc/init.d/99-bootanim
            /etc/init.d/99-bootanim enable
            /etc/init.d/99-bootanim start

            停止: /etc/init.d/99-bootanim stop   （或 killall drm_play_arm64）

          --------------------------------------------
          排查
          --------------------------------------------
            运行日志    cat /tmp/drm_play.log
                        启动时会记录背光节点/量程/生效 level、触摸设备与 ABS 量程映射，
                        退出时记录"抬手兜底次数/事件队列溢出次数"。
            亮度配置    cat /etc/config/drm_play_arm64
            手动调光    echo 120 > /sys/class/backlight/pinctrl:backlight/brightness
            实时背光    cat /sys/kernel/debug/pwm | grep -A2 backlight

            若发现"手指按住不动，滑块自己松开了"：
            说明该触摸驱动不持续上报坐标，把源码里的 TOUCH_IDLE_MS 从 500 调大
            （例如 2000）后重新编译即可。日志里的"抬手兜底次数"可用来确认。

            若滑块上下方向与实际相反：调整源码 SWIPE 方向映射（uil_swipe_pages
            的返回值符号），或在编译时加 -DTOUCH_INVERT 风格的开关。

          --------------------------------------------
          本次构建自带单元测试（workflow 内自动执行）
          --------------------------------------------
            test_logic.c  63 项断言：亮度曲线端点/单调性/往返一致性/无死区、
                          循环翻页、垂直手势判定、滑块与重启滑条换算
            任一断言失败即中断构建，不会产出坏固件。
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: H29K-BootAnimation-Pack
          path: |
            drm_play_arm64
            99-bootanim
            drm_ui_logic.h
            INSTALL.txt
