          static int read_int_file(const char *path) {
              FILE *f = fopen(path, "r");
              if (!f) return -1;
              int v = -1;
              if (fscanf(f, "%d", &v) != 1) v = -1;
              fclose(f);
              return v;
          }

          static int read_str_file(const char *path, char *buf, size_t sz) {
              FILE *f = fopen(path, "r");
              if (!f) return -1;
              if (!fgets(buf, (int)sz, f)) { fclose(f); return -1; }
              fclose(f);
              size_t len = strlen(buf);
              while (len > 0 && (buf[len-1] == '\n' || buf[len-1] == '\r' || buf[len-1] == ' '))
                  buf[--len] = 0;
              return 0;
          }

          static int count_wired_clients(void) {
              int count = 0;

              /* 方法 1：直接检查 eth0 carrier */
              if (read_int_file("/sys/class/net/eth0/carrier") == 1) {
                  count++;
                  goto done;
              }

              /* 方法 2：检查 eth0 operstate */
              {
                  char state[32] = {0};
                  if (read_str_file("/sys/class/net/eth0/operstate", state, sizeof(state)) == 0) {
                      if (strcmp(state, "up") == 0) {
                          count++;
                          goto done;
                      }
                  }
              }

              /* 方法 3：检查 eth0 speed */
              {
                  int speed = read_int_file("/sys/class/net/eth0/speed");
                  if (speed > 0) {
                      count++;
                      goto done;
                  }
              }

              /* 方法 4：遍历 br-lan/brif/ */
              {
                  DIR *d = opendir("/sys/class/net/br-lan/brif");
                  if (d) {
                      struct dirent *de;
                      while ((de = readdir(d))) {
                          if (de->d_name[0] == '.') continue;
                          if (strncmp(de->d_name, "eth", 3) != 0) continue;
                          if (strcmp(de->d_name, "eth1") == 0) continue;
                          char cpath[PATH_MAX];
                          snprintf(cpath, sizeof(cpath), "/sys/class/net/%s/carrier", de->d_name);
                          if (read_int_file(cpath) == 1) count++;
                      }
                      closedir(d);
                  }
              }

              /* 方法 5：ethtool 兜底 */
              if (count == 0) {
                  char *out = popen_read("ethtool eth0 2>/dev/null | grep 'Link detected' | grep -c 'yes'");
                  if (out) {
                      if (atoi(out) > 0) count = 1;
                      free(out);
                  }
              }

          done:
              return count;
          }

          static int count_wifi_clients(void) {
              int total = 0;
              char ap_ifaces[16][32];
              int nap = 0;
              char *out = popen_read(
                  "ubus call network.wireless status 2>/dev/null | "
                  "grep -o '\"ifname\" *: *\"[^\"]*\"' | cut -d'\"' -f4");
              if (out && out[0]) {
                  char *line = out;
                  while (*line && nap < 16) {
                      char *nl = strchr(line, '\n');
                      size_t len = nl ? (size_t)(nl - line) : strlen(line);
                      if (len > 0 && len < 32) {
                          memcpy(ap_ifaces[nap], line, len);
                          ap_ifaces[nap][len] = 0;
                          nap++;
                      }
                      line = nl ? nl + 1 : line + len;
                  }
                  free(out);
              } else {
                  if (out) free(out);
                  static const char *cands[] = {"phy0-ap0","wlan0","ath0","ra0","ap0",NULL};
                  for (int i = 0; cands[i] && nap < 16; i++) {
                      char p[PATH_MAX];
                      snprintf(p, sizeof(p), "/sys/class/net/%s", cands[i]);
                      if (access(p, F_OK) == 0) {
                          strncpy(ap_ifaces[nap], cands[i], 31);
                          ap_ifaces[nap][31] = 0;
                          nap++;
                      }
                  }
              }
              for (int i = 0; i < nap; i++) {
                  char p[PATH_MAX];
                  snprintf(p, sizeof(p), "/sys/class/net/%s", ap_ifaces[i]);
                  if (access(p, F_OK) != 0) continue;
                  int sta = 0;
                  char cmd[1024];
                  char *sout;
                  snprintf(cmd, sizeof(cmd),
                           "hostapd_cli -i %s all_sta_info 2>/dev/null | grep -c '^sta '",
                           ap_ifaces[i]);
                  sout = popen_read(cmd);
                  if (sout) { sta = atoi(sout); free(sout); }
                  if (sta <= 0) {
                      snprintf(cmd, sizeof(cmd),
                               "iw %s station dump 2>/dev/null | grep -c '^Station'",
                               ap_ifaces[i]);
                      sout = popen_read(cmd);
                      if (sout) { sta = atoi(sout); free(sout); }
                  }
                  if (sta <= 0) {
                      snprintf(cmd, sizeof(cmd),
                               "iwinfo %s assoclist 2>/dev/null | grep -ci 'dBm'",
                               ap_ifaces[i]);
                      sout = popen_read(cmd);
                      if (sout) { sta = atoi(sout); free(sout); }
                  }
                  if (sta > 0) total += sta;
              }
              return total;
          }

          static int count_clients(void) {
              int wired = count_wired_clients();
              int wifi  = count_wifi_clients();
              int total = wired + wifi;
              return (total > 0) ? total : 0;
          }

          /* ================================================================
           * ★ 背光控制
           *
           * 实测结论（H29K / OpenWrt 25.12 / 内核 6.18）：
           *   - 节点 /sys/class/backlight/pinctrl:backlight，驱动 pwm-backlight
           *   - DTS brightness-levels 为 0..255 恒等线性，duty = level/255 * 25000ns
           *   - DTS pwms 极性反转 → level 0 时引脚恒高 = LED 驱动关闭 = 背光电流为 0
           *   - bl_power 由面板驱动（backlight phandle）独占：进程退出关 CRTC 时
           *     驱动会自动写 bl_power=4。因此本程序【只写 brightness，绝不碰 bl_power】，
           *     避免与内核驱动互相覆盖。
           * ================================================================ */

          static int bl_write_raw(int level) {
              char f[PATH_MAX + 32];
              FILE *fp;
              if (!g_bl_avail) return -1;
              level = uil_clampi(level, 0, g_bl_max);
              snprintf(f, sizeof(f), "%s/brightness", g_bl_path);
              fp = fopen(f, "w");
              if (!fp) return -1;
              fprintf(fp, "%d", level);
              fclose(fp);
              return 0;
          }

          static int bl_find(void) {
              DIR *d = opendir(BL_SYSFS_DIR);
              struct dirent *de;
              char f[PATH_MAX + 32];
              int cur;

              if (!d) return 0;
              while ((de = readdir(d))) {
                  if (de->d_name[0] == '.') continue;
                  snprintf(g_bl_path, sizeof(g_bl_path), BL_SYSFS_DIR "/%s", de->d_name);
                  snprintf(f, sizeof(f), "%s/brightness", g_bl_path);
                  if (access(f, W_OK) == 0) break;
                  g_bl_path[0] = 0;
              }
              closedir(d);
              if (!g_bl_path[0]) return 0;

              snprintf(f, sizeof(f), "%s/max_brightness", g_bl_path);
              cur = read_int_file(f);
              if (cur > 0) g_bl_max = cur;

              g_bl_avail = 1;
              snprintf(f, sizeof(f), "%s/brightness", g_bl_path);
              cur = read_int_file(f);
              if (cur >= 0 && cur <= g_bl_max) g_bl_level = cur;
              return 1;
          }

          /* 设定用户亮度（会写入 sysfs 并更新 g_bl_level） */
          static void bl_set_level(int level) {
              level = uil_clampi(level, BL_MIN_LEVEL, g_bl_max);
              g_bl_level = level;
              bl_write_raw(level);
              g_disp_percent = uil_level_to_ui(level, BL_MIN_LEVEL, g_bl_max);
          }

          /* 息屏：亮度打到 0（背光电流归零）。不动 g_bl_level，唤醒时用它恢复。 */
          static void bl_screen_off(void) { bl_write_raw(BL_OFF_LEVEL); }
          /* 亮屏：恢复用户亮度 */
          static void bl_screen_on(void)  { bl_write_raw(g_bl_level); }

          /* ================================================================
           * ★ 亮度配置持久化
           *
           * 只在拖动结束时写一次，避免拖动过程中上百次写 flash。
           * 采用 tmp + rename 原子替换，掉电不会留下半个文件。
           * ================================================================ */

          static void str_trim(char *s) {
              size_t len;
              char *p = s;
              while (*p==' '||*p=='\t'||*p=='\r'||*p=='\n') p++;
              if (p != s) memmove(s, p, strlen(p) + 1);
              len = strlen(s);
              while (len > 0 && (s[len-1]==' '||s[len-1]=='\t'||s[len-1]=='\r'||s[len-1]=='\n'))
                  s[--len] = 0;
          }

          static int conf_load(void) {
              FILE *f = fopen(CONF_PATH, "r");
              char line[128];
              int got = -1;
              if (!f) return -1;
              while (fgets(line, sizeof(line), f)) {
                  char *eq = strchr(line, '=');
                  if (!eq) continue;
                  *eq = 0;
                  str_trim(line);
                  str_trim(eq + 1);
                  if (strcmp(line, "option brightness") == 0 || strcmp(line, "brightness") == 0) {
                      char *val = eq + 1;
                      if (*val == '\'') val++;
                      char *end = val + strlen(val) - 1;
                      while (end > val && (*end == '\'' || *end == ' ' || *end == '\t')) *end-- = 0;
                      got = atoi(val);
                  }
              }
              fclose(f);
              return got;
          }

          static int conf_save(int level) {
              FILE *f = fopen(CONF_TMP, "w");
              if (!f) return -1;
              fprintf(f, "config drm_play_arm64\n");
              fprintf(f, "\toption brightness '%d'\n", level);
              fflush(f);
              fsync(fileno(f));
              fclose(f);
              if (rename(CONF_TMP, CONF_PATH) != 0) {
                  unlink(CONF_TMP);
                  return -1;
              }
              sync();
              g_bl_dirty = 0;
              return 0;
          }

          /* 启动时初始化背光：先探测节点，再应用配置或默认值。
           * 必须在第一次 drmModeSetCrtc 之前调用——否则开机动画会以 DTS 默认的
           * default-brightness-level=200 亮度播放 36 秒。 */
          static void bl_init_startup(void) {
              int saved;
              if (!bl_find()) {
                  g_bl_level = BL_DEFAULT_LEVEL;
                  g_disp_percent = uil_level_to_ui(g_bl_level, BL_MIN_LEVEL, 255);
                  logmsg("backlight: 未找到 %s 下可写节点，亮度调节不可用", BL_SYSFS_DIR);
                  return;
              }
              saved = conf_load();
              bl_set_level(saved >= 0 ? saved : BL_DEFAULT_LEVEL);
              g_bl_dirty = 0;
              logmsg("backlight: %s max=%d 应用 level=%d (%d%%) 来源=%s",
                     g_bl_path, g_bl_max, g_bl_level, g_disp_percent,
                     (saved >= 0) ? CONF_PATH : "默认值");
          }

          /* ================================================================
           * modem 信息采集
           * ================================================================ */

          static void get_section(void) {
              if (g_section[0]) return;
              char *out = popen_read(
                  "uci show qmodem 2>/dev/null | "
                  "sed -n 's/^qmodem\\.\\([^.]*\\)=modem-device$/\\1/p' | head -1");
              if (out) {
                  char *nl = strchr(out, '\n'); if (nl) *nl = 0;
                  char *cr = strchr(out, '\r'); if (cr) *cr = 0;
                  char *p = out;
                  while (*p == ' ' || *p == '\t') p++;
                  strncpy(g_section, p, sizeof(g_section) - 1);
                  g_section[sizeof(g_section) - 1] = 0;
                  free(out);
              }
          }

          static int fields_filled_count(void) {
              int c = 0;
              for (int i = 0; i < FIELD_COUNT; i++) if (g_fields[i].filled) c++;
              return c;
          }

          static void try_fill(const char *key, const char *full, const char *val) {
              if (!val || !val[0]) return;
              char clean[128];
              strncpy(clean, val, sizeof(clean) - 1);
              clean[sizeof(clean) - 1] = 0;
              sanitize_value(clean);
              if (!clean[0]) return;
              for (int i = 0; i < FIELD_COUNT; i++) {
                  if (g_fields[i].filled) continue;
                  int hit = 0;
                  for (int c = 0; g_fields[i].cands[c]; c++) {
                      if (field_match(g_fields[i].cands[c], key, full)) { hit = 1; break; }
                  }
                  if (hit) {
                      strncpy(g_fields[i].value, clean, sizeof(g_fields[i].value) - 1);
                      g_fields[i].value[sizeof(g_fields[i].value) - 1] = 0;
                      g_fields[i].filled = 1;
                      break;
                  }
              }
          }

          static void scan_array_json(const char *json) {
              const char *mi = strstr(json, "\"modem_info\"");
              if (!mi) return;
              const char *p = strchr(mi, '[');
              if (!p) return;
              p++;
              while (*p) {
                  while (*p && *p != '{') { if (*p == ']') return; p++; }
                  if (*p != '{') return;
                  const char *start = p;
                  int depth = 0, in_str = 0;
                  const char *q = p;
                  for (; *q; q++) {
                      if (in_str) {
                          if (*q == '\\' && q[1]) { q++; continue; }
                          if (*q == '"') in_str = 0;
                      } else {
                          if (*q == '"') in_str = 1;
                          else if (*q == '{') depth++;
                          else if (*q == '}') { depth--; if (depth == 0) { q++; break; } }
                      }
                  }
                  size_t objlen = (size_t)(q - start);
                  char *obj = malloc(objlen + 1);
                  if (!obj) { p = q; continue; }
                  memcpy(obj, start, objlen);
                  obj[objlen] = 0;
                  char key[64] = {0}, full[128] = {0}, val[128] = {0};
                  json_get_field(obj, "key", key, sizeof(key));
                  json_get_field(obj, "full_name", full, sizeof(full));
                  if (json_get_field(obj, "value", val, sizeof(val)) != 0)
                      if (json_get_field(obj, "val", val, sizeof(val)) != 0)
                          json_get_field(obj, "data", val, sizeof(val));
                  try_fill(key, full, val);
                  free(obj);
                  p = q;
              }
          }

          static void scan_flat_json(const char *json) {
              for (int i = 0; i < FIELD_COUNT; i++) {
                  if (g_fields[i].filled) continue;
                  for (int c = 0; g_fields[i].cands[c]; c++) {
                      char val[128] = {0};
                      if (json_get_field(json, g_fields[i].cands[c], val, sizeof(val)) == 0
                          && val[0]) {
                          try_fill(g_fields[i].cands[c], NULL, val);
                          break;
                      }
                  }
              }
          }

          static void scan_cache_files(FILE *dbg) {
              DIR *d = opendir("/tmp");
              if (!d) return;
              struct dirent *de;
              while ((de = readdir(d))) {
                  if (strncmp(de->d_name, "cache_", 6) != 0) continue;
                  if (!strstr(de->d_name, "info")) continue;
                  char path[PATH_MAX];
                  snprintf(path, sizeof(path), "/tmp/%s", de->d_name);
                  struct stat st;
                  if (stat(path, &st) != 0 || !S_ISREG(st.st_mode)) continue;
                  if (st.st_size <= 0 || st.st_size > 65536) continue;
                  FILE *f = fopen(path, "rb");
                  if (!f) continue;
                  char *buf = malloc((size_t)st.st_size + 1);
                  if (!buf) { fclose(f); continue; }
                  size_t n = fread(buf, 1, (size_t)st.st_size, f);
                  fclose(f);
                  buf[n] = 0;
                  if (dbg) fprintf(dbg, "== cache file %s (%d bytes) ==\n%s\n\n",
                                   path, (int)n, buf);
                  scan_array_json(buf);
                  free(buf);
              }
              closedir(d);
          }

          static void probe_ubus_obj(FILE *dbg) {
              static const char *objs[] = {"qmodem", "modem", "modem_scand", "qmodem_scand", NULL};
              if (g_ubus_obj[0]) return;
              for (int i = 0; objs[i]; i++) {
                  char cmd[128];
                  snprintf(cmd, sizeof(cmd), "ubus -v list %s 2>/dev/null", objs[i]);
                  char *out = popen_read(cmd);
                  if (out && out[0]) {
                      strncpy(g_ubus_obj, objs[i], sizeof(g_ubus_obj) - 1);
                      if (dbg) fprintf(dbg, "== ubus -v list %s ==\n%s\n", objs[i], out);
                      free(out);
                      return;
                  }
                  if (out) free(out);
              }
          }

          static char *ubus_call_raw(const char *obj, const char *method, const char *sec) {
              char cmd[320];
              if (sec && sec[0])
                  snprintf(cmd, sizeof(cmd),
                           "ubus call %s %s '{\"config_section\":\"%s\"}' 2>/dev/null",
                           obj, method, sec);
              else
                  snprintf(cmd, sizeof(cmd), "ubus call %s %s 2>/dev/null", obj, method);
              char *out = popen_read(cmd);
              if (out && (!out[0] || !strchr(out, '{'))) { free(out); out = NULL; }
              return out;
          }

          static void collect_group(FILE *dbg, const char *const methods[], char *cache) {
              if (!g_ubus_obj[0]) return;
              const char *list[8];
              int n = 0;
              if (cache[0]) list[n++] = cache;
              for (int i = 0; methods[i] && n < 7; i++) {
                  int dup = 0;
                  for (int j = 0; j < n; j++) if (strcmp(list[j], methods[i]) == 0) dup = 1;
                  if (!dup) list[n++] = methods[i];
              }
              int before = fields_filled_count();
              for (int i = 0; i < n; i++) {
                  char *json = ubus_call_raw(g_ubus_obj, list[i], g_section);
                  if (!json) json = ubus_call_raw(g_ubus_obj, list[i], NULL);
                  if (!json) continue;
                  if (dbg) fprintf(dbg, "== ubus %s %s ==\n%s\n\n", g_ubus_obj, list[i], json);
                  scan_array_json(json);
                  scan_flat_json(json);
                  free(json);
                  if (fields_filled_count() > before) {
                      strncpy(cache, list[i], 31);
                      cache[31] = 0;
                      break;
                  }
              }
          }

          static void scan_rundir_file(const char *path, const char *name, FILE *dbg) {
              FILE *f = fopen(path, "rb");
              if (!f) return;
              static char buf[4096];
              size_t n = fread(buf, 1, sizeof(buf) - 1, f);
              fclose(f);
              buf[n] = 0;
              while (n > 0 && (buf[n-1]=='\n'||buf[n-1]=='\r'||buf[n-1]==' '||buf[n-1]=='\t'))
                  buf[--n] = 0;
              if (!n) return;
              if (dbg) fprintf(dbg, "-- file %s = %s\n", path, buf);
              if (buf[0] == '{') { scan_array_json(buf); scan_flat_json(buf); }
              try_fill(name, name, buf);
          }

          static void scan_rundir(FILE *dbg) {
              DIR *d = opendir(QMODEM_RUNDIR);
              if (!d) return;
              struct dirent *de;
              while ((de = readdir(d))) {
                  if (de->d_name[0] == '.') continue;
                  char path[PATH_MAX];
                  snprintf(path, sizeof(path), QMODEM_RUNDIR "/%s", de->d_name);
                  struct stat st;
                  if (stat(path, &st) != 0) continue;
                  if (S_ISDIR(st.st_mode)) {
                      DIR *d2 = opendir(path);
                      if (!d2) continue;
                      struct dirent *de2;
                      while ((de2 = readdir(d2))) {
                          if (de2->d_name[0] == '.') continue;
                          char p2[PATH_MAX * 2];
                          snprintf(p2, sizeof(p2), "%s/%s", path, de2->d_name);
                          struct stat st2;
                          if (stat(p2, &st2) == 0 && S_ISREG(st2.st_mode) && st2.st_size < 4000)
                              scan_rundir_file(p2, de2->d_name, dbg);
                      }
                      closedir(d2);
                  } else if (S_ISREG(st.st_mode) && st.st_size < 4000) {
                      scan_rundir_file(path, de->d_name, dbg);
                  }
              }
              closedir(d);
          }

          static void collect_modem_info(void) {
              for (int i = 0; i < FIELD_COUNT; i++) {
                  g_fields[i].filled = 0;
                  g_fields[i].value[0] = 0;
              }
              get_section();
              FILE *dbg = fopen(QMODEM_DBG, "w");
              scan_cache_files(dbg);
              if (fields_filled_count() < FIELD_COUNT) {
                  static const char *M_BASE[] = {"base_info","get_base_info","basic_info",
                                                 "status","get_status",NULL};
                  static const char *M_SIM[]  = {"sim_info","get_sim_info","sim_status",
                                                 "get_sim_status",NULL};
                  static const char *M_NET[]  = {"network_info","get_network_info","cell_info",
                                                 "network_status","get_cell_info",NULL};
                  probe_ubus_obj(dbg);
                  collect_group(dbg, M_BASE, g_method_base);
                  collect_group(dbg, M_SIM,  g_method_sim);
                  collect_group(dbg, M_NET,  g_method_net);
                  scan_rundir(dbg);
              }
              postprocess_fields();
              if (dbg) fclose(dbg);
          }

          /* ================================================================
           * DRM
           * ================================================================ */

          static int drm_init(const char *drm_device,
                              drmModeRes **out_res,
                              drmModeConnector **out_conn,
                              uint32_t *out_crtc_id) {
              int fd = open(drm_device, O_RDWR | O_CLOEXEC);
              if (fd < 0) return -1;
              uint64_t has_dumb = 0;
              if (drmGetCap(fd, DRM_CAP_DUMB_BUFFER, &has_dumb) < 0 || !has_dumb) {
                  close(fd); return -1;
              }
              drmModeRes *res = drmModeGetResources(fd);
              if (!res) { close(fd); return -1; }
              drmModeConnector *conn = NULL;
              for (int i = 0; i < res->count_connectors; i++) {
                  drmModeConnector *c = drmModeGetConnector(fd, res->connectors[i]);
                  if (!c) continue;
                  if (c->count_modes > 0) {
                      conn = c;
                      screen_w = c->modes[0].hdisplay;
                      screen_h = c->modes[0].vdisplay;
                      break;
                  }
                  drmModeFreeConnector(c);
              }
              if (!conn) { drmModeFreeResources(res); close(fd); return -1; }
              uint32_t crtc_id = 0;
              if (conn->encoder_id) {
                  drmModeEncoder *enc = drmModeGetEncoder(fd, conn->encoder_id);
                  if (enc) { crtc_id = enc->crtc_id; drmModeFreeEncoder(enc); }
              }
              if (!crtc_id && res->count_crtcs > 0) crtc_id = res->crtcs[0];
              if (!crtc_id) {
                  drmModeFreeConnector(conn);
                  drmModeFreeResources(res);
                  close(fd); return -1;
              }
              *out_res = res;
              *out_conn = conn;
              *out_crtc_id = crtc_id;
              return fd;
          }

          static int drm_create_fb(int fd, struct drm_mode_create_dumb *dumb,
                                   uint32_t *fb_id, void **map_out) {
              memset(dumb, 0, sizeof(*dumb));
              dumb->width = screen_w;
              dumb->height = screen_h;
              dumb->bpp = BPP;
              if (drmIoctl(fd, DRM_IOCTL_MODE_CREATE_DUMB, dumb) < 0) return -1;
              uint32_t handles[4] = {dumb->handle, 0, 0, 0};
              uint32_t pitches[4] = {dumb->pitch, 0, 0, 0};
              uint32_t offsets[4] = {0, 0, 0, 0};
              if (drmModeAddFB2(fd, screen_w, screen_h, DRM_FORMAT_XRGB8888,
                                handles, pitches, offsets, fb_id, 0) < 0) return -1;
              struct drm_mode_map_dumb map_req;
              memset(&map_req, 0, sizeof(map_req));
              map_req.handle = dumb->handle;
              if (drmIoctl(fd, DRM_IOCTL_MODE_MAP_DUMB, &map_req) < 0) return -1;
              *map_out = mmap(0, dumb->size, PROT_READ | PROT_WRITE,
                              MAP_SHARED, fd, map_req.offset);
              if (*map_out == MAP_FAILED) return -1;
              memset(*map_out, 0, dumb->size);
              return 0;
          }

          static void drm_cleanup(int fd, uint32_t crtc_id, drmModeRes *res,
                                  drmModeConnector *conn,
                                  struct drm_mode_create_dumb *dumbs, void **maps,
                                  uint32_t *fb_ids, int count) {
              /* 正确关闭 CRTC（原先传 crtc_id=0 会被内核拒为 ENOENT，等于没关）。
               * 关闭后面板驱动会自行调 backlight_disable()，退出即灭屏。 */
              if (fd >= 0 && crtc_id)
                  drmModeSetCrtc(fd, crtc_id, 0, 0, 0, NULL, 0, NULL);
              for (int i = 0; i < count; i++) {
                  if (fb_ids[i]) { drmModeRmFB(fd, fb_ids[i]); fb_ids[i] = 0; }
                  if (maps[i] && maps[i] != MAP_FAILED) {
                      munmap(maps[i], dumbs[i].size);
                      maps[i] = NULL;
                  }
                  if (dumbs[i].handle) {
                      struct drm_mode_destroy_dumb dreq;
                      memset(&dreq, 0, sizeof(dreq));
                      dreq.handle = dumbs[i].handle;
                      drmIoctl(fd, DRM_IOCTL_MODE_DESTROY_DUMB, &dreq);
                      dumbs[i].handle = 0;
                  }
              }
              if (g_saved_crtc) {
                  uint32_t conn_id = conn ? conn->connector_id : 0;
                  if (g_saved_crtc->buffer_id != 0 && conn) {
                      drmModeSetCrtc(fd, g_saved_crtc->crtc_id,
                                     g_saved_crtc->buffer_id,
                                     g_saved_crtc->x, g_saved_crtc->y,
                                     &conn_id, 1, &g_saved_crtc->mode);
                  }
                  drmModeFreeCrtc(g_saved_crtc);
                  g_saved_crtc = NULL;
              }
              if (conn) drmModeFreeConnector(conn);
              if (res) drmModeFreeResources(res);
              if (fd >= 0) close(fd);
          }

          /* ================================================================
           * 绘图原语
           * ================================================================ */

          static void blend_px(uint8_t *buf, int W, int H, int x, int y,
                               int r, int g, int b, int a) {
              int i;
              if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
              i = (y * W + x) * 4;
              if (a >= 255) {
                  buf[i] = (uint8_t)r; buf[i+1] = (uint8_t)g;
                  buf[i+2] = (uint8_t)b; buf[i+3] = 255;
                  return;
              }
              buf[i]   = (uint8_t)((r * a + buf[i]   * (255 - a)) / 255);
              buf[i+1] = (uint8_t)((g * a + buf[i+1] * (255 - a)) / 255);
              buf[i+2] = (uint8_t)((b * a + buf[i+2] * (255 - a)) / 255);
              buf[i+3] = 255;
          }

          static void fill_rect_a(uint8_t *buf, int W, int H, int x, int y, int w, int h,
                                  int r, int g, int b, int a) {
              int i, j;
              for (j = 0; j < h; j++)
                  for (i = 0; i < w; i++)
                      blend_px(buf, W, H, x + i, y + j, r, g, b, a);
          }

          static void fill_round_a(uint8_t *buf, int W, int H, int x, int y, int w, int h,
                                   int rad, int r, int g, int b, int a) {
              int i, j;
              if (w <= 0 || h <= 0) return;
              if (rad < 0) rad = 0;
              if (rad > w / 2) rad = w / 2;
              if (rad > h / 2) rad = h / 2;
              for (j = 0; j < h; j++) {
                  for (i = 0; i < w; i++) {
                      int dx = 0, dy = 0;
                      if (i < rad && j < rad)                     { dx = rad - i;          dy = rad - j; }
                      else if (i >= w - rad && j < rad)           { dx = i - (w - rad - 1); dy = rad - j; }
                      else if (i < rad && j >= h - rad)           { dx = rad - i;          dy = j - (h - rad - 1); }
                      else if (i >= w - rad && j >= h - rad)      { dx = i - (w - rad - 1); dy = j - (h - rad - 1); }
                      if ((dx || dy) && (dx * dx + dy * dy) > rad * rad) continue;
                      blend_px(buf, W, H, x + i, y + j, r, g, b, a);
                  }
              }
          }

          static void fill_circle_a(uint8_t *buf, int W, int H, int cx, int cy, int rad,
                                    int r, int g, int b, int a) {
              int i, j;
              if (rad <= 0) return;
              for (j = -rad; j <= rad; j++)
                  for (i = -rad; i <= rad; i++)
                      if (i * i + j * j <= rad * rad)
                          blend_px(buf, W, H, cx + i, cy + j, r, g, b, a);
          }

          static void fill_tri_a(uint8_t *buf, int W, int H,
                                 int ax, int ay, int bx, int by, int cx, int cy,
                                 int r, int g, int b, int a) {
              int minx = ax, maxx = ax, miny = ay, maxy = ay, x, y;
              double d;
              if (bx < minx) minx = bx;
              if (cx < minx) minx = cx;
              if (bx > maxx) maxx = bx;
              if (cx > maxx) maxx = cx;
              if (by < miny) miny = by;
              if (cy < miny) miny = cy;
              if (by > maxy) maxy = by;
              if (cy > maxy) maxy = cy;
              d = (double)(by - cy) * (ax - cx) + (double)(cx - bx) * (ay - cy);
              if (d == 0.0) return;
              for (y = miny; y <= maxy; y++) {
                  for (x = minx; x <= maxx; x++) {
                      double u = ((double)(by - cy) * (x - cx) + (double)(cx - bx) * (y - cy)) / d;
                      double v = ((double)(cy - ay) * (x - cx) + (double)(ax - cx) * (y - cy)) / d;
                      if (u >= 0.0 && v >= 0.0 && (u + v) <= 1.0)
                          blend_px(buf, W, H, x, y, r, g, b, a);
                  }
              }
          }

          static void vgrad(uint8_t *buf, int W, int H,
                            int tr, int tg, int tb, int br, int bg, int bb) {
              int x, y;
              int dh = (H > 1) ? (H - 1) : 1;
              for (y = 0; y < H; y++) {
                  int r = tr + (br - tr) * y / dh;
                  int g = tg + (bg - tg) * y / dh;
                  int b = tb + (bb - tb) * y / dh;
                  for (x = 0; x < W; x++) {
                      int i = (y * W + x) * 4;
                      buf[i] = (uint8_t)r; buf[i+1] = (uint8_t)g;
                      buf[i+2] = (uint8_t)b; buf[i+3] = 255;
                  }
              }
          }

          static int font_init(void) {
              FILE *ff;
              long fsize;
              uint8_t *data;
              int desc, lg;
              if (g_font_ok) return 1;
              ff = fopen(FONT_PATH, "rb");
              if (!ff) { logmsg("font: 打不开 %s", FONT_PATH); return 0; }
              fseek(ff, 0, SEEK_END);
              fsize = ftell(ff);
              fseek(ff, 0, SEEK_SET);
              if (fsize <= 0) { fclose(ff); return 0; }
              data = malloc((size_t)fsize);
              if (!data) { fclose(ff); return 0; }
              if (fread(data, 1, (size_t)fsize, ff) != (size_t)fsize) {
                  free(data); fclose(ff); return 0;
              }
              fclose(ff);
              if (!stbtt_InitFont(&g_font, data, 0)) { free(data); return 0; }
              g_font_data = data;
              stbtt_GetFontVMetrics(&g_font, &g_font_asc, &desc, &lg);
              g_font_ok = 1;
              return 1;
          }

          static void draw_line_rgba(uint8_t *rgba, int W, int H,
                                     stbtt_fontinfo *font, float scale, int ascent,
                                     int x, int y, const char *text,
                                     int r, int g, int b, int max_x) {
              int pen_x = x;
              for (size_t i = 0; text[i]; ) {
                  int cp, bytes = utf8_decode(text + i, &cp);
                  i += (size_t)bytes;
                  if (cp == '\n') break;
                  if (max_x > 0 && pen_x >= max_x) break;
                  int x0, y0, x1, y1;
                  stbtt_GetCodepointBitmapBox(font, cp, scale, scale, &x0, &y0, &x1, &y1);
                  int gw = x1 - x0, gh = y1 - y0;
                  if (gw > 0 && gh > 0) {
                      uint8_t *bmp = malloc((size_t)(gw * gh));
                      if (bmp) {
                          stbtt_MakeCodepointBitmap(font, bmp, gw, gh, gw, scale, scale, cp);
                          int bx = pen_x + x0;
                          int by = y + (int)(ascent * scale) + y0;
                          for (int row = 0; row < gh; row++) {
                              for (int col = 0; col < gw; col++) {
                                  int px = bx + col, py = by + row;
                                  if (px >= 0 && px < W && py >= 0 && py < H) {
                                      if (max_x > 0 && px >= max_x) continue;
                                      uint8_t a = bmp[row * gw + col];
                                      if (a > 0) {
                                          int idx = (py * W + px) * 4;
                                          rgba[idx+0] = (uint8_t)((r * a + rgba[idx+0] * (255 - a)) / 255);
                                          rgba[idx+1] = (uint8_t)((g * a + rgba[idx+1] * (255 - a)) / 255);
                                          rgba[idx+2] = (uint8_t)((b * a + rgba[idx+2] * (255 - a)) / 255);
                                          rgba[idx+3] = 255;
                                      }
                                  }
                              }
                          }
                          free(bmp);
                      }
                  }
                  int adv;
                  stbtt_GetCodepointHMetrics(font, cp, &adv, NULL);
                  pen_x += (int)(adv * scale);
              }
          }

          static int text_width(stbtt_fontinfo *font, float scale, const char *s) {
              int w = 0;
              for (size_t i = 0; s[i]; ) {
                  int cp, bytes = utf8_decode(s + i, &cp);
                  int adv;
                  i += (size_t)bytes;
                  if (cp == '\n') break;
                  stbtt_GetCodepointHMetrics(font, cp, &adv, NULL);
                  w += (int)(adv * scale);
              }
              return w;
          }

          static float font_scale(float size) {
              return stbtt_ScaleForPixelHeight(&g_font, size);
          }

          /* 左对齐文本 */
          static void txt_l(uint8_t *buf, int W, int H, float size, int x, int y,
                            const char *s, int r, int g, int b) {
              if (!g_font_ok) return;
              draw_line_rgba(buf, W, H, &g_font, font_scale(size), g_font_asc,
                             x, y, s, r, g, b, 0);
          }

          /* 水平居中文本（cx 为中心） */
          static void txt_c(uint8_t *buf, int W, int H, float size, int cx, int y,
                            const char *s, int r, int g, int b) {
              int w;
              if (!g_font_ok) return;
              w = text_width(&g_font, font_scale(size), s);
              draw_line_rgba(buf, W, H, &g_font, font_scale(size), g_font_asc,
                             cx - w / 2, y, s, r, g, b, 0);
          }

          /* 右对齐文本（rx 为右边界） */
          static void txt_r(uint8_t *buf, int W, int H, float size, int rx, int y,
                            const char *s, int r, int g, int b) {
              int w;
              if (!g_font_ok) return;
              w = text_width(&g_font, font_scale(size), s);
              draw_line_rgba(buf, W, H, &g_font, font_scale(size), g_font_asc,
                             rx - w, y, s, r, g, b, 0);
          }

          /* 页面统一外框：渐变底 + 标题 + 页码 + 分隔线 + 底部提示 */
          static void page_chrome(uint8_t *buf, int W, int H, const char *title,
                                  int page_idx, const char *hint) {
              char pn[16];
              vgrad(buf, W, H, 22, 25, 32, 8, 9, 13);
              fill_rect_a(buf, W, H, 0, 0, W, 34, 255, 255, 255, 10);
              if (!g_font_ok) return;
              txt_l(buf, W, H, 20.0f, 14, 7, title, 236, 240, 246);
              snprintf(pn, sizeof(pn), "%d / %d", page_idx + 1, PAGE_COUNT);
              txt_r(buf, W, H, 20.0f, W - 14, 7, pn, 140, 148, 162);
              fill_rect_a(buf, W, H, 14, 35, W - 28, 1, 255, 255, 255, 28);
              if (hint && hint[0])
                  txt_c(buf, W, H, 12.0f, W / 2, H - 22, hint, 132, 140, 154);
          }

          /* ================================================================
           * 网络抓取
           * ================================================================ */

          static void copy_centered(void *dst, uint32_t pitch,
                                    const uint8_t *src, uint32_t img_w, uint32_t img_h) {
              memset(dst, 0, (size_t)pitch * screen_h);
              int x_off = ((int)screen_w - (int)img_w) / 2;
              int y_off = ((int)screen_h - (int)img_h) / 2;
              if (x_off < 0) x_off = 0;
              if (y_off < 0) y_off = 0;
              uint32_t cw = (img_w > screen_w) ? screen_w : img_w;
              uint32_t ch = (img_h > screen_h) ? screen_h : img_h;
              for (uint32_t y = 0; y < ch; y++)
                  memcpy((uint8_t *)dst + (y + y_off) * pitch + x_off * 4,
                         src + y * img_w * 4, cw * 4);
          }

          static void fetcher_start(void) {
              if (g_fetch_pid > 0) {
                  if (waitpid(g_fetch_pid, NULL, WNOHANG) == 0) return;
                  g_fetch_pid = 0;
              }
              pid_t p = fork();
              if (p == 0) {
                  char cmd[1024];
                  int rc;
                  snprintf(cmd, sizeof(cmd),
                           "wget -qO /tmp/.ht.new --timeout=%d '%s' 2>/dev/null && mv -f /tmp/.ht.new %s",
                           HTTP_TIMEOUT, HITOKOTO_URL, HITOKOTO_CACHE);
                  rc = system(cmd);
                  snprintf(cmd, sizeof(cmd),
                           "wget -qO /tmp/.bg.new --timeout=%d '%s' 2>/dev/null && mv -f /tmp/.bg.new %s",
                           HTTP_TIMEOUT, PICSUM_URL, BG_CACHE);
                  rc = system(cmd);
                  (void)rc;
                  _exit(0);
              }
              if (p > 0) g_fetch_pid = p;
          }

          static int fetcher_poll(void) {
              if (g_fetch_pid > 0 && waitpid(g_fetch_pid, NULL, WNOHANG) == g_fetch_pid) {
                  g_fetch_pid = 0;
                  return 1;
              }
              return 0;
          }

          static void fetch_hitokoto(char *text_buf, size_t buf_size) {
              char hitokoto[512] = {0};
              char from[128] = {0};
              int ok = 0;
              FILE *f = fopen(HITOKOTO_CACHE, "rb");
              if (f) {
                  static char json[8192];
                  size_t n = fread(json, 1, sizeof(json) - 1, f);
                  fclose(f);
                  json[n] = '\0';
                  if (json_get_field(json, "hitokoto", hitokoto, sizeof(hitokoto)) == 0
                      && hitokoto[0]) {
                      json_get_field(json, "from", from, sizeof(from));
                      ok = 1;
                  }
              }
              if (ok) {
                  if (from[0]) snprintf(text_buf, buf_size, "%s\n\n——%s", hitokoto, from);
                  else         snprintf(text_buf, buf_size, "%s", hitokoto);
              } else {
                  strncpy(text_buf, FALLBACK_TEXTS[g_fallback_idx], buf_size - 1);
                  text_buf[buf_size - 1] = '\0';
                  g_fallback_idx = (g_fallback_idx + 1) % FALLBACK_COUNT;
              }
          }

          static uint8_t *fetch_background(int *w, int *h) {
              int channels;
              return stbi_load(BG_CACHE, w, h, &channels, 4);
          }

          /* ================================================================
           * 各页渲染
           * ================================================================ */

          /* 第 1 页：一言 + 随机背景（保留原逻辑，字体改为全局缓存） */
          static void render_text_rgba(uint8_t *rgba, int img_w, int img_h, const char *text) {
              float scale;
              int ascent, descent, line_gap, line_height, num_lines, total_h, y_start, cur_y;
              const char *line_start;
              char tmp[512];

              if (!g_font_ok) return;
              scale = font_scale(FONT_SIZE);
              stbtt_GetFontVMetrics(&g_font, &ascent, &descent, &line_gap);
              line_height = (int)((ascent - descent + line_gap) * scale);
              if (line_height <= 0) line_height = (int)(FONT_SIZE + 2);
              num_lines = 1;
              for (const char *p = text; *p; p++) if (*p == '\n') num_lines++;
              total_h = num_lines * line_height;
              y_start = (img_h - total_h) / 2;
              if (y_start < 0) y_start = 0;

              line_start = text;
              cur_y = y_start;
              while (line_start && *line_start) {
                  const char *line_end = strchr(line_start, '\n');
                  size_t line_len = line_end ? (size_t)(line_end - line_start) : strlen(line_start);
                  size_t cl = (line_len < sizeof(tmp) - 1) ? line_len : sizeof(tmp) - 1;
                  int x_pos, line_w;

                  memcpy(tmp, line_start, cl);
                  tmp[cl] = '\0';
                  line_w = text_width(&g_font, scale, tmp);
                  x_pos = (img_w - line_w) / 2;
                  if (x_pos < 0) x_pos = 0;
                  draw_line_rgba(rgba, img_w, img_h, &g_font, scale, ascent,
                                 x_pos, cur_y, tmp, TEXT_R, TEXT_G, TEXT_B, 0);
                  cur_y += line_height;
                  line_start = line_end ? line_end + 1 : NULL;
              }
          }

          static void render_page0_rgba(uint8_t *canvas) {
              char raw_text[2048];
              char wrapped_text[4096];
              fetch_hitokoto(raw_text, sizeof(raw_text));
              wrap_text(raw_text, wrapped_text, sizeof(wrapped_text), MAX_CHARS_PER_LINE);
              int bg_w = 0, bg_h = 0;
              uint8_t *bg_rgba = fetch_background(&bg_w, &bg_h);

              /* 1. 背景图（或纯黑底） */
              if (bg_rgba && bg_w > 0 && bg_h > 0) {
                  stbir_resize(bg_rgba, bg_w, bg_h, 0,
                               canvas, SCREEN_W, SCREEN_H, 0,
                               STBIR_RGBA, STBIR_TYPE_UINT8,
                               STBIR_EDGE_CLAMP, STBIR_FILTER_DEFAULT);
                  stbi_image_free(bg_rgba);
              } else {
                  memset(canvas, 0, (size_t)(SCREEN_W * SCREEN_H * 4));
                  for (int i = 0; i < SCREEN_W * SCREEN_H; i++) canvas[i*4 + 3] = 255;
              }

              /* 2. 逐行半透明暗色底板（每行独立跟随文字宽度） */
              if (g_font_ok) {
                  float scale = font_scale(FONT_SIZE);
                  int ascent, descent, line_gap;
                  stbtt_GetFontVMetrics(&g_font, &ascent, &descent, &line_gap);
                  int line_height = (int)((ascent - descent + line_gap) * scale);
                  if (line_height <= 0) line_height = (int)(FONT_SIZE + 2);

                  int num_lines = 1;
                  for (const char *p = wrapped_text; *p; p++) if (*p == '\n') num_lines++;
                  int total_h = num_lines * line_height;
                  int y_start = (SCREEN_H - total_h) / 2;
                  if (y_start < 0) y_start = 0;

                  int pad_x = 8, pad_y = 4, ov = 140;
                  const char *ls = wrapped_text;
                  int cur_y = y_start;
                  while (ls && *ls) {
                      const char *le = strchr(ls, '\n');
                      size_t ll = le ? (size_t)(le - ls) : strlen(ls);
                      int line_w = 0;
                      for (size_t i = 0; i < ll; ) {
                          int cp, bytes = utf8_decode(ls + i, &cp);
                          int adv;
                          if (i + (size_t)bytes > ll) break;
                          i += (size_t)bytes;
                          stbtt_GetCodepointHMetrics(&g_font, cp, &adv, NULL);
                          line_w += (int)(adv * scale);
                      }
                      int xp = (SCREEN_W - line_w) / 2;
                      if (xp < 0) xp = 0;
                      int bx0 = xp - pad_x;              if (bx0 < 0) bx0 = 0;
                      int bx1 = xp + line_w + pad_x;     if (bx1 > SCREEN_W) bx1 = SCREEN_W;
                      int by0 = cur_y - pad_y;           if (by0 < 0) by0 = 0;
                      int by1 = cur_y + line_height + pad_y; if (by1 > SCREEN_H) by1 = SCREEN_H;
                      for (int y = by0; y < by1; y++) {
                          for (int x = bx0; x < bx1; x++) {
                              int idx = (y * SCREEN_W + x) * 4;
                              canvas[idx+0] = (uint8_t)((canvas[idx+0] * (255-ov)) >> 8);
                              canvas[idx+1] = (uint8_t)((canvas[idx+1] * (255-ov)) >> 8);
                              canvas[idx+2] = (uint8_t)((canvas[idx+2] * (255-ov)) >> 8);
                          }
                      }
                      cur_y += line_height;
                      ls = le ? le + 1 : NULL;
                  }
              }

              /* 3. 文字 */
              render_text_rgba(canvas, SCREEN_W, SCREEN_H, wrapped_text);
          }

          /* 第 2 页：上网模块信息 */
          static void render_info_page_rgba(uint8_t *rgba, int W, int H) {
              int y;
              char line[256];
              const char *conn = g_fields[0].filled ? g_fields[0].value : "--";
              const char *temp = g_fields[1].filled ? g_fields[1].value : "--";
              const char *sim  = g_fields[2].filled ? g_fields[2].value : "--";
              const char *isp  = g_fields[3].filled ? g_fields[3].value : "--";
              const char *mode = g_fields[4].filled ? g_fields[4].value : "--";
              const char *ul   = g_fields[5].filled ? g_fields[5].value : "--";
              const char *dl   = g_fields[6].filled ? g_fields[6].value : "--";

              for (int i = 0; i < W * H; i++) {
                  rgba[i*4+0] = 0; rgba[i*4+1] = 0; rgba[i*4+2] = 0; rgba[i*4+3] = 255;
              }
              if (!g_font_ok) return;
              float s_title = font_scale(INFO_TITLE_SIZE);
              float s_body  = font_scale(INFO_FONT_SIZE);

              draw_line_rgba(rgba, W, H, &g_font, s_title, g_font_asc, 10, 8,
                             "上网模块信息页", 255, 255, 255, 0);
              y = 42;
              snprintf(line, sizeof(line), "连接状态：%s", conn);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 10, y, line, 255, 255, 255, 170);
              snprintf(line, sizeof(line), "温度：%s", temp);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 175, y, line, 255, 255, 255, 0);
              y += 22;
              snprintf(line, sizeof(line), "SIM卡状态：%s", sim);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 10, y, line, 255, 255, 255, 0);
              y += 22;
              snprintf(line, sizeof(line), "互联网服务提供商：%s", isp);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 10, y, line, 255, 255, 255, 0);
              y += 22;
              snprintf(line, sizeof(line), "网络模式：%s", mode);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 10, y, line, 255, 255, 255, 0);
              y += 22;
              snprintf(line, sizeof(line), "上行带宽：%s", ul);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 10, y, line, 255, 255, 255, 170);
              snprintf(line, sizeof(line), "下行带宽：%s", dl);
              draw_line_rgba(rgba, W, H, &g_font, s_body, g_font_asc, 175, y, line, 255, 255, 255, 0);
          }

          /* 第 3 页：亮度调节
           * percent 为 UI 百分比；dragging=1 时手柄高亮、提示语切换。
           * 亮度本身通过 sysfs 即时生效，本函数只负责把状态画出来。 */
          static void render_brightness_page(uint8_t *buf, int W, int H,
                                            int percent, int dragging) {
              int tx0 = SL_X0, tx1 = SL_X1;
              int ty = SL_CY - SL_TRACK_H / 2;
              int hx, i;
              char num[16];
              static const char *const ticks[5] = {"0%", "25%", "50%", "75%", "100%"};

              page_chrome(buf, W, H, "亮度调节", PAGE_BRIGHTNESS,
                          dragging ? "松手后自动保存" : "上下滑动翻页 · 拖动滑块调节亮度");
              if (!g_font_ok) return;

              /* 中央大号百分比 */
              snprintf(num, sizeof(num), "%d%%", uil_clampi(percent, 0, 100));
              txt_c(buf, W, H, 40.0f, W / 2, 44, num, 0, 220, 235);

              /* 轨道 */
              fill_round_a(buf, W, H, tx0, ty, tx1 - tx0, SL_TRACK_H, SL_TRACK_H / 2,
                           58, 62, 72, 255);
              hx = tx0 + (int)((double)(tx1 - tx0) * uil_clampi(percent, 0, 100) / 100.0 + 0.5);
              hx = uil_clampi(hx, tx0, tx1);
              if (hx > tx0)
                  fill_round_a(buf, W, H, tx0, ty, hx - tx0, SL_TRACK_H, SL_TRACK_H / 2,
                               0, 220, 235, 255);

              /* 手柄（带阴影） */
              fill_circle_a(buf, W, H, hx + 1, SL_CY + 2, SL_HANDLE_R, 0, 0, 0, 110);
              fill_circle_a(buf, W, H, hx, SL_CY, SL_HANDLE_R, 245, 248, 252, 255);
              fill_circle_a(buf, W, H, hx, SL_CY, SL_HANDLE_R - 5, 0, 220, 235,
                            dragging ? 255 : 150);

              /* 刻度 */
              for (i = 0; i <= 4; i++) {
                  int x = tx0 + (int)((double)(tx1 - tx0) * i / 4.0 + 0.5);
                  fill_rect_a(buf, W, H, x - 1, SL_CY + 17, 2, 4, 255, 255, 255, 60);
                  txt_c(buf, W, H, 10.0f, x, SL_CY + 24, ticks[i], 120, 128, 142);
              }

              /* 背光不可用时给出明确提示，避免用户以为坏了 */
              if (!g_bl_avail)
                  txt_c(buf, W, H, 12.0f, W / 2, 88, "未找到背光设备，调节无效",
                        255, 170, 90);
          }

          /* 第 4 页：设备 / 重启（拖动滑条到最右触发） */
          static void render_device_page(uint8_t *buf, int W, int H,
                                        int permille, int dragging) {
              int x0 = RB_X0, y0 = RB_Y0, w = RB_X1 - RB_X0, h = RB_H;
              int travel = w - 2 * RB_PAD - RB_HANDLE_W;
              int hxp, armed, k;

              permille = uil_clampi(permille, 0, 1000);
              armed = uil_reboot_armed(permille, REBOOT_TRIGGER);

              page_chrome(buf, W, H, "设备", PAGE_DEVICE, "上下滑动翻页");
              if (!g_font_ok) return;

              txt_c(buf, W, H, 12.0f, W / 2, 48, "重启会中断当前所有网络连接",
                    140, 148, 162);

              /* 轨道 */
              fill_round_a(buf, W, H, x0, y0, w, h, h / 2, 44, 48, 58, 255);

              hxp = x0 + RB_PAD + (int)((double)travel * permille / 1000.0 + 0.5);
              hxp = uil_clampi(hxp, x0 + RB_PAD, x0 + RB_PAD + travel);

              /* 已拖过的部分 */
              if (hxp > x0 + RB_PAD) {
                  if (armed)
                      fill_round_a(buf, W, H, x0 + RB_PAD, y0 + RB_PAD,
                                   hxp + RB_HANDLE_W - (x0 + RB_PAD), h - 2 * RB_PAD,
                                   (h - 2 * RB_PAD) / 2, 198, 44, 44, 255);
                  else
                      fill_round_a(buf, W, H, x0 + RB_PAD, y0 + RB_PAD,
                                   hxp + RB_HANDLE_W - (x0 + RB_PAD), h - 2 * RB_PAD,
                                   (h - 2 * RB_PAD) / 2, 96, 104, 120, 255);
              }

              /* 手柄 + 三个箭头 */
              fill_round_a(buf, W, H, hxp, y0 + RB_PAD, RB_HANDLE_W, h - 2 * RB_PAD,
                           (h - 2 * RB_PAD) / 2, 235, 240, 248, 255);
              for (k = 0; k < 3; k++) {
                  int ax = hxp + 6 + k * 6;
                  int cy = y0 + h / 2;
                  int cr = armed ? 90 : 120;
                  int cg = armed ? 40 : 128;
                  int cb = armed ? 40 : 140;
                  fill_tri_a(buf, W, H, ax, cy - 5, ax + 5, cy, ax, cy + 5,
                             cr, cg, cb, 255);
              }

              /* 文案 */
              if (!dragging && permille <= 0) {
                  txt_c(buf, W, H, 13.0f, (x0 + RB_PAD + RB_HANDLE_W + RB_X1 - RB_PAD) / 2,
                        y0 + h / 2 - 8, "按住滑块拖到最右以重启设备", 168, 176, 190);
              } else if (armed) {
                  txt_c(buf, W, H, 14.0f, W / 2, y0 + h + 14, "松手立即重启",
                        255, 120, 110);
              } else {
                  char ptxt[32];
                  snprintf(ptxt, sizeof(ptxt), "松开取消 · 已拖动 %d%%", permille / 10);
                  txt_c(buf, W, H, 13.0f, W / 2, y0 + h + 14, ptxt, 210, 216, 226);
              }
          }

