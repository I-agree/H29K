name: H29K bluez-alsa 专项诊断

# v4：只做 bluez-alsa 诊断，不出固件、不提 Kconfig。
#     上一版证明了裸树直接编单包会死在 host 工具缺失（staging_dir/host/bin/sed 不存在，
#     package/utils/lua [host] Error 127），所以这里显式先把 host 工具 + 交叉工具链建好
#     （make toolchain/install，它会带上 tools 阶段），再对 bluez-alsa 做命令级诊断。
#
# 顺序：环境 → ⓿ Makefile 来源核对 → 工具链 → 前置校验
#       → ① 依赖预热(首轮 -j) → ② 串行 -j1 V=s → ③ 缺 shared 因果基线
#       → ④ 5 轮 -j 压测 → ⑤ 取证 → ⑥ 汇总
# 诊断步骤一律 set +e 且 exit 0，互不阻断。

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: rk3528-hinlink-h29k.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  WORK_DIR: /workdir
  DIAG_DIR: /tmp/h29k-diag

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read

    steps:
    - name: 检出源码
      uses: actions/checkout@v7.0.1

    - name: 调整磁盘空间
      run: |
        sudo mkdir -p $WORK_DIR
        sudo chown -R $USER:$USER $WORK_DIR

        echo "⚙️ 正在物理重构编译机 Swap 交换分区技术栈..."
        sudo swapoff -a || true
        sudo dd if=/dev/zero of=/swapfile bs=1M count=5120
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=10
        echo "✅ Swap 扩容至 5GB 且 swappiness=10 校准完毕！"

        echo "📊 扩容系统全局 /tmp 至 10G"
        sudo umount /tmp || true
        sudo mount -t tmpfs tmpfs /tmp -o size=10G,nr_inodes=0
        echo "✅ /tmp 扩容至 10GB 完成"

        echo "📊 检查当前磁盘空间分布："
        df -h
        df -i /tmp
        echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
        mkdir -p "$DIAG_DIR"

    - name: 初始化构建环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update
        sudo apt install bzip2 g++ gawk gcc git glibc-source libncurses-dev python3-dev python3-setuptools python3-pyelftools make
        sudo timedatectl set-timezone "$TZ"

    - name: 查看编译环境硬件规格 (CPU/内存)
      run: |
        echo "==================== CPU 核心数 ===================="
        echo "逻辑核心数: $(nproc)"
        grep name /proc/cpuinfo | cut -f2 -d: | uniq -c
        echo -e "\n==================== 内存大小 ===================="
        free -h
        echo -e "\n==================== 构建工具版本 ===================="
        {
          echo "--- gcc ---";        gcc --version | head -1
          echo "--- make ---";       make --version | head -1
          echo "--- autoconf ---";   autoconf --version | head -1
          echo "--- automake ---";   automake --version | head -1
          echo "--- libtoolize ---"; libtoolize --version | head -1
          echo "--- pkg-config ---"; pkg-config --version
        } | tee "$DIAG_DIR/00-tools.txt"

    - name: 克隆 OpenWrt 源码到磁盘
      run: |
        cd $WORK_DIR
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf $WORK_DIR/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义软件源
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF ${{ env.WORK_DIR }}/openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd ${{ env.WORK_DIR }}/openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: ⓿ 核对 CI 实际使用的 bluez-alsa Makefile（raw 下载 vs 仓库 checkout）
      run: |
        set +e
        R="$GITHUB_WORKSPACE/package/bluez-alsa/Makefile"
        D="$WORK_DIR/openwrt/package/bluez-alsa/Makefile"
        OUT="$DIAG_DIR/00-makefile-source.txt"
        {
          echo "===== bluez-alsa Makefile 来源核对 ====="
          echo "仓库 checkout 版: $R"
          sha256sum "$R" 2>/dev/null
          ls -l "$R" 2>/dev/null
          echo
          echo "diy-part1 用 raw 下载覆盖后的实际版本（CI 真正编的）: $D"
          sha256sum "$D" 2>/dev/null
          ls -l "$D" 2>/dev/null
          echo
          if diff -q "$R" "$D" >/dev/null 2>&1; then
            echo "✅ 两版一致：CI 编的就是仓库里这一版"
          else
            echo "❌ 不一致：CI 编的是 raw.githubusercontent 上的版本（很可能是 CDN 缓存里的旧版）"
            echo "--- diff（仓库版 -> 实际使用版）---"
            diff -u "$R" "$D" | head -80
          fi
          echo
          echo "--- 实际生效版本里的关键行 ---"
          grep -nE "PKG_BUILD_PARALLEL|PKG_SOURCE_VERSION|PKG_RELEASE|PKG_FIXUP" "$D" 2>/dev/null
        } 2>&1 | tee "$OUT"
        exit 0

    - name: 更新软件源索引
      run: cd ${{ env.WORK_DIR }}/openwrt && ./scripts/feeds update -a

    - name: 安装软件源组件
      run: cd ${{ env.WORK_DIR }}/openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置文件
      run: |
        if [ -d files ]; then
          mkdir -p ${{ env.WORK_DIR }}/openwrt/files
          cp -r files/* ${{ env.WORK_DIR }}/openwrt/files/
        fi
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE ${{ env.WORK_DIR }}/openwrt/.config
        chmod +x $DIY_P2_SH
        cd ${{ env.WORK_DIR }}/openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载依赖软件
      run: |
        cd ${{ env.WORK_DIR }}/openwrt
        make defconfig
        for i in {1..3}; do make download -j8 && break || sleep 5; done
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "--- .config 里 bluez-alsa 是否选中 ---"
        grep -n "^CONFIG_PACKAGE_bluez-alsa" .config || echo "⚠️ .config 未选中 bluez-alsa"

    - name: Ⓐ 构建 host 工具 + 交叉工具链（只建诊断所需，不编固件）
      id: toolchain
      run: |
        cd ${{ env.WORK_DIR }}/openwrt
        set -o pipefail
        set +e
        start=$(date +%s)
        make -j$(nproc) toolchain/install 2>&1 | tee "$DIAG_DIR/0A-toolchain.log"
        rc=${PIPESTATUS[0]}
        echo "$rc" > "$DIAG_DIR/0A-toolchain.exit"
        echo "toolchain/install exit=$rc 用时=$(( $(date +%s) - start ))s"
        exit 0

    - name: Ⓑ 前置校验（host 工具 / 交叉工具链）
      run: |
        set +e
        cd ${{ env.WORK_DIR }}/openwrt
        OUT="$DIAG_DIR/0B-prereq.log"
        probes() {
          echo "host sed:            $(ls -l staging_dir/host/bin/sed 2>/dev/null || echo '❌ 缺失')"
          echo "host openssl:        $(ls -l staging_dir/host/bin/openssl 2>/dev/null || echo '❌ 缺失')"
          echo "host gcc:            $(ls -l staging_dir/host/bin/gcc 2>/dev/null || echo '❌ 缺失')"
          echo "host libdeflate-gzip: $(ls -l staging_dir/host/bin/libdeflate-gzip 2>/dev/null || echo '❌ 缺失')"
          echo "toolchain:           $(ls -d staging_dir/toolchain-* 2>/dev/null || echo '❌ 缺失')"
        }
        probes | tee "$OUT"
        if [ ! -x staging_dir/host/bin/sed ]; then
          echo "⚠️ host 工具缺失，补建 tools/install" | tee -a "$OUT"
          make -j$(nproc) tools/install 2>&1 | tail -40 | tee -a "$OUT" || true
          probes | tee -a "$OUT"
        fi
        exit 0

    - name: ① 依赖预热 + 首轮 -j$(nproc) 包编译（真实并行场景，含依赖库）
      run: |
        set +e
        cd ${{ env.WORK_DIR }}/openwrt
        echo "===== 首轮: make -j$(nproc) package/bluez-alsa/compile V=s =====" | tee "$DIAG_DIR/01-warmup.log"
        start=$(date +%s)
        /usr/bin/time -f "⏱ 耗时 %E  峰值内存 %M KB" \
          make -j$(nproc) package/bluez-alsa/compile V=s 2>&1 | tee -a "$DIAG_DIR/01-warmup.log"
        rc=${PIPESTATUS[0]}
        echo "$rc" > "$DIAG_DIR/01-warmup.exit"
        echo "===== EXIT=$rc 用时=$(( $(date +%s) - start ))s =====" | tee -a "$DIAG_DIR/01-warmup.log"
        so=$(ls build_dir/target-*/bluez-alsa-*/src/asound/.libs/*.so 2>/dev/null | wc -l)
        echo "src/asound/.libs 里的 .so 数量: $so" | tee -a "$DIAG_DIR/01-warmup.log"
        exit 0

    - name: ② 串行完整编译（-j1 V=s，纯包内命令级日志）
      run: |
        set +e
        cd ${{ env.WORK_DIR }}/openwrt
        make package/bluez-alsa/clean > "$DIAG_DIR/02-clean.log" 2>&1
        echo "===== make -j1 package/bluez-alsa/compile V=s =====" | tee "$DIAG_DIR/02-serial.log"
        start=$(date +%s)
        /usr/bin/time -f "⏱ 耗时 %E  峰值内存 %M KB" \
          make -j1 package/bluez-alsa/compile V=s 2>&1 | tee -a "$DIAG_DIR/02-serial.log"
        rc=${PIPESTATUS[0]}
        echo "$rc" > "$DIAG_DIR/02-serial.exit"
        echo "===== EXIT=$rc 用时=$(( $(date +%s) - start ))s =====" | tee -a "$DIAG_DIR/02-serial.log"
        PKGDIR=$(ls -d build_dir/target-*/bluez-alsa-*/ 2>/dev/null | head -1)
        echo "PKGDIR=$PKGDIR" | tee -a "$DIAG_DIR/02-serial.log"
        so=$(ls build_dir/target-*/bluez-alsa-*/src/asound/.libs/*.so 2>/dev/null | wc -l)
        echo "src/asound/.libs 里的 .so 数量: $so" | tee -a "$DIAG_DIR/02-serial.log"
        exit 0

    - name: ③ 因果基线：删掉 shared 产物后单编 src/asound（验证「缺 shared 会不会静默」）
      run: |
        set +e
        cd ${{ env.WORK_DIR }}/openwrt
        PKGDIR=$(ls -d build_dir/target-*/bluez-alsa-*/ 2>/dev/null | head -1)
        echo "构建目录: $PKGDIR" | tee "$DIAG_DIR/03-causal.log"
        if [ -n "$PKGDIR" ] && [ -f "$PKGDIR/src/asound/Makefile" ]; then
          cp -a "$PKGDIR/src/shared/libshared.la" "$DIAG_DIR/03-libshared.la.bak" 2>/dev/null
          rm -f "$PKGDIR/src/shared/libshared.la" "$PKGDIR/src/shared/.libs/libshared.la"
          echo "已删除 src/shared 的 libshared.la，现在单独编 src/asound：" | tee -a "$DIAG_DIR/03-causal.log"
          make -C "$PKGDIR/src/asound" V=1 2>&1 | tee -a "$DIAG_DIR/03-causal.log"
          rc2=${PIPESTATUS[0]}
          echo "EXIT(asound-only)=$rc2  （预期 2，且报 No rule to make target '../shared/libshared.la'）" | tee -a "$DIAG_DIR/03-causal.log"
          cp -a "$DIAG_DIR/03-libshared.la.bak" "$PKGDIR/src/shared/libshared.la" 2>/dev/null
        else
          echo "src/asound/Makefile 不存在（② 里 configure 未成功），跳过因果基线" | tee -a "$DIAG_DIR/03-causal.log"
        fi
        exit 0

    - name: ④ -j$(nproc) 并行压测 5 轮（逐轮记录 exit / 耗时 / .so 数量）
      run: |
        set +e
        cd ${{ env.WORK_DIR }}/openwrt
        : > "$DIAG_DIR/04-matrix.txt"
        echo "| 轮次 | exit | 用时 | asound .so | 首个报错 |" >> "$DIAG_DIR/04-matrix.txt"
        echo "|---|---|---|---|---|" >> "$DIAG_DIR/04-matrix.txt"
        for i in 1 2 3 4 5; do
          make package/bluez-alsa/clean > /dev/null 2>&1
          start=$(date +%s)
          make -j$(nproc) package/bluez-alsa/compile V=s > "$DIAG_DIR/04-round$i.log" 2>&1
          rc=$?
          dur=$(( $(date +%s) - start ))
          so=$(ls build_dir/target-*/bluez-alsa-*/src/asound/.libs/*.so 2>/dev/null | wc -l)
          first=$(grep -iE "error:|No rule to make target|cannot stat|cannot find|Error [0-9]" "$DIAG_DIR/04-round$i.log" | head -1 | tr '|' ' ' | cut -c1-120)
          echo "| $i | $rc | ${dur}s | $so | ${first:-无} |" >> "$DIAG_DIR/04-matrix.txt"
          echo "round $i: exit=$rc 用时=${dur}s asound_so=$so 首个报错=${first:-无}"
          if [ $rc -ne 0 ]; then
            grep -nE -B2 -A6 "error:|Error [0-9]|No rule to make target" "$DIAG_DIR/04-round$i.log" | tail -60 >> "$DIAG_DIR/04-matrix.txt"
          fi
        done
        exit 0

    - name: ⑤ 深度取证（源码树 / configure 产物 / staging / 头文件 / 并行度）
      if: always()
      run: |
        set +e
        cd ${{ env.WORK_DIR }}/openwrt
        PKGDIR=$(ls -d build_dir/target-*/bluez-alsa-*/ 2>/dev/null | head -1)
        STAGING=$(ls -d staging_dir/target-*/ 2>/dev/null | head -1)
        TOOLCHAIN=$(ls -d staging_dir/toolchain-*/ 2>/dev/null | head -1)
        OUT="$DIAG_DIR/05-evidence.log"
        : > "$OUT"
        section() { echo -e "\n===== $* ====="; }

        section "A. 包元信息与源码版本"
        {
          echo "PKGDIR=$PKGDIR"
          echo "STAGING=$STAGING"
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "--- .config 里的 bluez-alsa ---"
          grep -n "^CONFIG_PACKAGE_bluez-alsa" .config || echo "(未选中)"
          echo "--- Makefile 关键行 ---"
          grep -nE "PKG_BUILD_PARALLEL|PKG_FIXUP|PKG_SOURCE_VERSION|PKG_BUILD_DEPENDS|PKG_RELEASE" package/bluez-alsa/Makefile
          if [ -d "$PKGDIR/.git" ]; then
            echo "--- 源码树 git ---"
            git -C "$PKGDIR" rev-parse HEAD 2>/dev/null
            git -C "$PKGDIR" status --short 2>/dev/null | head -5
          fi
        } 2>&1 | tee -a "$OUT"

        section "B. configure 阶段证据（config.log）"
        if [ -f "$PKGDIR/config.log" ]; then
          echo "--- unrecognized / warning ---"
          grep -nE "unrecognized|warning: unrecognized|invalid|not supported" "$PKGDIR/config.log" | head -30
          echo "--- 关键依赖探测结论 ---"
          grep -E "checking for (alsa|bluez|sbc|glib|dbus|libgio)" "$PKGDIR/config.log" | tail -20
          echo "--- config.log 尾 40 行 ---"
          tail -40 "$PKGDIR/config.log"
        else
          echo "（config.log 不存在：② 连 configure 都没跑到，先看 02-serial.log 前 40 行）"
        fi 2>&1 | tee -a "$OUT"

        section "C. 构建图（automake 的 all / SUBDIRS）"
        if [ -f "$PKGDIR/src/Makefile" ]; then
          grep -nE "^all:|^all-am:|^SUBDIRS|^am__recursive" "$PKGDIR/src/Makefile" | head -20
          echo "--- libbluealsad 对 shared 的依赖 ---"
          grep -nE "libbluealsad_la_DEPENDENCIES|libbluealsad_la_LIBADD|shared/libshared.la" "$PKGDIR/src/Makefile" | head -10
          echo "--- asound 插件单元 ---"
          grep -nE "asound_module_(pcm|ctl)_LTLIBRARIES|AM_LDFLAGS|LIBADD" "$PKGDIR/src/asound/Makefile" | head -10
        else
          echo "（src/Makefile 不存在，configure 未完成或未执行 autoreconf）"
        fi 2>&1 | tee -a "$OUT"

        section "D. 构建目录实际状态"
        for d in src src/shared src/asound src/dbus src/bluealsactl src/dumper; do
          echo "--- $PKGDIR/$d ---"
          ls -la "$PKGDIR/$d" 2>/dev/null | head -12
          if [ -d "$PKGDIR/$d/.libs" ]; then
            echo "  .libs:"; ls -la "$PKGDIR/$d/.libs" 2>/dev/null | head -20
          fi
        done 2>&1 | tee -a "$OUT"

        section "E. 全树产物搜索与架构校验"
        echo "--- asound_module ---"; find "$PKGDIR" -name '*asound_module*' 2>/dev/null | head -20
        echo "--- bluealsad / bluealsactl ---"; find "$PKGDIR" \( -name 'bluealsad' -o -name 'bluealsactl' \) -type f 2>/dev/null | head
        echo "--- 20-bluealsa.conf ---"; find "$PKGDIR" -name '20-bluealsa.conf' 2>/dev/null | head
        echo "--- org.bluealsa.conf ---"; find "$PKGDIR" -name 'org.bluealsa.conf' 2>/dev/null | head
        echo "--- 目标架构（应为 aarch64）---"
        find "$PKGDIR" -type f \( -name '*.so' -o -name 'bluealsad' -o -name 'bluealsactl' \) 2>/dev/null | head -3 | while read f; do
          file "$f" 2>/dev/null
        done 2>&1 | tee -a "$OUT"

        section "F. staging 里依赖库与头文件"
        {
          echo "--- pkgconfig ---"
          ls "$STAGING/usr/lib/pkgconfig" 2>/dev/null | grep -iE "^(alsa|bluez|sbc|glib|dbus|gio)"
          echo "--- 库文件 ---"
          ls -la "$STAGING"/usr/lib/libasound* "$STAGING"/usr/lib/libsbc* "$STAGING"/usr/lib/libbluetooth* "$STAGING"/usr/lib/libdbus* 2>/dev/null | head -20
          echo "--- 头文件目录 ---"
          ls -d "$STAGING"/usr/include/alsa "$STAGING"/usr/include/glib-2.0 "$STAGING"/usr/include/bluetooth "$STAGING"/usr/include/sbc 2>/dev/null
          echo "--- 交叉工具链 ---"
          ls "$TOOLCHAIN"/bin 2>/dev/null | head -5
          "$TOOLCHAIN"/bin/*-gcc --version 2>/dev/null | head -1
        } 2>&1 | tee -a "$OUT"

        section "G. 包内并行度验证（PKG_BUILD_PARALLEL 是否生效）"
        echo "--- 串行日志里内层 make 的 -j 参数（应为 -j1） ---"
        grep -oE "make -C .*bluez-alsa[^ ]* .*-j[0-9]+" "$DIAG_DIR/02-serial.log" 2>/dev/null | head -6
        echo "--- 并行轮日志里内层 make 的 -j 参数 ---"
        grep -oE "make -C .*bluez-alsa[^ ]* .*-j[0-9]+" "$DIAG_DIR/04-round5.log" 2>/dev/null | head -6

        section "H. 日志尾部"
        echo "--- 02-serial.log 尾 60 行 ---"; tail -60 "$DIAG_DIR/02-serial.log" 2>/dev/null
        echo "--- 01-warmup.log 尾 40 行 ---"; tail -40 "$DIAG_DIR/01-warmup.log" 2>/dev/null
        echo "--- 04-round5.log 尾 60 行 ---"; tail -60 "$DIAG_DIR/04-round5.log" 2>/dev/null
        echo "--- 压测矩阵 ---"; cat "$DIAG_DIR/04-matrix.txt" 2>/dev/null
        exit 0

    - name: ⑥ 诊断汇总（写入 Step Summary）
      if: always()
      run: |
        set +e
        {
          echo "## bluez-alsa 诊断汇总（只诊断，不产固件）"
          echo
          echo "| 项目 | 值 |"
          echo "|---|---|"
          echo "| ⓿ Makefile 来源（raw vs 仓库） | $(grep -q '两版一致' $DIAG_DIR/00-makefile-source.txt 2>/dev/null && echo '一致' || echo '不一致 / 见 00-makefile-source.txt') |"
          echo "| Ⓐ toolchain/install | exit=$(cat $DIAG_DIR/0A-toolchain.exit 2>/dev/null) |"
          echo "| ① 首轮 -j$(nproc) | exit=$(cat $DIAG_DIR/01-warmup.exit 2>/dev/null) |"
          echo "| ② 串行 -j1 V=s | exit=$(cat $DIAG_DIR/02-serial.exit 2>/dev/null) |"
          echo "| ③ 缺 shared 单编 asound | 见 03-causal.log |"
          echo
          echo "### 前置校验"
          echo '```'
          cat "$DIAG_DIR/0B-prereq.log" 2>/dev/null | cut -c1-200
          echo '```'
          echo
          echo "### ④ 并行压测矩阵（-j$(nproc)）"
          echo
          cat "$DIAG_DIR/04-matrix.txt" 2>/dev/null || echo "(无)"
          echo
          echo "### ② 串行编译尾部 30 行"
          echo '```'
          tail -30 "$DIAG_DIR/02-serial.log" 2>/dev/null
          echo '```'
          echo
          echo "### ① 首轮尾部 20 行"
          echo '```'
          tail -20 "$DIAG_DIR/01-warmup.log" 2>/dev/null
          echo '```'
        } >> $GITHUB_STEP_SUMMARY
        echo "=========================================="
        echo "toolchain exit: $(cat $DIAG_DIR/0A-toolchain.exit 2>/dev/null)"
        echo "首轮 -j exit: $(cat $DIAG_DIR/01-warmup.exit 2>/dev/null)"
        echo "串行 -j1 exit: $(cat $DIAG_DIR/02-serial.exit 2>/dev/null)"
        echo "④ 压测矩阵:"; cat "$DIAG_DIR/04-matrix.txt" 2>/dev/null
        exit 0

    - name: 上传诊断证据包
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: bluez-alsa-diag-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          ${{ env.DIAG_DIR }}/
        retention-days: 7
#（注：内容由AI生成）
