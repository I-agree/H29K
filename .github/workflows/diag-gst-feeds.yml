name: 诊断 gmediarender 依赖与 feeds

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  CONFIG_FILE: rk3528-hinlink-h29k.config
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai
  WORK_DIR: /workdir

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 调整磁盘空间
      run: |
        sudo mkdir -p $WORK_DIR
        sudo chown -R $USER:$USER $WORK_DIR
        sudo swapoff -a || true
        sudo dd if=/dev/zero of=/swapfile bs=1M count=5120
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=10
        sudo umount /tmp || true
        sudo mount -t tmpfs tmpfs /tmp -o size=10G,nr_inodes=0
        df -h
        echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV

    - name: 初始化构建环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev python3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf quilt python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd libyaml-dev zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆 OpenWrt 源码到磁盘
      run: |
        cd $WORK_DIR
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf $WORK_DIR/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 全流程诊断
      run: |
        set -uo pipefail
        LOG="$WORK_DIR/diag.log"
        exec > >(tee -a "$LOG") 2>&1
        cd $WORK_DIR/openwrt

        echo "######## 0. 上游自带的 feeds.conf.default ########"
        cat feeds.conf.default

        echo "######## 1. 运行 diy-part1.sh（只做下载与目录准备）########"
        chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
        $GITHUB_WORKSPACE/$DIY_P1_SH; echo "part1 exit=$?"

        if [ ! -f package/multimedia/gmediarender/Makefile ]; then
          echo "⚠️ part1 未产出 gmediarender 包，用仓库内副本兜底"
          cp -rf $GITHUB_WORKSPACE/package/. package/
        fi
        ls -l package/multimedia/gmediarender/Makefile 2>&1

        echo "######## 2. feeds update -a ########"
        ./scripts/feeds update -a; echo "update exit=$?"

        echo "######## 3. feeds install -a ########"
        ./scripts/feeds install -a; echo "install exit=$?"

        echo "######## 4. install 落地核对 ########"
        echo "--- feeds/ ---"; ls -d feeds/*/ 2>/dev/null
        echo "--- package/feeds/ ---"; ls package/feeds/ 2>/dev/null
        echo "--- 关键包是否已安装（走符号链接）---"
        for p in gst1-plugins-base gst1-plugins-bad gst1-plugins-good gst1-libav gstreamer1 libupnp glib2 libdrm ffmpeg; do
          if ls -d package/feeds/packages/*/"$p" >/dev/null 2>&1; then
            echo "ok   $p"
          else
            echo "FAIL $p 未安装"
          fi
        done
        echo "--- 已安装 Makefile 数量 ---"
        echo "package/feeds/packages: $(find -L package/feeds/packages -name Makefile 2>/dev/null | wc -l)"
        echo "feeds/packages 源:      $(find -L feeds/packages -mindepth 3 -maxdepth 3 -name Makefile 2>/dev/null | wc -l)"
        echo "--- gst1 系列已安装目录 ---"
        find -L package/feeds/packages -maxdepth 2 -type d -name "gst1*" 2>/dev/null | sort

        echo "######## 5. 载入自定义配置 ########"
        cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
        grep -nE "CONFIG_TARGET_BOARD|CONFIG_TARGET_SUBTARGET|gmediarender|gstreamer1" .config | head -10

        echo "######## 6. defconfig 第一遍（按你现在的流程，不清缓存）########"
        make defconfig > /tmp/def1.txt 2>&1; echo "defconfig1 exit=$?"
        echo "警告行数: $(grep -c 'does not exist' /tmp/def1.txt || true)"
        grep 'does not exist' /tmp/def1.txt | head -6 || true
        echo "gst1-mod 包数: $(grep -c '^Package: gst1-mod' tmp/.packageinfo 2>/dev/null || echo 0)"
        echo "Package 总条数: $(grep -c '^Package: ' tmp/.packageinfo 2>/dev/null || echo 0)"
        grep -n '^Package: libupnp$' tmp/.packageinfo | head -2 || echo "libupnp 不在元数据"
        grep -n '^Package: gst1-mod-v4l2codecs$' tmp/.packageinfo | head -2 || echo "gst1-mod-v4l2codecs 不在元数据"
        echo "--- .config 相关行 ---"
        grep -nE "gmediarender|gst1-mod-kms|gst1-mod-v4l2codecs|gstreamer1-utils|libupnp" .config || echo "（无相关行）"
        cp .config /tmp/config1

        echo "######## 7. defconfig 第二遍（先清 tmp 缓存）########"
        rm -rf tmp
        make defconfig > /tmp/def2.txt 2>&1; echo "defconfig2 exit=$?"
        echo "警告行数: $(grep -c 'does not exist' /tmp/def2.txt || true)"
        echo "gst1-mod 包数: $(grep -c '^Package: gst1-mod' tmp/.packageinfo 2>/dev/null || echo 0)"
        echo "Package 总条数: $(grep -c '^Package: ' tmp/.packageinfo 2>/dev/null || echo 0)"
        echo "--- .config 相关行 ---"
        grep -nE "gmediarender|gst1-mod-kms|gst1-mod-v4l2codecs|gstreamer1-utils|libupnp|gst1-libav" .config || echo "（无相关行）"
        echo "--- 两遍 .config 差异（前 30 行）---"
        diff /tmp/config1 .config | head -30 || true

        echo "######## 8. 时间戳（元数据 vs 符号链接）########"
        stat -c '%y  %n' tmp/.packageinfo tmp/.packagedeps 2>/dev/null
        stat -c '%y  %n' package/feeds/packages 2>/dev/null

        echo "######## 9. kmssink 补丁干跑 ########"
        P=$GITHUB_WORKSPACE/package/multimedia/gmediarender/extras/0001-gst1-plugins-bad-enable-kmssink.patch
        if [ -f "$P" ]; then
          cd feeds/packages
          patch -p1 --dry-run < "$P"; echo "dryrun exit=$?"
          cd $WORK_DIR/openwrt
        else
          echo "补丁文件不存在"
        fi

        echo "######## 诊断结束 ########"

    - name: 输出摘要
      if: always()
      run: |
        LOG="$WORK_DIR/diag.log"
        [ -f "$LOG" ] || { echo "没有生成日志"; exit 0; }
        {
          echo "## 诊断摘要"
          echo
          echo "### 1) install 落地核对"
          echo '```'
          sed -n '/4. install 落地核对/,/5. 载入自定义配置/p' "$LOG" | grep -E "^(ok|FAIL)|package/feeds/packages:|feeds/packages 源:"
          echo '```'
          echo
          echo "### 2) 第一遍 defconfig"
          echo '```'
          sed -n '/6. defconfig 第一遍/,/7. defconfig 第二遍/p' "$LOG" | grep -E "defconfig1 exit|警告行数|gst1-mod 包数|Package 总条数|Package: |gmediarender|gst1-mod-|gstreamer1-utils|libupnp|无相关行"
          echo '```'
          echo
          echo "### 3) 第二遍 defconfig（清缓存后）"
          echo '```'
          sed -n '/7. defconfig 第二遍/,$p' "$LOG" | grep -E "defconfig2 exit|警告行数|gst1-mod 包数|Package 总条数|gmediarender|gst1-mod-|gstreamer1-utils|libupnp|无相关行|^[+-]CONFIG_PACKAGE"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 上传日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diag-gst-feeds
        path: |
          /workdir/diag.log
          /tmp/def1.txt
          /tmp/def2.txt
        if-no-files-found: warn
        retention-days: 14
#（注：内容由AI生成）
