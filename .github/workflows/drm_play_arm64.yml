name: （开机动画）+ 触摸页

on:
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # --- 1. 转换 MP4 为 RAW (XRGB8888) ---
      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xxd

      - name: Download MP4
        run: |
          curl -L -o apple.mp4 "https://raw.githubusercontent.com/I-agree/H29K/main/JPG/apple.mp4"

      - name: Convert MP4 to RAW (XRGB8888, 172x172)
        run: |
          ffmpeg -i apple.mp4 -f rawvideo -pix_fmt bgr0 apple.raw
          ls -lh apple.raw

      - name: Embed RAW into C header
        run: |
          xxd -i apple.raw > apple_raw.h
          head -2 apple_raw.h

      # --- 2. 下载 stb 单文件库 ---
      - name: Download stb libraries
        run: |
          curl -L -o stb_image.h "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h"
          curl -L -o stb_truetype.h "https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h"
          curl -L -o stb_image_resize2.h "https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize2.h"
          ls -lh stb_*.h

      # --- 3. 交叉编译 ARM64 DRM 播放程序 ---
      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Setup ARM64 libdrm (Sysroot Method)
        run: |
          sudo dpkg --add-architecture arm64
          UBUNTU_CODENAME=$(lsb_release -cs)
          echo "deb [arch=arm64 trusted=yes] http://ports.ubuntu.com/ubuntu-ports $UBUNTU_CODENAME main" | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list
          sudo apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/ubuntu-ports-arm64.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          
          mkdir -p /tmp/arm64-sysroot
          cd /tmp/arm64-sysroot
          apt-get download libdrm-dev:arm64 libdrm2:arm64 libdrm-common
          for deb in *.deb; do
            dpkg -x "$deb" .
          done

      - name: Create DRM Player C Source
        run: |
          cat << 'ENDOFSOURCE' > drm_play.c
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/ioctl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <sys/time.h>
          #include <poll.h>
          #include <dirent.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <errno.h>
          #include <signal.h>
          #include <math.h>
          #include <limits.h>
          #include <xf86drm.h>
          #include <xf86drmMode.h>
          #include <drm_fourcc.h>

          #define STB_IMAGE_IMPLEMENTATION
          #define STBI_ONLY_JPEG
          #define STBI_ONLY_PNG
          #include "stb_image.h"

          #define STB_TRUETYPE_IMPLEMENTATION
          #include "stb_truetype.h"

          #define STB_IMAGE_RESIZE_IMPLEMENTATION
          #include "stb_image_resize2.h"

          #include "apple_raw.h"

          #define VIDEO_W       172
          #define VIDEO_H       172
          #define BPP           32
          #define FPS           25
          #define DURATION      36
          #define SCREEN_W      320
          #define SCREEN_H      172
          #define FONT_PATH     "/usr/share/fonts/MiSans-Regular.ttf"
          #define FONT_SIZE     28.0f
          #define REFRESH_SEC   (15 * 60)   /* 第 1 页 15 分钟 */
          #define INFO_REFRESH_SEC  60      /* 第 2 页 60 秒 */
          #define HTTP_TIMEOUT  8
          #define MAX_CHARS_PER_LINE  15
          /* ★ 第 1 页文字颜色 (R, G, B) ★ */
          #define TEXT_R   0
          #define TEXT_G   255
          #define TEXT_B   255
          /* ★ 第 2 页字体大小 ★ */
          #define INFO_TITLE_SIZE  22.0f
          #define INFO_FONT_SIZE   19.0f
          #define HITOKOTO_URL  "https://v1.hitokoto.cn/?c=f&max_length=60"
          #define PICSUM_URL    "https://picsum.photos/320/172"
          #define HITOKOTO_CACHE "/tmp/.drm_hitokoto"
          #define BG_CACHE       "/tmp/.drm_bg_img"
          #define QMODEM_RUNDIR  "/var/run/qmodem"
          #define QMODEM_DBG     "/tmp/.qmodem_dbg_all"
          #define DRM_PLAY_LOG   "/tmp/drm_play.log"
          /* ★ 息屏相关（全黑画面模拟息屏）★ */
          #define CLIENT_CHECK_SEC  20       /* 每 20 秒统计一次客户端 */
          #define SCREEN_OFF_DELAY  60      /* 无设备持续 60 秒 → 显示全黑 */

          #define MY_EV_SYN   0x00
          #define MY_EV_KEY   0x01
          #define MY_EV_ABS   0x03
          #define MY_SYN_REPORT 0x00
          #define MY_ABS_X    0x00
          #define MY_ABS_Y    0x01
          #define MY_ABS_MT_POSITION_X  0x35
          #define MY_ABS_MT_POSITION_Y  0x36
          #define MY_ABS_MT_TRACKING_ID 0x39
          #define MY_BTN_TOUCH 0x14a
          #define MY_EV_MAX   0x1f
          #define MY_ABS_MAX  0x3f
          #define MY_KEY_MAX  0x2ff
          #define TEST_BIT(b,arr) ((arr)[(b)/8] & (1u << ((b)%8)))
          #define MY_IOC_NRBITS   8
          #define MY_IOC_TYPEBITS 8
          #define MY_IOC_SIZEBITS 14
          #define MY_IOC_DIRBITS  2
          #define MY_IOC_NRSHIFT   0
          #define MY_IOC_TYPESHIFT (MY_IOC_NRSHIFT + MY_IOC_NRBITS)
          #define MY_IOC_SIZESHIFT (MY_IOC_TYPESHIFT + MY_IOC_TYPEBITS)
          #define MY_IOC_DIRSHIFT  (MY_IOC_SIZESHIFT + MY_IOC_SIZEBITS)
          #define MY_IOC_READ 2U
          #define MY_IOC(dir,type,nr,size) \
              (((dir)  << MY_IOC_DIRSHIFT)  | ((type) << MY_IOC_TYPESHIFT) | \
               ((nr)   << MY_IOC_NRSHIFT)   | ((size) << MY_IOC_SIZESHIFT))
          #define MY_EVIOCGNAME(len) MY_IOC(MY_IOC_READ, 'E', 0x06, (len))
          #define MY_EVIOCGBIT(ev,len) MY_IOC(MY_IOC_READ, 'E', 0x20 + (ev), (len))
          struct my_absinfo { int value, minimum, maximum, fuzz, flat, resolution; };
          #define MY_EVIOCGABS(abs) MY_IOC(MY_IOC_READ, 'E', 0x40 + (abs), sizeof(struct my_absinfo))
          #define TOUCH_IDLE_MS  140

          struct my_input_event {
              struct timeval time;
              uint16_t type;
              uint16_t code;
              int32_t  value;
          };

          #define FALLBACK_COUNT 4
          static const char *FALLBACK_TEXTS[FALLBACK_COUNT] = {
              "山林不向四季起誓，荣枯随缘；\n"
              "海洋不需对沙滩承诺，遇合尽兴。",
              "喜欢就处，别问是朋友还是恋人！\n"
              "关系不是绳子，非要绑住谁的手脚。",
              "缘分就像山风，吹到哪儿都是风景。\n"
              "能走一段是礼物，能走一生是运气。",
              "被你改变的那部分我，\n"
              "代替了你永远陪在了我的身边。"
          };
          static int g_fallback_idx = 0;

          #define FIELD_COUNT 7
          typedef struct {
              const char *cands[16];
              char  value[96];
              int   filled;
          } field_t;

          static field_t g_fields[FIELD_COUNT] = {
              { {"connect_status","Connect Status","connection_status","connected",
                 "state","connect_state","link_state","连接状态",NULL}, {0}, 0 },
              { {"temperature","Temperature","temp","temperature_c","modem_temp",
                 "温度",NULL}, {0}, 0 },
              { {"SIM Status","sim_status","sim_state","simcard_status","sim",
                 "SIM卡状态","SIM状态",NULL}, {0}, 0 },
              { {"isp","ISP","operator","operator_name","service_provider","spn",
                 "carrier","carrier_name","provider","plmn_name",
                 "Internet Service Provider","运营商","互联网服务提供商",NULL}, {0}, 0 },
              /* ★ 刻意不含 "Network Type"/"network_type"：
                 避免 cache_network_info 的 "NR" 抢先占位，
                 只显示 cell_info 里更精确的 "NR5G-SA Mode" ★ */
              { {"network_mode","Network Mode","mode","rat",
                 "network","net_mode","网络模式",NULL}, {0}, 0 },
              { {"UL Bandwidth","ul_bandwidth","upload_bandwidth","ul","tx",
                 "uplink","upload","up_bandwidth","上行带宽",NULL}, {0}, 0 },
              { {"DL Bandwidth","dl_bandwidth","download_bandwidth","dl","rx",
                 "downlink","download","down_bandwidth","下行带宽",NULL}, {0}, 0 },
          };
          static char g_section[64] = {0};
          static char g_ubus_obj[32]    = {0};
          static char g_method_base[32] = {0};
          static char g_method_sim[32]  = {0};
          static char g_method_net[32]  = {0};

          static uint32_t screen_w, screen_h;
          static volatile sig_atomic_t g_running = 1;
          static int g_touch_thresh_x = 30;
          static int g_touch_thresh_y = 30;
          static uint8_t *g_page0_rgba = NULL;
          static uint8_t *g_page1_rgba = NULL;
          static pid_t g_fetch_pid = 0;
          static time_t g_last_fetch_try = 0;
          static drmModeCrtc *g_saved_crtc = NULL;

          typedef struct {
              int  in_contact;
              int  start_pending;
              int  have_last;
              int  start_x, start_y;
              int  last_x, last_y;
              long last_coord_us;
          } touch_state_t;
          static touch_state_t g_ts;

          void sig_handler(int sig) { (void)sig; g_running = 0; }

          void sleep_ms(int ms) {
              struct timespec ts = { .tv_sec = ms / 1000, .tv_nsec = (ms % 1000) * 1000000L };
              nanosleep(&ts, NULL);
          }

          static int utf8_decode(const char *s, int *codepoint) {
              uint8_t c = (uint8_t)s[0];
              if (c < 0x80) { *codepoint = c; return 1; }
              else if ((c & 0xE0) == 0xC0) {
                  *codepoint = c & 0x1F;
                  if (s[1]) *codepoint = (*codepoint << 6) | ((uint8_t)s[1] & 0x3F);
                  return 2;
              } else if ((c & 0xF0) == 0xE0) {
                  *codepoint = c & 0x0F;
                  if (s[1]) *codepoint = (*codepoint << 6) | ((uint8_t)s[1] & 0x3F);
                  if (s[2]) *codepoint = (*codepoint << 6) | ((uint8_t)s[2] & 0x3F);
                  return 3;
              } else if ((c & 0xF8) == 0xF0) {
                  *codepoint = c & 0x07;
                  if (s[1]) *codepoint = (*codepoint << 6) | ((uint8_t)s[1] & 0x3F);
                  if (s[2]) *codepoint = (*codepoint << 6) | ((uint8_t)s[2] & 0x3F);
                  if (s[3]) *codepoint = (*codepoint << 6) | ((uint8_t)s[3] & 0x3F);
                  return 4;
              }
              *codepoint = c;
              return 1;
          }

          static void wrap_text(const char *src, char *dst, size_t dst_size, int max_chars) {
              size_t di = 0;
              int char_count = 0;
              while (*src && di < dst_size - 2) {
                  if (*src == '\n') { dst[di++] = '\n'; char_count = 0; src++; continue; }
                  int codepoint;
                  int bytes = utf8_decode(src, &codepoint);
                  if (char_count >= max_chars) {
                      dst[di++] = '\n'; char_count = 0;
                      if (di >= dst_size - 2) break;
                  }
                  for (int b = 0; b < bytes && di < dst_size - 1; b++) dst[di++] = src[b];
                  char_count++;
                  src += bytes;
              }
              dst[di] = '\0';
          }

          static int ieq(const char *a, const char *b) {
              if (!a || !b) return 0;
              while (*a && *b) {
                  unsigned char x = (unsigned char)*a, y = (unsigned char)*b;
                  if (x >= 'A' && x <= 'Z') x += 32;
                  if (y >= 'A' && y <= 'Z') y += 32;
                  if (x != y) return 0;
                  a++; b++;
              }
              return *a == 0 && *b == 0;
          }

          static int field_match(const char *cand, const char *key, const char *full) {
              if (ieq(cand, key)) return 1;
              if (full && strcmp(cand, full) == 0) return 1;
              return 0;
          }

          static void sanitize_value(char *v) {
              size_t s = 0;
              while (v[s]==' '||v[s]=='\n'||v[s]=='\r'||v[s]=='\t') s++;
              if (s) memmove(v, v+s, strlen(v+s)+1);
              size_t len = strlen(v);
              while (len>0 && (v[len-1]==' '||v[len-1]=='\n'||v[len-1]=='\r'||v[len-1]=='\t'))
                  v[--len] = 0;
              for (char *p=v; *p; p++) if (*p=='\n'||*p=='\r') *p=' ';
              /* 固件乱码 "掳C" (E6 8E B3 43) → "°C" (C2 B0 43) */
              char *bad = strstr(v, "\xE6\x8E\xB3""C");
              if (bad) {
                  memmove(bad+2, bad+3, strlen(bad+3)+1);
                  bad[0] = '\xC2'; bad[1] = '\xB0';
              }
          }

          static void postprocess_fields(void) {
              if (g_fields[0].filled) {
                  if (ieq(g_fields[0].value, "yes") || ieq(g_fields[0].value, "connected"))
                      strcpy(g_fields[0].value, "已连接");
                  else if (ieq(g_fields[0].value, "no") || ieq(g_fields[0].value, "disconnected"))
                      strcpy(g_fields[0].value, "未连接");
              }
              if (g_fields[2].filled && ieq(g_fields[2].value, "ready"))
                  strcpy(g_fields[2].value, "就绪");
          }

          static int json_get_field(const char *json, const char *key,
                                    char *out, size_t out_size) {
              char pattern[128];
              snprintf(pattern, sizeof(pattern), "\"%s\"", key);
              const char *p = strstr(json, pattern);
              if (!p) return -1;
              p = strchr(p + strlen(pattern), ':');
              if (!p) return -1;
              p++;
              while (*p == ' ' || *p == '\t' || *p == '\n' || *p == '\r') p++;
              size_t i = 0;
              if (*p == '"') {
                  p++;
                  while (*p && *p != '"' && i < out_size - 1) {
                      if (*p == '\\' && *(p+1)) {
                          p++;
                          switch (*p) {
                              case 'n': out[i++] = '\n'; break;
                              case 't': out[i++] = '\t'; break;
                              case '"': out[i++] = '"'; break;
                              case '\\': out[i++] = '\\'; break;
                              default: out[i++] = *p; break;
                          }
                      } else out[i++] = *p;
                      p++;
                  }
              } else {
                  while (*p && *p != ',' && *p != '}' && *p != ']' &&
                         *p != '\n' && i < out_size - 1) out[i++] = *p++;
                  while (i > 0 && (out[i-1]==' '||out[i-1]=='\t'||out[i-1]=='\r')) i--;
              }
              out[i] = '\0';
              return (i > 0) ? 0 : -1;
          }

          static char *popen_read(const char *cmd) {
              FILE *fp = popen(cmd, "r");
              if (!fp) return NULL;
              size_t cap = 8192, len = 0;
              char *buf = malloc(cap);
              if (!buf) { pclose(fp); return NULL; }
              size_t n;
              while ((n = fread(buf + len, 1, cap - len - 1, fp)) > 0) {
                  len += n;
                  if (len >= cap - 1) {
                      cap *= 2;
                      char *t = realloc(buf, cap);
                      if (!t) { free(buf); pclose(fp); return NULL; }
                      buf = t;
                  }
              }
              pclose(fp);
              buf[len] = '\0';
              return buf;
          }

          /* ================================================================
           * ★ 客户端检测
           * ================================================================ */

          static int read_int_file(const char *path) {
              FILE *f = fopen(path, "r");
              if (!f) return -1;
              int v = -1;
              if (fscanf(f, "%d", &v) != 1) v = -1;
              fclose(f);
              return v;
          }

          static int read_str_file(const char *path, char *buf, size_t sz) {
              FILE *f = fopen(path, "r");
              if (!f) return -1;
              if (!fgets(buf, (int)sz, f)) { fclose(f); return -1; }
              fclose(f);
              size_t len = strlen(buf);
              while (len > 0 && (buf[len-1] == '\n' || buf[len-1] == '\r' || buf[len-1] == ' '))
                  buf[--len] = 0;
              return 0;
          }

          static int count_wired_clients(void) {
              int count = 0;

              /* 方法 1：直接检查 eth0 carrier */
              if (read_int_file("/sys/class/net/eth0/carrier") == 1) {
                  count++;
                  goto done;
              }

              /* 方法 2：检查 eth0 operstate */
              {
                  char state[32] = {0};
                  if (read_str_file("/sys/class/net/eth0/operstate", state, sizeof(state)) == 0) {
                      if (strcmp(state, "up") == 0) {
                          count++;
                          goto done;
                      }
                  }
              }

              /* 方法 3：检查 eth0 speed */
              {
                  int speed = read_int_file("/sys/class/net/eth0/speed");
                  if (speed > 0) {
                      count++;
                      goto done;
                  }
              }

              /* 方法 4：遍历 br-lan/brif/ */
              {
                  DIR *d = opendir("/sys/class/net/br-lan/brif");
                  if (d) {
                      struct dirent *de;
                      while ((de = readdir(d))) {
                          if (de->d_name[0] == '.') continue;
                          if (strncmp(de->d_name, "eth", 3) != 0) continue;
                          if (strcmp(de->d_name, "eth1") == 0) continue;
                          char cpath[PATH_MAX];
                          snprintf(cpath, sizeof(cpath), "/sys/class/net/%s/carrier", de->d_name);
                          if (read_int_file(cpath) == 1) count++;
                      }
                      closedir(d);
                  }
              }

              /* 方法 5：ethtool 兜底 */
              if (count == 0) {
                  char *out = popen_read("ethtool eth0 2>/dev/null | grep 'Link detected' | grep -c 'yes'");
                  if (out) {
                      if (atoi(out) > 0) count = 1;
                      free(out);
                  }
              }

          done:
              return count;
          }

          static int count_wifi_clients(void) {
              int total = 0;
              char ap_ifaces[16][32];
              int nap = 0;
              char *out = popen_read(
                  "ubus call network.wireless status 2>/dev/null | "
                  "grep -o '\"ifname\" *: *\"[^\"]*\"' | cut -d'\"' -f4");
              if (out && out[0]) {
                  char *line = out;
                  while (*line && nap < 16) {
                      char *nl = strchr(line, '\n');
                      size_t len = nl ? (size_t)(nl - line) : strlen(line);
                      if (len > 0 && len < 32) {
                          memcpy(ap_ifaces[nap], line, len);
                          ap_ifaces[nap][len] = 0;
                          nap++;
                      }
                      line = nl ? nl + 1 : line + len;
                  }
                  free(out);
              } else {
                  if (out) free(out);
                  static const char *cands[] = {"phy0-ap0","wlan0","ath0","ra0","ap0",NULL};
                  for (int i = 0; cands[i] && nap < 16; i++) {
                      char p[PATH_MAX];
                      snprintf(p, sizeof(p), "/sys/class/net/%s", cands[i]);
                      if (access(p, F_OK) == 0) {
                          strncpy(ap_ifaces[nap], cands[i], 31);
                          ap_ifaces[nap][31] = 0;
                          nap++;
                      }
                  }
              }
              for (int i = 0; i < nap; i++) {
                  char p[PATH_MAX];
                  snprintf(p, sizeof(p), "/sys/class/net/%s", ap_ifaces[i]);
                  if (access(p, F_OK) != 0) continue;
                  int sta = 0;
                  char cmd[1024];
                  char *sout;
                  snprintf(cmd, sizeof(cmd),
                           "hostapd_cli -i %s all_sta_info 2>/dev/null | grep -c '^sta '",
                           ap_ifaces[i]);
                  sout = popen_read(cmd);
                  if (sout) { sta = atoi(sout); free(sout); }
                  if (sta <= 0) {
                      snprintf(cmd, sizeof(cmd),
                               "iw %s station dump 2>/dev/null | grep -c '^Station'",
                               ap_ifaces[i]);
                      sout = popen_read(cmd);
                      if (sout) { sta = atoi(sout); free(sout); }
                  }
                  if (sta <= 0) {
                      snprintf(cmd, sizeof(cmd),
                               "iwinfo %s assoclist 2>/dev/null | grep -ci 'dBm'",
                               ap_ifaces[i]);
                      sout = popen_read(cmd);
                      if (sout) { sta = atoi(sout); free(sout); }
                  }
                  if (sta > 0) total += sta;
              }
              return total;
          }

          static int count_clients(void) {
              int wired = count_wired_clients();
              int wifi  = count_wifi_clients();
              int total = wired + wifi;
              return (total > 0) ? total : 0;
          }

          /* ================================================================
           * modem 信息采集
           * ================================================================ */

          static void get_section(void) {
              if (g_section[0]) return;
              char *out = popen_read(
                  "uci show qmodem 2>/dev/null | "
                  "sed -n 's/^qmodem\\.\\([^.]*\\)=modem-device$/\\1/p' | head -1");
              if (out) {
                  char *nl = strchr(out, '\n'); if (nl) *nl = 0;
                  char *cr = strchr(out, '\r'); if (cr) *cr = 0;
                  char *p = out;
                  while (*p == ' ' || *p == '\t') p++;
                  strncpy(g_section, p, sizeof(g_section) - 1);
                  g_section[sizeof(g_section) - 1] = 0;
                  free(out);
              }
          }

          static int fields_filled_count(void) {
              int c = 0;
              for (int i = 0; i < FIELD_COUNT; i++) if (g_fields[i].filled) c++;
              return c;
          }

          static void try_fill(const char *key, const char *full, const char *val) {
              if (!val || !val[0]) return;
              char clean[128];
              strncpy(clean, val, sizeof(clean) - 1);
              clean[sizeof(clean) - 1] = 0;
              sanitize_value(clean);
              if (!clean[0]) return;
              for (int i = 0; i < FIELD_COUNT; i++) {
                  if (g_fields[i].filled) continue;
                  int hit = 0;
                  for (int c = 0; g_fields[i].cands[c]; c++) {
                      if (field_match(g_fields[i].cands[c], key, full)) { hit = 1; break; }
                  }
                  if (hit) {
                      strncpy(g_fields[i].value, clean, sizeof(g_fields[i].value) - 1);
                      g_fields[i].value[sizeof(g_fields[i].value) - 1] = 0;
                      g_fields[i].filled = 1;
                      break;
                  }
              }
          }

          static void scan_array_json(const char *json) {
              const char *mi = strstr(json, "\"modem_info\"");
              if (!mi) return;
              const char *p = strchr(mi, '[');
              if (!p) return;
              p++;
              while (*p) {
                  while (*p && *p != '{') { if (*p == ']') return; p++; }
                  if (*p != '{') return;
                  const char *start = p;
                  int depth = 0, in_str = 0;
                  const char *q = p;
                  for (; *q; q++) {
                      if (in_str) {
                          if (*q == '\\' && q[1]) { q++; continue; }
                          if (*q == '"') in_str = 0;
                      } else {
                          if (*q == '"') in_str = 1;
                          else if (*q == '{') depth++;
                          else if (*q == '}') { depth--; if (depth == 0) { q++; break; } }
                      }
                  }
                  size_t objlen = (size_t)(q - start);
                  char *obj = malloc(objlen + 1);
                  if (!obj) { p = q; continue; }
                  memcpy(obj, start, objlen);
                  obj[objlen] = 0;
                  char key[64] = {0}, full[128] = {0}, val[128] = {0};
                  json_get_field(obj, "key", key, sizeof(key));
                  json_get_field(obj, "full_name", full, sizeof(full));
                  if (json_get_field(obj, "value", val, sizeof(val)) != 0)
                      if (json_get_field(obj, "val", val, sizeof(val)) != 0)
                          json_get_field(obj, "data", val, sizeof(val));
                  try_fill(key, full, val);
                  free(obj);
                  p = q;
              }
          }

          static void scan_flat_json(const char *json) {
              for (int i = 0; i < FIELD_COUNT; i++) {
                  if (g_fields[i].filled) continue;
                  for (int c = 0; g_fields[i].cands[c]; c++) {
                      char val[128] = {0};
                      if (json_get_field(json, g_fields[i].cands[c], val, sizeof(val)) == 0
                          && val[0]) {
                          try_fill(g_fields[i].cands[c], NULL, val);
                          break;
                      }
                  }
              }
          }

          static void scan_cache_files(FILE *dbg) {
              DIR *d = opendir("/tmp");
              if (!d) return;
              struct dirent *de;
              while ((de = readdir(d))) {
                  if (strncmp(de->d_name, "cache_", 6) != 0) continue;
                  if (!strstr(de->d_name, "info")) continue;
                  char path[PATH_MAX];
                  snprintf(path, sizeof(path), "/tmp/%s", de->d_name);
                  struct stat st;
                  if (stat(path, &st) != 0 || !S_ISREG(st.st_mode)) continue;
                  if (st.st_size <= 0 || st.st_size > 65536) continue;
                  FILE *f = fopen(path, "rb");
                  if (!f) continue;
                  char *buf = malloc((size_t)st.st_size + 1);
                  if (!buf) { fclose(f); continue; }
                  size_t n = fread(buf, 1, (size_t)st.st_size, f);
                  fclose(f);
                  buf[n] = 0;
                  if (dbg) fprintf(dbg, "== cache file %s (%d bytes) ==\n%s\n\n",
                                   path, (int)n, buf);
                  scan_array_json(buf);
                  free(buf);
              }
              closedir(d);
          }

          static void probe_ubus_obj(FILE *dbg) {
              static const char *objs[] = {"qmodem", "modem", "modem_scand", "qmodem_scand", NULL};
              if (g_ubus_obj[0]) return;
              for (int i = 0; objs[i]; i++) {
                  char cmd[128];
                  snprintf(cmd, sizeof(cmd), "ubus -v list %s 2>/dev/null", objs[i]);
                  char *out = popen_read(cmd);
                  if (out && out[0]) {
                      strncpy(g_ubus_obj, objs[i], sizeof(g_ubus_obj) - 1);
                      if (dbg) fprintf(dbg, "== ubus -v list %s ==\n%s\n", objs[i], out);
                      free(out);
                      return;
                  }
                  if (out) free(out);
              }
          }

          static char *ubus_call_raw(const char *obj, const char *method, const char *sec) {
              char cmd[320];
              if (sec && sec[0])
                  snprintf(cmd, sizeof(cmd),
                           "ubus call %s %s '{\"config_section\":\"%s\"}' 2>/dev/null",
                           obj, method, sec);
              else
                  snprintf(cmd, sizeof(cmd), "ubus call %s %s 2>/dev/null", obj, method);
              char *out = popen_read(cmd);
              if (out && (!out[0] || !strchr(out, '{'))) { free(out); out = NULL; }
              return out;
          }

          static void collect_group(FILE *dbg, const char *const methods[], char *cache) {
              if (!g_ubus_obj[0]) return;
              const char *list[8];
              int n = 0;
              if (cache[0]) list[n++] = cache;
              for (int i = 0; methods[i] && n < 7; i++) {
                  int dup = 0;
                  for (int j = 0; j < n; j++) if (strcmp(list[j], methods[i]) == 0) dup = 1;
                  if (!dup) list[n++] = methods[i];
              }
              int before = fields_filled_count();
              for (int i = 0; i < n; i++) {
                  char *json = ubus_call_raw(g_ubus_obj, list[i], g_section);
                  if (!json) json = ubus_call_raw(g_ubus_obj, list[i], NULL);
                  if (!json) continue;
                  if (dbg) fprintf(dbg, "== ubus %s %s ==\n%s\n\n", g_ubus_obj, list[i], json);
                  scan_array_json(json);
                  scan_flat_json(json);
                  free(json);
                  if (fields_filled_count() > before) {
                      strncpy(cache, list[i], 31);
                      cache[31] = 0;
                      break;
                  }
              }
          }

          static void scan_rundir_file(const char *path, const char *name, FILE *dbg) {
              FILE *f = fopen(path, "rb");
              if (!f) return;
              static char buf[4096];
              size_t n = fread(buf, 1, sizeof(buf) - 1, f);
              fclose(f);
              buf[n] = 0;
              while (n > 0 && (buf[n-1]=='\n'||buf[n-1]=='\r'||buf[n-1]==' '||buf[n-1]=='\t'))
                  buf[--n] = 0;
              if (!n) return;
              if (dbg) fprintf(dbg, "-- file %s = %s\n", path, buf);
              if (buf[0] == '{') { scan_array_json(buf); scan_flat_json(buf); }
              try_fill(name, name, buf);
          }

          static void scan_rundir(FILE *dbg) {
              DIR *d = opendir(QMODEM_RUNDIR);
              if (!d) return;
              struct dirent *de;
              while ((de = readdir(d))) {
                  if (de->d_name[0] == '.') continue;
                  char path[PATH_MAX];
                  snprintf(path, sizeof(path), QMODEM_RUNDIR "/%s", de->d_name);
                  struct stat st;
                  if (stat(path, &st) != 0) continue;
                  if (S_ISDIR(st.st_mode)) {
                      DIR *d2 = opendir(path);
                      if (!d2) continue;
                      struct dirent *de2;
                      while ((de2 = readdir(d2))) {
                          if (de2->d_name[0] == '.') continue;
                          char p2[PATH_MAX * 2];
                          snprintf(p2, sizeof(p2), "%s/%s", path, de2->d_name);
                          struct stat st2;
                          if (stat(p2, &st2) == 0 && S_ISREG(st2.st_mode) && st2.st_size < 4000)
                              scan_rundir_file(p2, de2->d_name, dbg);
                      }
                      closedir(d2);
                  } else if (S_ISREG(st.st_mode) && st.st_size < 4000) {
                      scan_rundir_file(path, de->d_name, dbg);
                  }
              }
              closedir(d);
          }

          static void collect_modem_info(void) {
              for (int i = 0; i < FIELD_COUNT; i++) {
                  g_fields[i].filled = 0;
                  g_fields[i].value[0] = 0;
              }
              get_section();
              FILE *dbg = fopen(QMODEM_DBG, "w");
              scan_cache_files(dbg);
              if (fields_filled_count() < FIELD_COUNT) {
                  static const char *M_BASE[] = {"base_info","get_base_info","basic_info",
                                                 "status","get_status",NULL};
                  static const char *M_SIM[]  = {"sim_info","get_sim_info","sim_status",
                                                 "get_sim_status",NULL};
                  static const char *M_NET[]  = {"network_info","get_network_info","cell_info",
                                                 "network_status","get_cell_info",NULL};
                  probe_ubus_obj(dbg);
                  collect_group(dbg, M_BASE, g_method_base);
                  collect_group(dbg, M_SIM,  g_method_sim);
                  collect_group(dbg, M_NET,  g_method_net);
                  scan_rundir(dbg);
              }
              postprocess_fields();
              if (dbg) fclose(dbg);
          }

