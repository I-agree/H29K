name: （开机动画）

on:
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # --- 1. 转换 MP4 为 RAW (XRGB8888) ---
      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xxd

      - name: Download MP4
        run: |
          curl -L -o apple.mp4 "https://raw.githubusercontent.com/I-agree/H29K/main/JPG/apple.mp4"

      - name: Convert MP4 to RAW (XRGB8888, 172x172)
        run: |
          ffmpeg -i apple.mp4 -f rawvideo -pix_fmt bgr0 apple.raw
          ls -lh apple.raw

      - name: Embed RAW into C header
        run: |
          xxd -i apple.raw > apple_raw.h
          head -2 apple_raw.h

      # --- 2. 下载 stb 单文件库 ---
      - name: Download stb libraries
        run: |
          curl -L -o stb_image.h "https://raw.githubusercontent.com/nothings/stb/master/stb_image.h"
          curl -L -o stb_truetype.h "https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h"
          curl -L -o stb_image_resize2.h "https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize2.h"
          ls -lh stb_*.h

      # --- 3. 交叉编译 ARM64 DRM 播放程序 ---
      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Setup ARM64 libdrm (Sysroot Method)
        run: |
          sudo dpkg --add-architecture arm64
          UBUNTU_CODENAME=$(lsb_release -cs)
          echo "deb [arch=arm64 trusted=yes] http://ports.ubuntu.com/ubuntu-ports $UBUNTU_CODENAME main" | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list
          sudo apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/ubuntu-ports-arm64.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          
          mkdir -p /tmp/arm64-sysroot
          cd /tmp/arm64-sysroot
          apt-get download libdrm-dev:arm64 libdrm2:arm64 libdrm-common
          for deb in *.deb; do
            dpkg -x "$deb" .
          done

      - name: Create DRM Player C Source
        run: |
          cat << 'ENDOFSOURCE' > drm_play.c
          /*
           * drm_play_arm64 - 开机动画 + 一言信息屏（全合一）
           *
           * 核心设计：
           * - 单进程从头到尾持有 DRM Master，永远不关闭 fd
           * - 避免 drm_lastclose() 被调用导致 panel 关闭
           * - 动画播完后，同一进程直接显示一言+背景
           * - 每 15 分钟刷新一次
           * - 本地 fallback 文字分 4 组轮播
           * 运行时依赖（设备上）：
           * - wget 或 curl（用于 HTTP 请求）
           * - /usr/share/fonts/MiSans-Regular.ttf（中文字体）
           */

          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/ioctl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <errno.h>
          #include <signal.h>
          #include <math.h>
          #include <xf86drm.h>
          #include <xf86drmMode.h>
          #include <drm_fourcc.h>

          #define STB_IMAGE_IMPLEMENTATION
          #define STBI_ONLY_JPEG
          #define STBI_ONLY_PNG
          #include "stb_image.h"

          #define STB_TRUETYPE_IMPLEMENTATION
          #include "stb_truetype.h"

          #define STB_IMAGE_RESIZE_IMPLEMENTATION
          #include "stb_image_resize2.h"

          #include "apple_raw.h"

          /* ===================== 配置 ===================== */
          #define VIDEO_W       172
          #define VIDEO_H       172
          #define BPP           32
          #define FPS           25
          #define DURATION      36
          #define SCREEN_W      320
          #define SCREEN_H      172
          #define FONT_PATH     "/usr/share/fonts/MiSans-Regular.ttf"
          #define FONT_SIZE     25.0f
          #define REFRESH_SEC   (15 * 60)   /* 15 分钟 */
          #define HTTP_TIMEOUT  8

          #define HITOKOTO_URL  "https://v1.hitokoto.cn/?c=f&max_length=60"
          #define PICSUM_URL    "https://picsum.photos/320/172"

          /* ===================== 本地 fallback 文字（4 组轮播） ===================== */
          #define FALLBACK_COUNT 4

          static const char *FALLBACK_TEXTS[FALLBACK_COUNT] = {
              "山林不向四季起誓，荣枯随缘；\n"
              "海洋不需对沙滩承诺，遇合尽兴。",

              "喜欢就处，别问是朋友还是恋人！\n"
              "关系不是绳子，非要绑住谁的手脚。",

              "缘分就像山风，吹到哪儿都是风景。\n"
              "能走一段是礼物，能走一生是运气。",

              "被你改变的那部分我，\n"
              "代替了你永远陪在了我的身边。"
          };

          /* 当前 fallback 轮播索引 */
          static int g_fallback_idx = 0;

          /* ===================== 全局状态 ===================== */
          static uint32_t screen_w, screen_h;
          static volatile sig_atomic_t g_running = 1;

          void sig_handler(int sig) { (void)sig; g_running = 0; }

          void sleep_ms(int ms) {
              struct timespec ts = { .tv_sec = ms / 1000, .tv_nsec = (ms % 1000) * 1000000L };
              nanosleep(&ts, NULL);
          }

          /* ============================================================
           * DRM 初始化
           * ============================================================ */
          static int drm_init(const char *drm_device,
                              drmModeRes **out_res,
                              drmModeConnector **out_conn,
                              uint32_t *out_crtc_id) {
              int fd = open(drm_device, O_RDWR | O_CLOEXEC);
              if (fd < 0) return -1;

              uint64_t has_dumb = 0;
              if (drmGetCap(fd, DRM_CAP_DUMB_BUFFER, &has_dumb) < 0 || !has_dumb) {
                  close(fd); return -1;
              }

              drmModeRes *res = drmModeGetResources(fd);
              if (!res) { close(fd); return -1; }

              drmModeConnector *conn = NULL;
              for (int i = 0; i < res->count_connectors; i++) {
                  drmModeConnector *c = drmModeGetConnector(fd, res->connectors[i]);
                  if (!c) continue;
                  if (c->count_modes > 0) {
                      conn = c;
                      screen_w = c->modes[0].hdisplay;
                      screen_h = c->modes[0].vdisplay;
                      break;
                  }
                  drmModeFreeConnector(c);
              }
              if (!conn) { drmModeFreeResources(res); close(fd); return -1; }

              uint32_t crtc_id = 0;
              if (conn->encoder_id) {
                  drmModeEncoder *enc = drmModeGetEncoder(fd, conn->encoder_id);
                  if (enc) { crtc_id = enc->crtc_id; drmModeFreeEncoder(enc); }
              }
              if (!crtc_id && res->count_crtcs > 0) crtc_id = res->crtcs[0];
              if (!crtc_id) {
                  drmModeFreeConnector(conn);
                  drmModeFreeResources(res);
                  close(fd); return -1;
              }

              *out_res = res;
              *out_conn = conn;
              *out_crtc_id = crtc_id;
              return fd;
          }

          /* ============================================================
           * 创建 dumb buffer + FB + mmap
           * ============================================================ */
          static int drm_create_fb(int fd, struct drm_mode_create_dumb *dumb,
                                   uint32_t *fb_id, void **map_out) {
              memset(dumb, 0, sizeof(*dumb));
              dumb->width = screen_w;
              dumb->height = screen_h;
              dumb->bpp = BPP;
              if (drmIoctl(fd, DRM_IOCTL_MODE_CREATE_DUMB, dumb) < 0) return -1;

              uint32_t handles[4] = {dumb->handle, 0, 0, 0};
              uint32_t pitches[4] = {dumb->pitch, 0, 0, 0};
              uint32_t offsets[4] = {0, 0, 0, 0};
              if (drmModeAddFB2(fd, screen_w, screen_h, DRM_FORMAT_XRGB8888,
                                handles, pitches, offsets, fb_id, 0) < 0) return -1;

              struct drm_mode_map_dumb map_req;
              memset(&map_req, 0, sizeof(map_req));
              map_req.handle = dumb->handle;
              if (drmIoctl(fd, DRM_IOCTL_MODE_MAP_DUMB, &map_req) < 0) return -1;

              *map_out = mmap(0, dumb->size, PROT_READ | PROT_WRITE,
                              MAP_SHARED, fd, map_req.offset);
              if (*map_out == MAP_FAILED) return -1;

              memset(*map_out, 0, dumb->size);
              return 0;
          }

          /* ============================================================
           * 将图片居中复制到 framebuffer
           * ============================================================ */
          static void copy_centered(void *dst, uint32_t pitch,
                                    const uint8_t *src,
                                    uint32_t img_w, uint32_t img_h) {
              memset(dst, 0, (size_t)pitch * screen_h);
              int x_off = ((int)screen_w - (int)img_w) / 2;
              int y_off = ((int)screen_h - (int)img_h) / 2;
              if (x_off < 0) x_off = 0;
              if (y_off < 0) y_off = 0;
              uint32_t cw = (img_w > screen_w) ? screen_w : img_w;
              uint32_t ch = (img_h > screen_h) ? screen_h : img_h;
              for (uint32_t y = 0; y < ch; y++) {
                  memcpy((uint8_t *)dst + (y + y_off) * pitch + x_off * 4,
                         src + y * img_w * 4, cw * 4);
              }
          }

          /* ============================================================
           * HTTP GET（通过 popen 调用 wget）
           * ============================================================ */
          static char *http_get(const char *url, size_t *out_len) {
              char cmd[512];
              snprintf(cmd, sizeof(cmd),
                       "wget -qO- --timeout=%d '%s' 2>/dev/null", HTTP_TIMEOUT, url);

              FILE *fp = popen(cmd, "r");
              if (!fp) return NULL;

              size_t cap = 65536, len = 0;
              char *buf = malloc(cap);
              if (!buf) { pclose(fp); return NULL; }

              size_t n;
              while ((n = fread(buf + len, 1, cap - len - 1, fp)) > 0) {
                  len += n;
                  if (len >= cap - 1) {
                      cap *= 2;
                      char *tmp = realloc(buf, cap);
                      if (!tmp) { free(buf); pclose(fp); return NULL; }
                      buf = tmp;
                  }
              }
              pclose(fp);
              buf[len] = '\0';
              if (out_len) *out_len = len;
              return buf;
          }

          /* ============================================================
           * HTTP GET 到文件（用于下载图片）
           * ============================================================ */
          static int http_get_file(const char *url, const char *path) {
              char cmd[512];
              snprintf(cmd, sizeof(cmd),
                       "wget -qO '%s' --timeout=%d '%s' 2>/dev/null",
                       path, HTTP_TIMEOUT, url);
              int ret = system(cmd);
              return (ret == 0) ? 0 : -1;
          }

          /* ============================================================
           * 简单 JSON 字段提取
           * ============================================================ */
          static int json_get_string(const char *json, const char *key,
                                     char *out, size_t out_size) {
              char pattern[128];
              snprintf(pattern, sizeof(pattern), "\"%s\"", key);
              const char *p = strstr(json, pattern);
              if (!p) return -1;

              p = strchr(p + strlen(pattern), ':');
              if (!p) return -1;
              p++;
              while (*p == ' ' || *p == '\t') p++;
              if (*p != '"') return -1;
              p++;

              size_t i = 0;
              while (*p && *p != '"' && i < out_size - 1) {
                  if (*p == '\\' && *(p+1)) {
                      p++;
                      switch (*p) {
                          case 'n': out[i++] = '\n'; break;
                          case 't': out[i++] = '\t'; break;
                          case '"': out[i++] = '"'; break;
                          case '\\': out[i++] = '\\'; break;
                          default: out[i++] = *p; break;
                      }
                  } else {
                      out[i++] = *p;
                  }
                  p++;
              }
              out[i] = '\0';
              return 0;
          }

          /* ============================================================
           * 获取一言文字（网络优先，失败则轮播本地 4 组）
           * ============================================================ */
          static void fetch_hitokoto(char *text_buf, size_t buf_size) {
              char *json = http_get(HITOKOTO_URL, NULL);
              if (!json) {
                  /* 网络不可用 → 使用本地 fallback，按顺序轮播 */
                  strncpy(text_buf, FALLBACK_TEXTS[g_fallback_idx], buf_size - 1);
                  text_buf[buf_size - 1] = '\0';
                  g_fallback_idx = (g_fallback_idx + 1) % FALLBACK_COUNT;
                  return;
              }

              char hitokoto[512] = {0};
              char from[128] = {0};

              if (json_get_string(json, "hitokoto", hitokoto, sizeof(hitokoto)) == 0
                  && hitokoto[0]) {
                  json_get_string(json, "from", from, sizeof(from));
                  if (from[0])
                      snprintf(text_buf, buf_size, "%s\n\n——%s", hitokoto, from);
                  else
                      snprintf(text_buf, buf_size, "%s", hitokoto);
              } else {
                  /* JSON 解析失败 → 本地 fallback 轮播 */
                  strncpy(text_buf, FALLBACK_TEXTS[g_fallback_idx], buf_size - 1);
                  text_buf[buf_size - 1] = '\0';
                  g_fallback_idx = (g_fallback_idx + 1) % FALLBACK_COUNT;
              }
              free(json);
          }

          /* ============================================================
           * 下载并解码背景图片
           * ============================================================ */
          static uint8_t *fetch_background(int *w, int *h) {
              const char *tmp_path = "/tmp/.drm_bg_img";
              if (http_get_file(PICSUM_URL, tmp_path) < 0)
                  return NULL;

              int channels;
              uint8_t *data = stbi_load(tmp_path, w, h, &channels, 4);
              unlink(tmp_path);
              return data;
          }

          /* ============================================================
           * 使用 stb_truetype 渲染文字到 RGBA buffer
           * ============================================================ */
          static void render_text_rgba(uint8_t *rgba, int img_w, int img_h,
                                       const char *text) {
              FILE *ff = fopen(FONT_PATH, "rb");
              if (!ff) return;

              fseek(ff, 0, SEEK_END);
              long fsize = ftell(ff);
              fseek(ff, 0, SEEK_SET);

              if (fsize <= 0) { fclose(ff); return; }

              uint8_t *font_data = malloc((size_t)fsize);
              if (!font_data) { fclose(ff); return; }

              size_t read_bytes = fread(font_data, 1, (size_t)fsize, ff);
              fclose(ff);

              if (read_bytes != (size_t)fsize) {
                  free(font_data);
                  return;
              }

              stbtt_fontinfo font;
              if (!stbtt_InitFont(&font, font_data, 0)) {
                  free(font_data);
                  return;
              }

              float scale = stbtt_ScaleForPixelHeight(&font, FONT_SIZE);
              int ascent, descent, line_gap;
              stbtt_GetFontVMetrics(&font, &ascent, &descent, &line_gap);
              int line_height = (int)((ascent - descent + line_gap) * scale);
              if (line_height <= 0) line_height = (int)(FONT_SIZE + 2);

              /* 计算行数 */
              int num_lines = 1;
              for (const char *p = text; *p; p++) {
                  if (*p == '\n') num_lines++;
              }
              int total_h = num_lines * line_height;
              int y_start = (img_h - total_h) / 2;
              if (y_start < 0) y_start = 0;

              /* 逐行渲染 */
              const char *line_start = text;
              int cur_y = y_start;

              while (line_start && *line_start) {
                  const char *line_end = strchr(line_start, '\n');
                  size_t line_len = line_end ? (size_t)(line_end - line_start) : strlen(line_start);

                  /* 计算行宽 */
                  int line_w = 0;
                  for (size_t i = 0; i < line_len; ) {
                      int codepoint = 0;
                      int bytes = 0;
                      uint8_t c = (uint8_t)line_start[i];
                      if (c < 0x80) { codepoint = c; bytes = 1; }
                      else if ((c & 0xE0) == 0xC0) { codepoint = c & 0x1F; bytes = 2; }
                      else if ((c & 0xF0) == 0xE0) { codepoint = c & 0x0F; bytes = 3; }
                      else if ((c & 0xF8) == 0xF0) { codepoint = c & 0x07; bytes = 4; }
                      else { i++; continue; }
                      for (int b = 1; b < bytes && (i + (size_t)b) < line_len; b++)
                          codepoint = (codepoint << 6) | ((uint8_t)line_start[i+b] & 0x3F);
                      i += (size_t)bytes;

                      int adv;
                      stbtt_GetCodepointHMetrics(&font, codepoint, &adv, NULL);
                      line_w += (int)(adv * scale);
                  }

                  int x_pos = (img_w - line_w) / 2;
                  if (x_pos < 0) x_pos = 0;

                  /* 渲染每个字符 */
                  int pen_x = x_pos;
                  for (size_t i = 0; i < line_len; ) {
                      int codepoint = 0;
                      int bytes = 0;
                      uint8_t c = (uint8_t)line_start[i];
                      if (c < 0x80) { codepoint = c; bytes = 1; }
                      else if ((c & 0xE0) == 0xC0) { codepoint = c & 0x1F; bytes = 2; }
                      else if ((c & 0xF0) == 0xE0) { codepoint = c & 0x0F; bytes = 3; }
                      else if ((c & 0xF8) == 0xF0) { codepoint = c & 0x07; bytes = 4; }
                      else { i++; continue; }
                      for (int b = 1; b < bytes && (i + (size_t)b) < line_len; b++)
                          codepoint = (codepoint << 6) | ((uint8_t)line_start[i+b] & 0x3F);
                      i += (size_t)bytes;

                      int x0, y0, x1, y1;
                      stbtt_GetCodepointBitmapBox(&font, codepoint, scale, scale,
                                                  &x0, &y0, &x1, &y1);
                      int gw = x1 - x0, gh = y1 - y0;
                      if (gw > 0 && gh > 0) {
                          uint8_t *bitmap = malloc((size_t)(gw * gh));
                          if (bitmap) {
                              stbtt_MakeCodepointBitmap(&font, bitmap, gw, gh, gw,
                                                        scale, scale, codepoint);
                              int bx = pen_x + x0;
                              int by = cur_y + (int)(ascent * scale) + y0;
                              for (int row = 0; row < gh; row++) {
                                  for (int col = 0; col < gw; col++) {
                                      int px = bx + col;
                                      int py = by + row;
                                      if (px >= 0 && px < img_w && py >= 0 && py < img_h) {
                                          uint8_t alpha = bitmap[row * gw + col];
                                          if (alpha > 0) {
                                              int idx = (py * img_w + px) * 4;
                                              rgba[idx+0] = (uint8_t)((255 * alpha + rgba[idx+0] * (255 - alpha)) / 255);
                                              rgba[idx+1] = (uint8_t)((255 * alpha + rgba[idx+1] * (255 - alpha)) / 255);
                                              rgba[idx+2] = (uint8_t)((255 * alpha + rgba[idx+2] * (255 - alpha)) / 255);
                                              rgba[idx+3] = 255;
                                          }
                                      }
                                  }
                              }
                              free(bitmap);
                          }
                      }

                      int adv;
                      stbtt_GetCodepointHMetrics(&font, codepoint, &adv, NULL);
                      pen_x += (int)(adv * scale);
                  }

                  cur_y += line_height;
                  line_start = line_end ? line_end + 1 : NULL;
              }

              free(font_data);
          }

          /* ============================================================
           * 将 RGBA 图像转为 XRGB8888 并写入 framebuffer
           * ============================================================ */
          static void rgba_to_fb(void *fb, uint32_t pitch,
                                 const uint8_t *rgba, int img_w, int img_h) {
              memset(fb, 0, (size_t)pitch * screen_h);
              int x_off = ((int)screen_w - img_w) / 2;
              int y_off = ((int)screen_h - img_h) / 2;
              if (x_off < 0) x_off = 0;
              if (y_off < 0) y_off = 0;
              int cw = (img_w > (int)screen_w) ? (int)screen_w : img_w;
              int ch = (img_h > (int)screen_h) ? (int)screen_h : img_h;

              for (int y = 0; y < ch; y++) {
                  uint8_t *dst_row = (uint8_t *)fb + (y + y_off) * pitch + x_off * 4;
                  const uint8_t *src_row = rgba + y * img_w * 4;
                  for (int x = 0; x < cw; x++) {
                      dst_row[x*4 + 0] = src_row[x*4 + 2]; /* B */
                      dst_row[x*4 + 1] = src_row[x*4 + 1]; /* G */
                      dst_row[x*4 + 2] = src_row[x*4 + 0]; /* R */
                      dst_row[x*4 + 3] = 0xFF;             /* X */
                  }
              }
          }

          /* ============================================================
           * 显示一帧信息（一言 + 背景）
           * ============================================================ */
          static void display_info_frame(int fd, uint32_t crtc_id,
                                         uint32_t conn_id, drmModeModeInfo *mode,
                                         void *map, uint32_t pitch, uint32_t fb_id) {
              char text[2048];
              fetch_hitokoto(text, sizeof(text));

              int bg_w = 0, bg_h = 0;
              uint8_t *bg_rgba = fetch_background(&bg_w, &bg_h);

              uint8_t *canvas;
              int canvas_w = SCREEN_W, canvas_h = SCREEN_H;

              if (bg_rgba && bg_w > 0 && bg_h > 0) {
                  canvas = malloc((size_t)(canvas_w * canvas_h * 4));
                  if (canvas) {
                      /*
                       * stb_image_resize2.h (v2) API:
                       * stbir_resize(input, in_w, in_h, in_stride,
                       *              output, out_w, out_h, out_stride,
                       *              pixel_layout, data_type, edge, filter)
                       */
                      stbir_resize(bg_rgba, bg_w, bg_h, 0,
                                   canvas, canvas_w, canvas_h, 0,
                                   STBIR_RGBA, STBIR_TYPE_UINT8,
                                   STBIR_EDGE_CLAMP, STBIR_FILTER_DEFAULT);
                  } else {
                      canvas = calloc((size_t)(canvas_w * canvas_h), 4);
                  }
                  stbi_image_free(bg_rgba);
              } else {
                  canvas = calloc((size_t)(canvas_w * canvas_h), 4);
                  if (canvas) {
                      for (int i = 0; i < canvas_w * canvas_h; i++)
                          canvas[i*4 + 3] = 255;
                  }
              }

              if (!canvas) return;

              render_text_rgba(canvas, canvas_w, canvas_h, text);
              rgba_to_fb(map, pitch, canvas, canvas_w, canvas_h);
              free(canvas);

              drmModeSetCrtc(fd, crtc_id, fb_id, 0, 0, &conn_id, 1, mode);
          }

          /* ============================================================
           * Daemon 化
           * ============================================================ */
          static void daemonize(void) {
              int devnull = open("/dev/null", O_RDWR);
              if (devnull >= 0) {
                  dup2(devnull, STDIN_FILENO);
                  dup2(devnull, STDOUT_FILENO);
                  dup2(devnull, STDERR_FILENO);
                  if (devnull > 2) close(devnull);
              }
          }

          /* ============================================================
           * main
           * ============================================================ */
          int main(int argc, char *argv[]) {
              signal(SIGPIPE, SIG_IGN);
              signal(SIGTERM, sig_handler);
              signal(SIGINT, sig_handler);

              const char *drm_device = (argc > 1) ? argv[1] : "/dev/dri/card0";

              /* 1. 初始化 DRM */
              drmModeRes *res;
              drmModeConnector *conn;
              uint32_t crtc_id;

              int fd = drm_init(drm_device, &res, &conn, &crtc_id);
              if (fd < 0) return 1;

              /* 2. 创建双缓冲 */
              struct drm_mode_create_dumb dumb[2];
              void *map[2];
              uint32_t fb_id[2];

              for (int i = 0; i < 2; i++) {
                  if (drm_create_fb(fd, &dumb[i], &fb_id[i], &map[i]) < 0) {
                      drmModeFreeConnector(conn);
                      drmModeFreeResources(res);
                      close(fd);
                      return 1;
                  }
              }

              /* 3. 播放开机动画 */
              size_t frame_size = VIDEO_W * VIDEO_H * (BPP / 8);
              long total_frames = (long)(apple_raw_len / frame_size);
              long total_duration_frames = FPS * DURATION;

              copy_centered(map[0], dumb[0].pitch, apple_raw, VIDEO_W, VIDEO_H);
              drmModeSetCrtc(fd, crtc_id, fb_id[0], 0, 0,
                             &conn->connector_id, 1, &conn->modes[0]);

              int cur = 1;
              long frame_count = 1;
              time_t start_time = time(NULL);

              while (frame_count < total_duration_frames && g_running) {
                  if (difftime(time(NULL), start_time) >= DURATION) break;

                  long fi = frame_count % total_frames;
                  copy_centered(map[cur], dumb[cur].pitch,
                                apple_raw + fi * frame_size, VIDEO_W, VIDEO_H);
                  drmModeSetCrtc(fd, crtc_id, fb_id[cur], 0, 0,
                                 &conn->connector_id, 1, &conn->modes[0]);
                  cur = 1 - cur;
                  frame_count++;
                  sleep_ms(1000 / FPS);
              }

              /* 4. Daemon 化（关闭 stdio，保持 DRM fd） */
              daemonize();

              /* 5. 信息屏循环 */
              uint32_t info_fb = fb_id[0];
              void *info_map = map[0];
              uint32_t info_pitch = dumb[0].pitch;

              while (g_running) {
                  display_info_frame(fd, crtc_id, conn->connector_id,
                                     &conn->modes[0],
                                     info_map, info_pitch, info_fb);

                  /* 等待 15 分钟（分段 sleep 响应信号） */
                  for (int i = 0; i < REFRESH_SEC && g_running; i++) {
                      sleep(1);
                  }
              }

              /* 6. 清理退出 */
              drmModeFreeConnector(conn);
              drmModeFreeResources(res);
              close(fd);
              return 0;
          }
          ENDOFSOURCE

      - name: Cross Compile for ARM64 (RK3528)
        run: |
          aarch64-linux-gnu-gcc -O2 -static -o drm_play_arm64 drm_play.c \
            -I. \
            -I/tmp/arm64-sysroot/usr/include \
            -I/tmp/arm64-sysroot/usr/include/libdrm \
            -I/tmp/arm64-sysroot/usr/include/drm \
            -I/tmp/arm64-sysroot/usr/include/aarch64-linux-gnu \
            -L/tmp/arm64-sysroot/usr/lib/aarch64-linux-gnu \
            -ldrm -lm
          
          chmod +x drm_play_arm64
          file drm_play_arm64
          ls -lh drm_play_arm64

      # --- 4. 生成 init.d 开机脚本 ---
      - name: Create init.d boot script
        run: |
          cat << 'EOF' > 99-bootanim
          #!/bin/sh /etc/rc.common

          START=11
          STOP=10

          DRM_DRIVER="panel-mipi-dbi-spi"

          start() {
              PLAYER="/usr/sbin/drm_play_arm64"
              DRM_DEV="/dev/dri/card1"
              
              [ ! -f "$PLAYER" ] && return 1
              
              # 等待 DRM 设备就绪
              i=0
              while [ ! -e "$DRM_DEV" ] && [ $i -lt 10 ]; do
                  sleep 1
                  i=$((i+1))
              done
              [ ! -e "$DRM_DEV" ] && return 1
              
              # 杀掉旧进程
              killall drm_play_arm64 2>/dev/null
              sleep 1
              
              # unbind/rebind 驱动
              SPI_DEV=""
              for dev in /sys/bus/spi/devices/*; do
                  if [ -f "$dev/modalias" ]; then
                      ALIAS=$(cat "$dev/modalias" 2>/dev/null)
                      case "$ALIAS" in
                          *gc9307*|*panel-mipi-dbi*)
                              SPI_DEV=$(basename "$dev")
                              break
                              ;;
                      esac
                  fi
              done
              
              if [ -n "$SPI_DEV" ] && [ -d "/sys/bus/spi/drivers/$DRM_DRIVER" ]; then
                  echo "$SPI_DEV" > "/sys/bus/spi/drivers/$DRM_DRIVER/unbind" 2>/dev/null
                  sleep 1
                  echo "$SPI_DEV" > "/sys/bus/spi/drivers/$DRM_DRIVER/bind" 2>/dev/null
                  i=0
                  while [ ! -e "$DRM_DEV" ] && [ $i -lt 5 ]; do
                      sleep 1
                      i=$((i+1))
                  done
              fi
              
              # 启动
              "$PLAYER" "$DRM_DEV" &
          }

          stop() {
              killall drm_play_arm64 2>/dev/null
          }
          EOF
          chmod +x 99-bootanim

      # --- 5. 生成安装说明 ---
      - name: Create install instructions
        run: |
          cat << 'EOF' > INSTALL.txt
          ============================================
            Boot Animation + Info Screen (All-in-One)
          ============================================

          文件:
            drm_play_arm64  - 开机动画 + 一言信息屏（全合一）
            99-bootanim     - OpenWrt init.d 开机脚本

          运行时依赖:
            - wget（OpenWrt 自带）
            - /usr/share/fonts/MiSans-Regular.ttf（中文字体）

          Step 1: 上传文件
          -------------------------
          scp drm_play_arm64 root@192.168.1.1:/usr/sbin/
          scp 99-bootanim root@192.168.1.1:/etc/init.d/

          Step 2: 上传字体（如果还没有）
          -------------------------
          scp MiSans-Regular.ttf root@192.168.1.1:/usr/share/fonts/

          Step 3: 设置权限和启用
          -------------------------
          ssh root@192.168.1.1
          chmod +x /usr/sbin/drm_play_arm64
          chmod +x /etc/init.d/99-bootanim
          /etc/init.d/99-bootanim enable

          本地 fallback 文字（4 组轮播，每次只显示 2 行）:
          --------------------------------------------------
          第 1 组: 山林不向四季起誓，荣枯随缘；
                   海洋不需对沙滩承诺，遇合尽兴。

          第 2 组: 喜欢就处，别问是朋友还是恋人！
                   关系不是绳子，非要绑住谁的手脚。

          第 3 组: 缘分就像山风，吹到哪儿都是风景。
                   能走一段是礼物，能走一生是运气。

          第 4 组: 被你改变的那部分我，
                   代替了你永远陪在了我的身边。

          有网络时: 从一言 API 获取随机句子
          无网络时: 按 1→2→3→4→1→... 顺序轮播本地文字
          每 15 分钟切换一次

          停止: killall drm_play_arm64
          卸载: /etc/init.d/99-bootanim disable && rm /usr/sbin/drm_play_arm64 /etc/init.d/99-bootanim
          EOF

      # --- 6. 上传产物 ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: H29K-BootAnimation-Pack
          path: |
            drm_play_arm64
            99-bootanim
            INSTALL.txt
