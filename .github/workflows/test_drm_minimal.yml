name: （开机动画）

on:
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # --- 1. 转换 MP4 为 RAW (XRGB8888) ---
      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xxd

      - name: Download MP4
        run: |
          curl -L -o apple.mp4 "https://raw.githubusercontent.com/I-agree/H29K/main/JPG/apple.mp4"

      - name: Convert MP4 to RAW (XRGB8888, 172x172)
        run: |
          ffmpeg -i apple.mp4 -f rawvideo -pix_fmt bgr0 apple.raw
          ls -lh apple.raw

      - name: Embed RAW into C header
        run: |
          xxd -i apple.raw > apple_raw.h
          head -2 apple_raw.h

      # --- 2. 交叉编译 ARM64 DRM 播放程序 ---
      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Setup ARM64 libdrm (Sysroot Method)
        run: |
          sudo dpkg --add-architecture arm64
          UBUNTU_CODENAME=$(lsb_release -cs)
          echo "deb [arch=arm64 trusted=yes] http://ports.ubuntu.com/ubuntu-ports $UBUNTU_CODENAME main" | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list
          sudo apt-get update -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/ubuntu-ports-arm64.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          
          mkdir -p /tmp/arm64-sysroot
          cd /tmp/arm64-sysroot
          apt-get download libdrm-dev:arm64 libdrm2:arm64 libdrm-common
          for deb in *.deb; do
            dpkg -x "$deb" .
          done

      - name: Create DRM Player C Source
        run: |
          cat << 'ENDOFSOURCE' > drm_play.c
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/ioctl.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <errno.h>
          #include <limits.h>
          #include <signal.h>
          #include <xf86drm.h>
          #include <xf86drmMode.h>
          #include <drm_fourcc.h>

          #include "apple_raw.h"

          #define VIDEO_W  172
          #define VIDEO_H  172
          #define BPP      32
          #define FPS      25
          #define DURATION 36
          #define BO_PY_PATH "/etc/bo.py"

          static uint32_t screen_w, screen_h;
          static volatile sig_atomic_t g_running = 1;

          void sleep_ms(int ms) {
              struct timespec ts = { .tv_sec = ms / 1000, .tv_nsec = (ms % 1000) * 1000000 };
              nanosleep(&ts, NULL);
          }

          void sig_handler(int sig) {
              g_running = 0;
          }

          /* ============================================================
           * 通用 DRM 初始化
           * ============================================================ */
          static int drm_init(const char *drm_device,
                              drmModeRes **out_res,
                              drmModeConnector **out_conn,
                              uint32_t *out_crtc_id) {
              int fd = open(drm_device, O_RDWR | O_CLOEXEC);
              if (fd < 0) return -1;

              uint64_t has_dumb = 0;
              if (drmGetCap(fd, DRM_CAP_DUMB_BUFFER, &has_dumb) < 0 || !has_dumb) {
                  close(fd);
                  return -1;
              }

              drmModeRes *res = drmModeGetResources(fd);
              if (!res) { close(fd); return -1; }

              drmModeConnector *conn = NULL;
              for (int i = 0; i < res->count_connectors; i++) {
                  drmModeConnector *c = drmModeGetConnector(fd, res->connectors[i]);
                  if (!c) continue;
                  if (c->count_modes > 0) {
                      conn = c;
                      screen_w = c->modes[0].hdisplay;
                      screen_h = c->modes[0].vdisplay;
                      break;
                  }
                  drmModeFreeConnector(c);
              }
              if (!conn) { drmModeFreeResources(res); close(fd); return -1; }

              uint32_t crtc_id = 0;
              if (conn->encoder_id) {
                  drmModeEncoder *enc = drmModeGetEncoder(fd, conn->encoder_id);
                  if (enc) { crtc_id = enc->crtc_id; drmModeFreeEncoder(enc); }
              }
              if (!crtc_id && res->count_crtcs > 0) crtc_id = res->crtcs[0];
              if (!crtc_id) {
                  drmModeFreeConnector(conn);
                  drmModeFreeResources(res);
                  close(fd);
                  return -1;
              }

              *out_res = res;
              *out_conn = conn;
              *out_crtc_id = crtc_id;
              return fd;
          }

          /* ============================================================
           * 创建 dumb buffer + FB + mmap
           * ============================================================ */
          static int drm_create_fb(int fd, struct drm_mode_create_dumb *dumb,
                                   uint32_t *fb_id, void **map_out) {
              memset(dumb, 0, sizeof(*dumb));
              dumb->width = screen_w;
              dumb->height = screen_h;
              dumb->bpp = BPP;
              if (drmIoctl(fd, DRM_IOCTL_MODE_CREATE_DUMB, dumb) < 0) return -1;

              uint32_t handles[4] = {dumb->handle, 0, 0, 0};
              uint32_t pitches[4] = {dumb->pitch, 0, 0, 0};
              uint32_t offsets[4] = {0, 0, 0, 0};
              if (drmModeAddFB2(fd, screen_w, screen_h, DRM_FORMAT_XRGB8888,
                                handles, pitches, offsets, fb_id, 0) < 0) return -1;

              struct drm_mode_map_dumb map_req;
              memset(&map_req, 0, sizeof(map_req));
              map_req.handle = dumb->handle;
              if (drmIoctl(fd, DRM_IOCTL_MODE_MAP_DUMB, &map_req) < 0) return -1;

              *map_out = mmap(0, dumb->size, PROT_READ | PROT_WRITE,
                              MAP_SHARED, fd, map_req.offset);
              if (*map_out == MAP_FAILED) return -1;

              memset(*map_out, 0, dumb->size);
              return 0;
          }

          /* ============================================================
           * 将图片居中复制到 framebuffer
           * ============================================================ */
          static void copy_centered(void *dst, uint32_t pitch,
                                    const uint8_t *src,
                                    uint32_t img_w, uint32_t img_h) {
              memset(dst, 0, pitch * screen_h);
              int x_off = ((int)screen_w - (int)img_w) / 2;
              int y_off = ((int)screen_h - (int)img_h) / 2;
              if (x_off < 0) x_off = 0;
              if (y_off < 0) y_off = 0;
              uint32_t cw = (img_w > screen_w) ? screen_w : img_w;
              uint32_t ch = (img_h > screen_h) ? screen_h : img_h;
              for (uint32_t y = 0; y < ch; y++) {
                  memcpy((uint8_t *)dst + (y + y_off) * pitch + x_off * 4,
                         src + y * img_w * 4,
                         cw * 4);
              }
          }

          /* ============================================================
           * Daemon 化：关闭标准 IO，保持进程和 fd 存活
           * ============================================================ */
          static void daemonize(void) {
              int devnull = open("/dev/null", O_RDWR);
              if (devnull >= 0) {
                  dup2(devnull, STDIN_FILENO);
                  dup2(devnull, STDOUT_FILENO);
                  dup2(devnull, STDERR_FILENO);
                  if (devnull > 2) close(devnull);
              }
          }

          /* ============================================================
           * --show 模式：从 stdin 读取像素数据，显示到屏幕
           *
           * 关键：此进程 open() DRM 设备时，必须确保没有其他进程持有 Master。
           * 根据 drm_auth.c 的 drm_master_open()：
           *   - 如果 dev->master == NULL → open 自动成为 Master
           *   - 如果 dev->master != NULL → 只是引用，不是 Master
           *
           * 所以 bo.py 必须确保动画父进程已退出后再启动 --show。
           * --show 内部会重试 open + SetCrtc，最多等 5 秒。
           * ============================================================ */
          static int show_mode(const char *drm_device, uint32_t img_w, uint32_t img_h) {
              size_t expected = (size_t)img_w * img_h * 4;
              uint8_t *img_data = malloc(expected);
              if (!img_data) return 1;

              size_t total_read = 0;
              while (total_read < expected) {
                  ssize_t n = read(STDIN_FILENO, img_data + total_read,
                                   expected - total_read);
                  if (n <= 0) break;
                  total_read += n;
              }
              if (total_read < expected) {
                  free(img_data);
                  return 1;
              }

              /*
               * 重试打开 DRM 设备并显示。
               * 如果当前有其他进程持有 Master，drmModeSetCrtc 会返回 -EACCES。
               * 我们重试直到成功或超时（5 秒）。
               */
              int success = 0;
              for (int attempt = 0; attempt < 50; attempt++) {
                  drmModeRes *res;
                  drmModeConnector *conn;
                  uint32_t crtc_id;

                  int fd = drm_init(drm_device, &res, &conn, &crtc_id);
                  if (fd < 0) {
                      usleep(100000);
                      continue;
                  }

                  struct drm_mode_create_dumb dumb;
                  uint32_t fb_id;
                  void *map;

                  if (drm_create_fb(fd, &dumb, &fb_id, &map) < 0) {
                      drmModeFreeConnector(conn);
                      drmModeFreeResources(res);
                      close(fd);
                      usleep(100000);
                      continue;
                  }

                  copy_centered(map, dumb.pitch, img_data, img_w, img_h);

                  int ret = drmModeSetCrtc(fd, crtc_id, fb_id, 0, 0,
                                           &conn->connector_id, 1, &conn->modes[0]);

                  if (ret == 0) {
                      /* 成功！保持 fd 打开，daemon 化 */
                      drmModeFreeConnector(conn);
                      drmModeFreeResources(res);
                      free(img_data);

                      daemonize();
                      signal(SIGTERM, sig_handler);
                      signal(SIGINT, sig_handler);
                      while (g_running) pause();

                      close(fd);
                      return 0;
                  }

                  /* SetCrtc 失败（可能不是 Master），关闭重试 */
                  drmModeFreeConnector(conn);
                  drmModeFreeResources(res);
                  close(fd);
                  usleep(100000); /* 100ms */
              }

              free(img_data);
              return 1;
          }

          /* ============================================================
           * 动画播放模式
           *
           * 播完后：
           *   - /etc/bo.py 存在 → fork 运行 bo.py，父进程立即退出释放 Master
           *     bo.py 启动 --show 时，dev->master 已为 NULL，--show 自动成为 Master
           *   - /etc/bo.py 不存在 → 清屏，daemon 化保持 CRTC 活跃
           * ============================================================ */
          static int play_mode(const char *drm_device) {
              size_t frame_size = VIDEO_W * VIDEO_H * (BPP / 8);
              long total_frames = (long)(apple_raw_len / frame_size);
              long total_duration_frames = FPS * DURATION;

              drmModeRes *res;
              drmModeConnector *conn;
              uint32_t crtc_id;

              int fd = drm_init(drm_device, &res, &conn, &crtc_id);
              if (fd < 0) return 1;

              /* 双缓冲 */
              struct drm_mode_create_dumb dumb[2];
              void *map[2];
              uint32_t fb_id[2];

              for (int i = 0; i < 2; i++) {
                  if (drm_create_fb(fd, &dumb[i], &fb_id[i], &map[i]) < 0) {
                      drmModeFreeConnector(conn);
                      drmModeFreeResources(res);
                      close(fd);
                      return 1;
                  }
              }

              /* 显示第一帧 */
              copy_centered(map[0], dumb[0].pitch,
                            apple_raw, VIDEO_W, VIDEO_H);
              if (drmModeSetCrtc(fd, crtc_id, fb_id[0], 0, 0,
                                 &conn->connector_id, 1, &conn->modes[0]) < 0) {
                  drmModeFreeConnector(conn);
                  drmModeFreeResources(res);
                  close(fd);
                  return 1;
              }

              /* 循环播放 */
              int cur = 1;
              long frame_count = 1;
              time_t start_time = time(NULL);

              while (frame_count < total_duration_frames) {
                  if (difftime(time(NULL), start_time) >= DURATION) break;

                  long fi = frame_count % total_frames;
                  copy_centered(map[cur], dumb[cur].pitch,
                                apple_raw + fi * frame_size,
                                VIDEO_W, VIDEO_H);
                  drmModeSetCrtc(fd, crtc_id, fb_id[cur], 0, 0,
                                 &conn->connector_id, 1, &conn->modes[0]);
                  cur = 1 - cur;
                  frame_count++;
                  sleep_ms(1000 / FPS);
              }

              /* === 动画播完 === */
              drmModeFreeConnector(conn);
              drmModeFreeResources(res);

              signal(SIGTERM, sig_handler);
              signal(SIGINT, sig_handler);

              struct stat st;
              if (stat(BO_PY_PATH, &st) == 0) {
                  /*
                   * /etc/bo.py 存在：
                   * 1. fork 子进程运行 bo.py
                   * 2. 父进程立即 close(fd) 退出 → 释放 DRM Master
                   * 3. bo.py 启动 --show → open() 时 dev->master == NULL → 自动成为 Master
                   *
                   * 注意：父进程不能 pause()！必须退出释放 Master！
                   */
                  pid_t pid = fork();
                  if (pid == 0) {
                      /* 子进程：关闭继承的 DRM fd，运行 bo.py */
                      close(fd);
                      /* 短暂等待确保父进程已退出释放 Master */
                      usleep(200000); /* 200ms */
                      execlp("python3", "python3", BO_PY_PATH, NULL);
                      execlp("python", "python", BO_PY_PATH, NULL);
                      _exit(1);
                  }
                  /* 父进程：立即退出，释放 DRM Master */
                  close(fd);
                  return 0;

              } else {
                  /* /etc/bo.py 不存在 → 清屏，daemon 化保持 CRTC 活跃 */
                  memset(map[0], 0, dumb[0].size);
                  drmModeSetCrtc(fd, crtc_id, fb_id[0], 0, 0,
                                 &conn->connector_id, 1, &conn->modes[0]);

                  daemonize();
                  while (g_running) pause();
              }

              close(fd);
              return 0;
          }

          /* ============================================================
           * main
           * ============================================================ */
          int main(int argc, char *argv[]) {
              signal(SIGPIPE, SIG_IGN);

              if (argc >= 3 && strcmp(argv[1], "--show") == 0) {
                  const char *dev = argv[2];
                  uint32_t w = (argc > 3) ? (uint32_t)atoi(argv[3]) : 320;
                  uint32_t h = (argc > 4) ? (uint32_t)atoi(argv[4]) : 172;
                  return show_mode(dev, w, h);
              }

              const char *drm_device = (argc > 1) ? argv[1] : "/dev/dri/card0";
              return play_mode(drm_device);
          }
          ENDOFSOURCE

      - name: Cross Compile for ARM64 (RK3528)
        run: |
          aarch64-linux-gnu-gcc -O2 -static -o drm_play_arm64 drm_play.c \
            -I. \
            -I/tmp/arm64-sysroot/usr/include \
            -I/tmp/arm64-sysroot/usr/include/libdrm \
            -I/tmp/arm64-sysroot/usr/include/drm \
            -I/tmp/arm64-sysroot/usr/include/aarch64-linux-gnu \
            -L/tmp/arm64-sysroot/usr/lib/aarch64-linux-gnu \
            -ldrm
          
          chmod +x drm_play_arm64
          file drm_play_arm64
          ls -lh drm_play_arm64

      # --- 3. 生成 bo.py ---
      - name: Create bo.py
        run: |
          cat << 'ENDOFPY' > bo.py
          #!/usr/bin/env python3
          """bo.py - 一言 + 随机背景，通过管道调用 drm_play_arm64 --show 显示，零 eMMC 写入

          关键机制：
          - 动画父进程退出后释放 DRM Master（dev->master = NULL）
          - --show 子进程 open() 时自动成为新 Master（drm_master_open 逻辑）
          - 每次刷新时：先启动新 --show（成为 Master 并显示），再 kill 旧 --show
          - 旧 --show 被 kill 后释放 Master，新 --show 已经在显示，不会黑屏
          """

          import requests
          import os
          import signal
          import subprocess
          import threading
          import time
          from datetime import datetime, timedelta
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont

          try:
              import numpy as np
              HAS_NUMPY = True
          except ImportError:
              HAS_NUMPY = False

          # ===================== 配置 =====================
          SCREEN_W = 320
          SCREEN_H = 172
          PICSUM_RAW_URL = "https://picsum.photos/320/172"
          FONT_PATH = "/usr/share/fonts/MiSans-Regular.ttf"
          FONT_SIZE = 13
          BG_COLOR_BLACK = (0, 0, 0)
          TEXT_COLOR = (255, 255, 255)
          REQUEST_TIMEOUT = 4
          REFRESH_CYCLE = timedelta(minutes=15)
          NETWORK_CHECK_INTERVAL = 60

          HITOKOTO_URL = "https://v1.hitokoto.cn/?c=f&max_length=60"
          TEST_NET_URL = "https://www.baidu.com"

          FALLBACK_TEXT = """山林不向四季起誓，荣枯随缘；
          海洋不需对沙滩承诺，遇合尽兴。
          喜欢就处，别问是朋友还是恋人！
          关系不是绳子，非要绑住谁的手脚；
          缘分就像山风，吹到哪儿都是风景。
          能走一段是礼物，能走一生是运气。
          被你改变的那一部分我，代替了你永远陪在了我的身边。"""

          DRM_DEVICE = "/dev/dri/card1"
          DRM_PLAY = "/usr/sbin/drm_play_arm64"

          # ===================== 内存缓存 =====================
          _cache = {
              "bg_bytes": None,
              "bg_image": None,
              "current_text": None,
              "next_text": None,
              "next_bg_bytes": None,
              "last_refresh": None,
              "network_available": False,
          }
          _lock = threading.Lock()

          # 当前 --show 子进程的 Popen 对象
          _show_proc = None


          # ===================== 显示函数 =====================
          def display_image(img):
              """将 PIL Image 转为 XRGB8888 并通过管道传给 drm_play_arm64 --show

              流程：
              1. 先 kill 旧的 --show 进程（释放 DRM Master）
              2. 等待 Master 释放（200ms）
              3. 启动新的 --show 进程（open 时自动成为 Master）
              4. 写入像素数据
              5. 等待新进程显示完成

              注意：必须先 kill 旧进程再启动新进程！
              因为同一时刻只能有一个 Master。
              旧进程被 kill → close(fd) → drm_master_release → dev->master = NULL
              新进程 open → dev->master == NULL → 自动成为 Master
              """
              global _show_proc

              if img.size != (SCREEN_W, SCREEN_H):
                  img = img.resize((SCREEN_W, SCREEN_H), Image.Resampling.LANCZOS)

              # 转为 XRGB8888 (内存序 BGRX)
              if HAS_NUMPY:
                  arr = np.array(img.convert("RGB"))
                  bgrx = np.zeros((SCREEN_H, SCREEN_W, 4), dtype=np.uint8)
                  bgrx[:, :, 0] = arr[:, :, 2]  # B
                  bgrx[:, :, 1] = arr[:, :, 1]  # G
                  bgrx[:, :, 2] = arr[:, :, 0]  # R
                  bgrx[:, :, 3] = 0xFF           # X
                  raw_data = bgrx.tobytes()
              else:
                  img_rgb = img.convert("RGB")
                  raw = img_rgb.tobytes()
                  out = bytearray(SCREEN_W * SCREEN_H * 4)
                  for i in range(SCREEN_W * SCREEN_H):
                      out[i*4]   = raw[i*3+2]
                      out[i*4+1] = raw[i*3+1]
                      out[i*4+2] = raw[i*3]
                      out[i*4+3] = 0xFF
                  raw_data = bytes(out)

              # 1. Kill 旧的 --show 进程（释放 DRM Master）
              if _show_proc is not None:
                  try:
                      _show_proc.terminate()  # SIGTERM
                      _show_proc.wait(timeout=2)
                  except Exception:
                      try:
                          _show_proc.kill()  # SIGKILL
                          _show_proc.wait(timeout=1)
                      except Exception:
                          pass
                  _show_proc = None

              # 2. 等待 DRM Master 释放
              time.sleep(0.3)

              # 3. 启动新的 --show 进程
              proc = subprocess.Popen(
                  [DRM_PLAY, "--show", DRM_DEVICE, str(SCREEN_W), str(SCREEN_H)],
                  stdin=subprocess.PIPE,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              # 4. 写入像素数据
              try:
                  proc.stdin.write(raw_data)
                  proc.stdin.close()
              except (BrokenPipeError, OSError):
                  pass

              # 5. 等待新进程完成显示
              #    --show 内部有重试逻辑（最多 5 秒），这里等 2 秒足够
              time.sleep(2)

              # 6. 记录新进程
              _show_proc = proc


          # ===================== 网络检测 =====================
          def network_monitor():
              while True:
                  try:
                      resp = requests.get(TEST_NET_URL, timeout=3)
                      ok = (resp.status_code == 200)
                  except Exception:
                      ok = False

                  with _lock:
                      was_available = _cache["network_available"]
                      _cache["network_available"] = ok

                  if ok and not was_available:
                      threading.Thread(target=preload_sentence, daemon=True).start()
                      threading.Thread(target=preload_background, daemon=True).start()

                  time.sleep(NETWORK_CHECK_INTERVAL)


          # ===================== 素材预加载 =====================
          def preload_sentence():
              try:
                  resp = requests.get(HITOKOTO_URL, timeout=REQUEST_TIMEOUT)
                  resp.raise_for_status()
                  data = resp.json()
                  hitokoto = data.get("hitokoto", "")
                  src = data.get("from", "")
                  sentence = f"{hitokoto}\n\n——{src}"
                  with _lock:
                      _cache["next_text"] = sentence
              except Exception:
                  with _lock:
                      _cache["next_text"] = FALLBACK_TEXT


          def preload_background():
              try:
                  resp = requests.get(PICSUM_RAW_URL, timeout=REQUEST_TIMEOUT)
                  resp.raise_for_status()
                  with _lock:
                      _cache["next_bg_bytes"] = resp.content
              except Exception:
                  pass


          # ===================== 获取背景 =====================
          def get_background_canvas():
              with _lock:
                  need_refresh = _need_refresh()

                  if not need_refresh and _cache["bg_image"] is not None:
                      return _cache["bg_image"].copy()

                  bg_bytes = _cache["next_bg_bytes"]
                  if bg_bytes:
                      try:
                          img = Image.open(BytesIO(bg_bytes)).convert("RGB")
                          _cache["bg_image"] = img
                          _cache["bg_bytes"] = bg_bytes
                          return img.copy()
                      except Exception:
                          pass

                  if _cache["bg_image"] is not None:
                      return _cache["bg_image"].copy()

              return Image.new("RGB", (SCREEN_W, SCREEN_H), BG_COLOR_BLACK)


          # ===================== 获取文字 =====================
          def get_display_text():
              with _lock:
                  need_refresh = _need_refresh()

                  if not need_refresh and _cache["current_text"] is not None:
                      return _cache["current_text"]

                  new_text = _cache["next_text"] if _cache["next_text"] else FALLBACK_TEXT
                  _cache["current_text"] = new_text
                  _cache["last_refresh"] = datetime.now()

              threading.Thread(target=preload_sentence, daemon=True).start()
              threading.Thread(target=preload_background, daemon=True).start()
              return new_text


          def _need_refresh():
              if _cache["last_refresh"] is None:
                  return True
              return (datetime.now() - _cache["last_refresh"]) >= REFRESH_CYCLE


          # ===================== 居中文字 =====================
          def draw_center_text(bg, text):
              draw = ImageDraw.Draw(bg)
              try:
                  font = ImageFont.truetype(FONT_PATH, FONT_SIZE)
              except Exception:
                  font = ImageFont.load_default()

              lines = text.split('\n')
              line_widths = []
              line_heights = []

              for line in lines:
                  bbox = draw.textbbox((0, 0), line, font=font)
                  line_widths.append(bbox[2] - bbox[0])
                  line_heights.append(bbox[3] - bbox[1])

              total_height = sum(line_heights) + (len(lines) - 1) * 4
              y_start = (SCREEN_H - total_height) // 2
              y_pos = y_start

              for i, line in enumerate(lines):
                  x_pos = (SCREEN_W - line_widths[i]) // 2
                  draw.text((x_pos, y_pos), line, font=font, fill=TEXT_COLOR)
                  y_pos += line_heights[i] + 4

              return bg


          # ===================== 主循环 =====================
          def main_loop():
              threading.Thread(target=network_monitor, daemon=True).start()
              threading.Thread(target=preload_sentence, daemon=True).start()
              threading.Thread(target=preload_background, daemon=True).start()

              # 等待预加载完成（最多等 5 秒）
              for _ in range(50):
                  with _lock:
                      if _cache["next_text"] is not None:
                          break
                  time.sleep(0.1)

              # 立刻显示第一帧
              try:
                  bg_canvas = get_background_canvas()
                  show_text = get_display_text()
                  final_img = draw_center_text(bg_canvas, show_text)
                  display_image(final_img)
              except Exception:
                  pass

              # 每 15 分钟刷新
              while True:
                  time.sleep(REFRESH_CYCLE.total_seconds())
                  try:
                      bg_canvas = get_background_canvas()
                      show_text = get_display_text()
                      final_img = draw_center_text(bg_canvas, show_text)
                      display_image(final_img)
                  except Exception:
                      pass


          if __name__ == "__main__":
              main_loop()
          ENDOFPY

      # --- 4. 生成 init.d 开机脚本 ---
      - name: Create init.d boot script
        run: |
          cat << 'EOF' > 99-bootanim
          #!/bin/sh /etc/rc.common

          START=11
          STOP=10

          DRM_DRIVER="panel-mipi-dbi-spi"

          start() {
              PLAYER="/usr/sbin/drm_play_arm64"
              DRM_DEV="/dev/dri/card1"
              
              [ ! -f "$PLAYER" ] && return 1
              
              # 等待 DRM 设备就绪
              i=0
              while [ ! -e "$DRM_DEV" ] && [ $i -lt 10 ]; do
                  sleep 1
                  i=$((i+1))
              done
              [ ! -e "$DRM_DEV" ] && return 1
              
              # 杀掉旧进程
              killall drm_play_arm64 2>/dev/null
              killall -9 python3 2>/dev/null
              sleep 1
              
              # unbind/rebind 驱动，强制重新 probe
              SPI_DEV=""
              for dev in /sys/bus/spi/devices/*; do
                  if [ -f "$dev/modalias" ]; then
                      ALIAS=$(cat "$dev/modalias" 2>/dev/null)
                      case "$ALIAS" in
                          *gc9307*|*panel-mipi-dbi*)
                              SPI_DEV=$(basename "$dev")
                              break
                              ;;
                      esac
                  fi
              done
              
              if [ -n "$SPI_DEV" ] && [ -d "/sys/bus/spi/drivers/$DRM_DRIVER" ]; then
                  echo "$SPI_DEV" > "/sys/bus/spi/drivers/$DRM_DRIVER/unbind" 2>/dev/null
                  sleep 1
                  echo "$SPI_DEV" > "/sys/bus/spi/drivers/$DRM_DRIVER/bind" 2>/dev/null
                  i=0
                  while [ ! -e "$DRM_DEV" ] && [ $i -lt 5 ]; do
                      sleep 1
                      i=$((i+1))
                  done
              fi
              
              # 启动播放器
              "$PLAYER" "$DRM_DEV" >/dev/null 2>&1 &
          }

          stop() {
              killall drm_play_arm64 2>/dev/null
              killall -9 python3 2>/dev/null
          }
          EOF
          chmod +x 99-bootanim

      # --- 5. 生成安装说明 ---
      - name: Create install instructions
        run: |
          cat << 'EOF' > INSTALL.txt
          ============================================
            Boot Animation Installation Guide
          ============================================

          Files:
            drm_play_arm64  - 开机动画 + 图片显示（二合一）
            bo.py           - 一言+背景显示脚本
            99-bootanim     - OpenWrt init.d 开机脚本

          Step 1: 上传文件
          -------------------------
          scp drm_play_arm64 root@192.168.1.1:/usr/sbin/
          scp bo.py root@192.168.1.1:/etc/bo.py
          scp 99-bootanim root@192.168.1.1:/etc/init.d/

          Step 2: 设置权限和启用
          -------------------------
          ssh root@192.168.1.1
          chmod +x /usr/sbin/drm_play_arm64
          chmod +x /etc/bo.py
          chmod +x /etc/init.d/99-bootanim
          /etc/init.d/99-bootanim enable

          工作流程:
          -------------------------
          1. 开机 → init.d 启动 drm_play_arm64（动画模式）
          2. 动画播放 36 秒
          3. 动画播完 → 检测到 /etc/bo.py 存在
          4. fork 子进程运行 bo.py
          5. 父进程立即 close(fd) 退出 → 释放 DRM Master (dev->master = NULL)
          6. bo.py 等待 200ms 后启动 --show 子进程
          7. --show 子进程 open() → dev->master == NULL → 自动成为 Master
          8. --show 调用 drmModeSetCrtc() 显示一言+背景 ✅
          9. 每 15 分钟刷新：kill 旧 --show → 等 300ms → 启动新 --show

          DRM Master 机制说明:
          -------------------------
          - 同一时刻只能有一个 DRM Master
          - open() 时如果 dev->master == NULL，自动成为 Master
          - close() 时如果是当前 Master，dev->master 被设为 NULL
          - drmModeSetCrtc() 需要 Master 权限，否则返回 -EACCES
          - 所以必须先释放旧 Master，新进程才能成为 Master

          卸载:
          /etc/init.d/99-bootanim disable
          rm /usr/sbin/drm_play_arm64
          rm /etc/init.d/99-bootanim
          rm /etc/bo.py
          EOF

      # --- 6. 上传产物 ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: H29K-BootAnimation-Pack
          path: |
            drm_play_arm64
            bo.py
            99-bootanim
            INSTALL.txt
